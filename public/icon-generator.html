<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Jolene App Icon Generator</title>
<style>
  body { display: flex; gap: 40px; padding: 40px; background: #f0f0f0; flex-wrap: wrap; }
  canvas { border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
  .label { text-align: center; font-family: system-ui; margin-top: 8px; font-size: 14px; color: #666; }
</style>
</head>
<body>

<div>
  <canvas id="icon1" width="1024" height="1024"></canvas>
  <div class="label">Option 1 — HeartPulse sur dégradé rose</div>
</div>

<div>
  <canvas id="icon2" width="1024" height="1024"></canvas>
  <div class="label">Option 2 — J stylisé sur dégradé rose→violet</div>
</div>

<div>
  <canvas id="icon3" width="1024" height="1024"></canvas>
  <div class="label">Option 3 — J + pulse minimal</div>
</div>

<p style="width:100%; font-family: system-ui; color: #999;">
  Clic droit sur une icône → "Enregistrer l'image sous" → PNG 1024x1024.<br>
  Glisse-la dans Xcode → Assets.xcassets → AppIcon.
</p>

<script>
// Couleurs Jolene
const ROSE = '#E04590';
const ROSE_DARK = '#C2185B';
const ROSE_LIGHT = '#F06292';
const VIOLET = '#5C3D8F';
const TEAL = '#26A69A';
const WHITE = '#FFFFFF';

// === OPTION 1 : HeartPulse sur dégradé rose ===
(function() {
  const c = document.getElementById('icon1');
  const ctx = c.getContext('2d');
  const s = 1024;

  // Fond dégradé rose → rose foncé
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, ROSE_LIGHT);
  grad.addColorStop(0.5, ROSE);
  grad.addColorStop(1, ROSE_DARK);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, s, s);

  // HeartPulse icon (cœur avec ligne ECG) — dessiné en blanc
  ctx.save();
  ctx.translate(s/2, s/2 - 20);
  ctx.scale(14, 14);

  // Cœur
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-1, 5, -5, 2, -5, -2);
  ctx.bezierCurveTo(-5, -6, -2, -8, 0, -6);
  ctx.bezierCurveTo(2, -8, 5, -6, 5, -2);
  ctx.bezierCurveTo(5, 2, 1, 5, 0, 6);
  ctx.closePath();

  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 0.4;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();
  ctx.stroke();

  // Ligne ECG à travers le cœur
  ctx.beginPath();
  ctx.moveTo(-6, 0);
  ctx.lineTo(-2.5, 0);
  ctx.lineTo(-1.5, -3);
  ctx.lineTo(-0.5, 2);
  ctx.lineTo(0.5, -1.5);
  ctx.lineTo(1.5, 0.5);
  ctx.lineTo(2.5, 0);
  ctx.lineTo(6, 0);
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 0.35;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.restore();

  // Texte "Jolene" en bas
  ctx.font = 'bold 110px Inter, system-ui, sans-serif';
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';
  ctx.fillText('Jolene', s/2, s - 160);
})();

// === OPTION 2 : J stylisé sur dégradé rose → violet ===
(function() {
  const c = document.getElementById('icon2');
  const ctx = c.getContext('2d');
  const s = 1024;

  // Fond dégradé rose → violet
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, ROSE);
  grad.addColorStop(1, VIOLET);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, s, s);

  // Grande lettre J
  ctx.font = '900 580px Inter, system-ui, sans-serif';
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('J', s/2 + 10, s/2 - 20);

  // Petit "olene" en bas
  ctx.font = '600 90px Inter, system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('olene', s/2 + 60, s - 140);
})();

// === OPTION 3 : J + pulse minimal sur fond rose ===
(function() {
  const c = document.getElementById('icon3');
  const ctx = c.getContext('2d');
  const s = 1024;

  ctx.fillStyle = ROSE;
  ctx.fillRect(0, 0, s, s);

  const radGrad = ctx.createRadialGradient(s*0.7, s*0.2, 0, s*0.7, s*0.2, s*0.6);
  radGrad.addColorStop(0, 'rgba(255,255,255,0.12)');
  radGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = radGrad;
  ctx.fillRect(0, 0, s, s);

  ctx.font = '800 420px Inter, system-ui, sans-serif';
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('J', s/2, s/2 - 60);

  ctx.beginPath();
  ctx.moveTo(200, 680);
  ctx.lineTo(380, 680);
  ctx.lineTo(430, 600);
  ctx.lineTo(480, 760);
  ctx.lineTo(530, 640);
  ctx.lineTo(580, 700);
  ctx.lineTo(640, 680);
  ctx.lineTo(824, 680);
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.font = '600 72px Inter, system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.textAlign = 'center';
  ctx.fillText('olene', s/2 + 50, s - 120);
})();

// === OPTION 4 : Style Lovable amélioré — plus contrasté ===
(function() {
  const c4 = document.createElement('canvas');
  c4.id = 'icon4';
  c4.width = 1024;
  c4.height = 1024;
  c4.style.borderRadius = '20px';
  c4.style.boxShadow = '0 4px 20px rgba(0,0,0,0.15)';
  document.body.insertBefore(c4, document.querySelector('p'));
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'Option 4 — Style Lovable contrasté (recommandé)';
  document.body.insertBefore(label, document.querySelector('p'));

  const ctx = c4.getContext('2d');
  const s = 1024;

  // Fond dégradé rose vif → violet profond (plus contrasté que Lovable)
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#E04590');
  grad.addColorStop(0.5, '#C2185B');
  grad.addColorStop(1, '#7B1FA2');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, s, s);

  // Texte "Jolene" — plus gros, centré
  ctx.font = '700 180px Inter, system-ui, sans-serif';
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = '4px';
  ctx.fillText('Jolene', s/2, s/2 - 30);

  // Ligne ECG sous le texte — signature visuelle
  const y = s/2 + 90;
  ctx.beginPath();
  ctx.moveTo(180, y);
  ctx.lineTo(350, y);
  ctx.lineTo(400, y - 50);
  ctx.lineTo(450, y + 60);
  ctx.lineTo(500, y - 30);
  ctx.lineTo(540, y + 15);
  ctx.lineTo(580, y);
  ctx.lineTo(844, y);
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
})();

// === OPTION 5 : J bold seul sur rose foncé (ultra lisible en petit) ===
(function() {
  const c5 = document.createElement('canvas');
  c5.id = 'icon5';
  c5.width = 1024;
  c5.height = 1024;
  c5.style.borderRadius = '20px';
  c5.style.boxShadow = '0 4px 20px rgba(0,0,0,0.15)';
  document.body.insertBefore(c5, document.querySelector('p'));
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'Option 5 — J seul (lisible même en 29px)';
  document.body.insertBefore(label, document.querySelector('p'));

  const ctx = c5.getContext('2d');
  const s = 1024;

  // Fond rose foncé uni
  ctx.fillStyle = '#C2185B';
  ctx.fillRect(0, 0, s, s);

  // Subtil halo lumineux
  const radGrad = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s*0.5);
  radGrad.addColorStop(0, 'rgba(255,255,255,0.08)');
  radGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = radGrad;
  ctx.fillRect(0, 0, s, s);

  // J massif
  ctx.font = '900 620px Inter, system-ui, sans-serif';
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('J', s/2 + 5, s/2 + 10);

  // Micro pulse en bas du J
  const y = s/2 + 250;
  ctx.beginPath();
  ctx.moveTo(340, y);
  ctx.lineTo(430, y);
  ctx.lineTo(460, y - 30);
  ctx.lineTo(490, y + 35);
  ctx.lineTo(520, y - 15);
  ctx.lineTo(545, y + 8);
  ctx.lineTo(570, y);
  ctx.lineTo(684, y);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
})();
</script>
</body>
</html>
