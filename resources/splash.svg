<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <!-- Fond blanc -->
  <rect width="2732" height="2732" fill="#FFFFFF"/>
  <!-- Logo compact et centré : sur écran portrait, iOS affiche en aspectFill
       (crop des bords), donc le logo doit tenir dans ~45% central de la largeur.
       Bloc logo ~760px de large, centré à x=1366, y=1366. -->
  <g transform="translate(986 1286)">
    <!-- HeartPulse lucide, scale 11 → 264px -->
    <g transform="scale(11)" fill="none" stroke="#D41173" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>
    </g>
    <!-- "Jolene" bold, à droite de l'icône -->
    <text x="312" y="190" text-anchor="start"
          font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="200" font-weight="bold" fill="#D41173">Jolene</text>
  </g>
</svg>
