name: Signalement des pages publiques (IndexNow)

# Après un déploiement de production qui change le contenu d'une page publique, signale les pages
# ajoutées, modifiées ou supprimées aux moteurs qui suivent IndexNow (Bing, Yandex, Seznam, Naver).
# Google ne le suit pas.
#
# Déclencheur : src/lib/seo-empreintes.json, qui ne change que si le contenu d'une page change
# (test src/lib/seo-empreintes.test.ts). Seules les adresses dont l'empreinte diffère du commit
# précédent partent : le protocole demande de ne pas resignaler une page inchangée.
#
# Aucun secret : la clé du protocole est publique par construction
# (public/jolene-sante-indexnow-2026.txt). Ce qui part : l'hôte, la clé et ces adresses.
# Détail : scripts/seo/indexnow.mjs.
#
# Une panne du service ne rend jamais ce workflow rouge (avertissement) ; seul un refus de notre
# fait (fichier de clé non servi) échoue, car il demande une correction.

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/seo-empreintes.json'
  workflow_dispatch: # À la main, après une refonte ou une migration : signale tout le sitemap en ligne.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  signaler:
    name: Signaler les pages changées
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # le commit précédent sert de point de comparaison
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Attendre le déploiement de production, puis signaler les pages changées
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/seo/indexnow.mjs --changements --attendre

      - name: Signaler tout le sitemap (déclenchement manuel)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/seo/indexnow.mjs --tout
