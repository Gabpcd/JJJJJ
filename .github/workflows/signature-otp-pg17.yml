name: Signature OTP — PostgreSQL 17
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signature-fixed:
    if: github.repository == 'Gabpcd/JJJJJ'
    name: Signature OTP et accès certificat — PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: signature_otp_diagnostic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-ci-ephemere
        ports: ['127.0.0.1:54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d signature_otp_diagnostic"
          --health-interval 5s --health-timeout 5s --health-retries 6
    env:
      JOLENE_SIGNATURE_WITNESS: CI_EPHEMERE
      PGHOST: 127.0.0.1
      PGPORT: '54329'
      PGDATABASE: signature_otp_diagnostic
      PGUSER: postgres
      PGPASSWORD: fixture-ci-ephemere
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Vérifier le SHA exécuté
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Vérifier la préparation du banc après actualisation du schéma
        run: python3 -B -m unittest discover -s tests/python -p test_signature_otp_witness.py
      - name: Qualification du correctif et rollback intégral
        run: python3 scripts/ci/signature-otp-fix-pg17.py > signature-otp-fixed-public.json
      - name: Reçu fermé uniquement
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: signature-otp-fixed-public
          path: signature-otp-fixed-public.json
          retention-days: 7
          if-no-files-found: error
