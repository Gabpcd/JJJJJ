name: Playwright E2E tests

# Tests Playwright à chaque PR + push main.
# Stratégie : Chromium + les gates mobiles ciblés bloquent les PR et main. Les
# parcours utilisant la base de test partagée en production sont sérialisés.
# Les simulations entièrement locales sont réparties en lots indépendants.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rotate_fixture_credentials:
        description: Rotation manuelle des deux fixtures techniques uniquement
        type: boolean
        default: false
      confine_historical_fixture_cohort:
        description: Confinement manuel de la cohorte historique exacte de 1088 comptes
        type: boolean
        default: false
      expected_sha:
        description: SHA complet du code relu, identique à la branche sélectionnée
        type: string
        default: ''
      confirmation:
        description: ROTATE_ONLY_PLAYWRIGHT_FIXTURES ou CONFINE_EXACT_1088_D49ACE5F selon l'opération
        type: string
        default: ''

permissions:
  contents: read
  # Requis pour attendre le déploiement Supabase du SHA testé sur main.
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # URL et clés client publiques ; les identifiants des fixtures restent privés.
  # La clé service_role est résolue via SUPABASE_ACCESS_TOKEN.
  E2E_SUPABASE_URL: 'https://flripxtsyegjshnhzjkz.supabase.co'
  E2E_PUBLISHABLE_KEY: 'sb_publishable_wrR-KGZqiovTPBym6mjXPw_V8l4ae-C'
  # Clé anon legacy (publique, présente dans tout bundle client historique) :
  # verify-rpps compare le Bearer à SUPABASE_ANON_KEY pour exempter de captcha.
  E2E_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscmlweHRzeWVnanNobmh6amt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTk2OTYsImV4cCI6MjA4ODc5NTY5Nn0.ywor0oGht7aYi8J1YwNRo_rfmJtQ6GBodmCp1kAB3UY'
  SUPABASE_PROJECT_REF: 'flripxtsyegjshnhzjkz'

jobs:
  validate-maintenance-mode:
    name: Vérifier le choix exclusif de maintenance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refuser deux opérations simultanées
        env:
          ROTATE: ${{ inputs.rotate_fixture_credentials }}
          CONFINE: ${{ inputs.confine_historical_fixture_cohort }}
        run: |
          if [ "$ROTATE" = true ] && [ "$CONFINE" = true ]; then
            echo 'Choisir une seule opération de maintenance.'
            exit 1
          fi

  confine-historical-fixture-cohort:
    name: Confinement manuel des 1088 fixtures historiques
    needs: validate-maintenance-mode
    if: github.event_name == 'workflow_dispatch' && inputs.confine_historical_fixture_cohort && !inputs.rotate_fixture_credentials
    concurrency:
      group: jolene-playwright-shared-database
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Vérifier les gardes sans service ni navigateur
        run: node --test tests/node/temporary-fixture-plan.node.mjs tests/node/temporary-fixture-confinement.node.mjs
      - name: Confinement borné puis contrôle des UUID figés
        run: node scripts/ci/confine-temporary-playwright-fixtures.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          COHORT_REVIEW_REFERENCE_JSON: ${{ secrets.COHORT_REVIEW_REFERENCE_JSON }}
          FIXTURE_EXPECTED_SHA: ${{ inputs.expected_sha }}
          FIXTURE_CONFINEMENT_CONFIRMATION: ${{ inputs.confirmation }}
          FIXTURE_SHARED_LOCK: jolene-playwright-shared-database
      - name: Reçu fermé de confinement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: temporary-fixture-confinement-public
          path: temporary-fixture-confinement-public.json
          if-no-files-found: warn
          retention-days: 7

  rotate-fixture-credentials:
    name: Rotation manuelle des deux fixtures techniques
    env:
      E2E_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_FIXTURE_PASSWORD }}
    needs: validate-maintenance-mode
    if: github.event_name == 'workflow_dispatch' && inputs.rotate_fixture_credentials && !inputs.confine_historical_fixture_cohort
    concurrency:
      group: jolene-playwright-shared-database
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: node scripts/ci/check-playwright-fixture-secret.mjs
      - run: npm ci --ignore-scripts
      - name: Contrôler, tourner et révoquer les deux fixtures
        run: node scripts/ci/rotate-playwright-fixtures.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FIXTURE_ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
          FIXTURE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      - name: Reçu fermé de maintenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: fixture-rotation-public
          path: fixture-rotation-public.json
          if-no-files-found: warn
          retention-days: 7

  simulation-interfaces:
    if: ${{ !inputs.rotate_fixture_credentials && !inputs.confine_historical_fixture_cohort }}
    name: Simulation interfaces (${{ matrix.project }}, lot ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    # Les 309 scénarios par format sont répartis en trois lots disjoints.
    # La borne Playwright de 30 min laisse une marge pour déposer les preuves.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [ipad-portrait, ipad-paysage, iphone, android, ordinateur]
        # Conserver tout le corpus, sans allonger les limites des assertions.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build isolé, sans accès aux services réels
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:8890
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jolene_simulation
          VITE_SUPABASE_ANON_KEY: sb_publishable_jolene_simulation
          VITE_SENTRY_DSN: ''
          VITE_TURNSTILE_SITE_KEY: ''
          VITE_ENV: test
      - name: Parcours publics, inscription, connexion et espaces métier
        run: npx playwright test --config=e2e/playwright.recette-complete.config.ts --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 --global-timeout=1800000
        env:
          RECETTE_START_SERVER: '1'
          CI: 'true'
      - name: Preuves de simulation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: recette-complete-${{ matrix.project }}-lot-${{ matrix.shard }}
          path: test-results/recette-complete/
          retention-days: 7

  # PR — chromium only (job rapide pour feedback)
  e2e-pr:
    name: Playwright E2E (PR — Chromium)
    if: github.event_name == 'pull_request'
    # Verrou détenu par GitHub jusqu'à la fin du job et de son nettoyage.
    # queue:max conserve les jobs en attente au lieu de les remplacer.
    concurrency:
      group: jolene-playwright-shared-database
      queue: max
      cancel-in-progress: false
    env:
      E2E_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_FIXTURE_PASSWORD }}
      # La PR précède nécessairement le déploiement de ses migrations. Ces
      # replis sont limités à ce job PR et hérités par ses trois invocations
      # Playwright (smoke iPad, suite Chromium et diagnostic a11y).
      E2E_ALLOW_PGRST202_ELIGIBILITY_FALLBACK: 'true'
      E2E_ALLOW_FROZEN_TEST_QUARANTINE: 'true'
    runs-on: ubuntu-latest
    # Conteneur officiel Playwright : navigateurs + dépendances système
    # préinstallés. Indispensable : `npx playwright install --with-deps`
    # hangait indéfiniment sur la phase apt des runners (job tué à 25 min).
    # Le tag DOIT matcher la version résolue du lockfile (1.58.2).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    # L'attente de concurrence GitHub précède l'allocation du runner.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Vérifier le secret privé des fixtures
        run: node scripts/ci/check-playwright-fixture-secret.mjs
      - name: Résoudre la clé service_role (Management API — autonome)
        # Le secret GitHub SUPABASE_SERVICE_ROLE_KEY contenait la clé anon
        # (79 tests backend en échec, « permission denied for table … »).
        # Plutôt que de dépendre d'un secret manuel désynchronisable, on
        # demande la vraie clé à l'API Management avec SUPABASE_ACCESS_TOKEN
        # (token déjà utilisé par deploy-supabase, donc valide). La clé est
        # masquée des logs puis injectée via GITHUB_ENV pour les steps suivants.
        env:
          SB_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FALLBACK_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          RESP=$(curl -s --max-time 20 \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SB_ACCESS_TOKEN" || true)
          KEY=$(printf '%s' "$RESP" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const a=JSON.parse(d);const k=a.find(x=>x.name==="service_role"&&x.api_key)||a.find(x=>x.type==="secret"&&!x.disabled&&x.api_key);process.stdout.write(k&&k.api_key?k.api_key:"")}catch(e){}})')
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Clé service_role résolue via Management API ✓"
          else
            echo "::warning::Management API injoignable — fallback sur le secret GitHub SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$FALLBACK_KEY" >> "$GITHUB_ENV"
          fi
      - name: Préflight credentials (échec immédiat si credential invalide)
        run: |
          set -e
          echo "::add-mask::$E2E_TEST_PASSWORD"
          # 1) La clé résolue doit être un VRAI service_role : seul lui passe
          # l'endpoint admin GoTrue (une clé anon répond 401/403 ici alors
          # qu'elle répond 200 sur le REST public).
          code=000
          for tentative in 1 2 3; do
            code=$(curl -s --max-time 45 -o /dev/null -w '%{http_code}' \
              "$E2E_SUPABASE_URL/auth/v1/admin/users?per_page=1" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || true)
            [ "$code" = "200" ] && break
            case "$code" in 429|5??|000) sleep $((tentative * 3));; *) break;; esac
          done
          if [ "$code" != "200" ]; then
            echo "::error::La clé service_role résolue est invalide (admin GoTrue → HTTP $code). Vérifier SUPABASE_ACCESS_TOKEN (Dashboard → Account → Access Tokens) ou le secret SUPABASE_SERVICE_ROLE_KEY de fallback."
            exit 1
          fi
          echo "service_role OK (admin GoTrue 200)"
          # 2) Login compte test (publishable key + secret privé dédié)
          auth_response=$(mktemp)
          trap 'rm -f "$auth_response"' EXIT
          code=000
          for tentative in 1 2 3; do
            code=$(curl -s --max-time 45 -o "$auth_response" -w '%{http_code}' \
              "$E2E_SUPABASE_URL/auth/v1/token?grant_type=password" \
              -H "apikey: $E2E_PUBLISHABLE_KEY" -H "Content-Type: application/json" \
              -d "{\"email\":\"playwright-soignant@jolene.app\",\"password\":\"$E2E_TEST_PASSWORD\"}" || true)
            [ "$code" = "200" ] && break
            case "$code" in 429|5??|000) sleep $((tentative * 3));; *) break;; esac
          done
          if [ "$code" != "200" ]; then
            echo "::error::Login compte test playwright-soignant impossible (HTTP $code) — mot de passe DB désynchronisé."
            exit 1
          fi
          echo "login compte test OK"
          # Le préflight ne doit pas laisser une session Auth à chaque run.
          access_token=$(node -e 'const fs=require("fs");try{const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(d.access_token||"")}catch{}' "$auth_response")
          if [ -n "$access_token" ]; then
            curl -s -o /dev/null -X POST \
              "$E2E_SUPABASE_URL/auth/v1/logout?scope=local" \
              -H "apikey: $E2E_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $access_token" || true
          fi
      - name: Résoudre le secret admin E2E valide
        env:
          PLAYWRIGHT_ADMIN_EMAIL_PRIMARY: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD_PRIMARY: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_ADMIN_PASSWORD_FALLBACK: ${{ secrets.ADMIN_TEST_PASSWORD }}
        run: node scripts/ci/resolve-playwright-admin-password.mjs
      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
      - name: Start preview server
        run: |
          # Les Edge Functions d'inscription autorisent explicitement cette
          # origine locale. Garder le même origin ici rend le parcours réel
          # (Auth + register-*) testable dans la CI, sans faux CORS.
          npx vite preview --port 8080 --host 0.0.0.0 &
          npx wait-on http://localhost:8080 -t 30000 || true
      - name: Vérifier App Review sur un vrai iPad WebKit (prioritaire)
        # Ce smoke doit passer AVANT la longue suite Chromium : après plusieurs
        # centaines de scénarios Auth, une indisponibilité temporaire de GoTrue
        # ne doit pas être confondue avec une régression du correctif iPad.
        run: node scripts/ci/run-playwright-public.mjs --phase app-review -- test e2e/release-review-smoke.spec.ts --project=tablet-ipad
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Run Playwright tests (chromium)
        id: playwright-tests
        # SUPABASE_SERVICE_ROLE_KEY arrive via GITHUB_ENV (step « Résoudre la
        # clé ») — ne PAS la remapper ici depuis secrets (valeur fausse).
        # Déjà exécuté ci-dessus avec le moteur/viewport réellement utilisés
        # sur iPad ; ne pas le rejouer en fin de suite sous Chromium.
        run: node scripts/ci/run-playwright-public.mjs --phase chromium -- test --project=chromium --grep-invert='release review — reprise de session iPad'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Gate mobile Série C (iPhone WebKit + Pixel Android)
        # Ces scénarios sont volontairement explicites : ils couvrent toutes
        # les routes soignant/établissement, les cinq largeurs mobiles et les
        # deux inscriptions réelles jusqu'aux Edge Functions. Ils ont révélé
        # les régressions que la suite Chromium desktop ne pouvait pas voir.
        run: |
          UX_AUDIT_WIDTH=375 UX_AUDIT_HEIGHT=667 node scripts/ci/run-playwright-public.mjs --phase series-c-ios -- test \
            e2e/non-regression/ios-series-c-audit.spec.ts \
            e2e/non-regression/signup-series-c-audit.spec.ts \
            --project=ios-webkit-audit
          UX_AUDIT_WIDTH=412 UX_AUDIT_HEIGHT=915 node scripts/ci/run-playwright-public.mjs --phase series-c-android -- test \
            e2e/non-regression/ios-series-c-audit.spec.ts \
            e2e/non-regression/signup-series-c-audit.spec.ts \
            --project=android-pixel-audit
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Diagnostic a11y si échec (résumé sans données de page)
        if: failure() && steps.playwright-tests.outcome == 'failure'
        run: node scripts/ci/run-playwright-public.mjs --phase a11y -- test e2e/a11y.spec.ts --project=chromium --retries=0 || true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Résumé public sans sessions ni contenu de page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-summary-chromium
          path: playwright-public/*.json
          retention-days: 7

  # push main — matrix complète (cross-browser + mobile)
  e2e-main:
    name: Playwright E2E (${{ matrix.project }})
    env:
      E2E_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_FIXTURE_PASSWORD }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.rotate_fixture_credentials && !inputs.confine_historical_fixture_cohort)
    concurrency:
      group: jolene-playwright-shared-database
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Bloquant comme le job PR. La matrice est volontairement limitée à
    # Chromium et tous les runs sont sérialisés ci-dessus : un échec ne doit
    # plus être transformé en faux workflow vert.
    # Conteneur officiel Playwright (chromium + firefox + webkit préinstallés,
    # toutes deps système incluses). Tag = version résolue lockfile (1.58.2).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    # Inclut l'attente éventuelle du déploiement Supabase et la suite complète.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      # chromium seul sur main : la matrice 5-navigateurs partageait la MÊME DB
      # prod + les mêmes comptes test → cleanup/seed d'un navigateur écrasant les
      # données d'un autre = rouge aléatoire systématique (sans bug produit). On
      # garde le navigateur principal (= le job PR, fiable). Pour relancer la
      # couverture cross-browser/mobile à la demande : ajouter temporairement
      # firefox/webkit/mobile-iphone/mobile-pixel ici et lancer en workflow_dispatch.
      max-parallel: 1
      matrix:
        project:
          - chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Attendre Deploy Supabase du même SHA
        if: github.event_name == 'push'
        timeout-minutes: 21
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          SUPABASE_DEPLOY_MAX_WAIT_MS: '1200000'
        run: node scripts/ci/wait-for-supabase-deploy.mjs
      - name: Install dependencies
        run: npm ci
      - name: Vérifier le secret privé des fixtures
        run: node scripts/ci/check-playwright-fixture-secret.mjs
      - name: Résoudre la clé service_role (Management API — autonome)
        # Même mécanique que le job PR : la vraie clé service_role est
        # récupérée via l'API Management (le secret GitHub homonyme est faux).
        env:
          SB_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FALLBACK_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          RESP=$(curl -s --max-time 20 \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SB_ACCESS_TOKEN" || true)
          KEY=$(printf '%s' "$RESP" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const a=JSON.parse(d);const k=a.find(x=>x.name==="service_role"&&x.api_key)||a.find(x=>x.type==="secret"&&!x.disabled&&x.api_key);process.stdout.write(k&&k.api_key?k.api_key:"")}catch(e){}})')
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Clé service_role résolue via Management API ✓"
          else
            echo "::warning::Management API injoignable — fallback sur le secret GitHub SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$FALLBACK_KEY" >> "$GITHUB_ENV"
          fi
      - name: Résoudre le secret admin E2E valide
        env:
          PLAYWRIGHT_ADMIN_EMAIL_PRIMARY: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD_PRIMARY: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_ADMIN_PASSWORD_FALLBACK: ${{ secrets.ADMIN_TEST_PASSWORD }}
        run: node scripts/ci/resolve-playwright-admin-password.mjs
      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
      - name: Start preview server
        run: |
          npx vite preview --port 8080 --host 0.0.0.0 &
          npx wait-on http://localhost:8080 -t 30000 || true
      - name: Vérifier App Review sur un vrai iPad WebKit (prioritaire)
        run: node scripts/ci/run-playwright-public.mjs --phase app-review -- test e2e/release-review-smoke.spec.ts --project=tablet-ipad
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Run Playwright tests (${{ matrix.project }})
        # SUPABASE_SERVICE_ROLE_KEY arrive via GITHUB_ENV (step « Résoudre la
        # clé ») — ne PAS la remapper ici depuis secrets (valeur fausse).
        # Le contrôle iPad ci-dessus est volontairement isolé et prioritaire.
        run: node scripts/ci/run-playwright-public.mjs --phase chromium -- test --project=${{ matrix.project }} --grep-invert='release review — reprise de session iPad'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Gate mobile Série C (iPhone WebKit + Pixel Android)
        run: |
          UX_AUDIT_WIDTH=375 UX_AUDIT_HEIGHT=667 node scripts/ci/run-playwright-public.mjs --phase series-c-ios -- test \
            e2e/non-regression/ios-series-c-audit.spec.ts \
            e2e/non-regression/signup-series-c-audit.spec.ts \
            --project=ios-webkit-audit
          UX_AUDIT_WIDTH=412 UX_AUDIT_HEIGHT=915 node scripts/ci/run-playwright-public.mjs --phase series-c-android -- test \
            e2e/non-regression/ios-series-c-audit.spec.ts \
            e2e/non-regression/signup-series-c-audit.spec.ts \
            --project=android-pixel-audit
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Résumé public sans sessions ni contenu de page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-summary-${{ matrix.project }}
          path: playwright-public/*.json
          retention-days: 7
