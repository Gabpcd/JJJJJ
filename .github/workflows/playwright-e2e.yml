name: Playwright E2E tests

# Tests Playwright à chaque PR + push main.
# Stratégie matrix :
#   - PR : chromium uniquement (rapidité review)
#   - push main : chromium + firefox + webkit + mobile-iphone + mobile-pixel
#     (couverture cross-browser + mobile complet)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Un seul run E2E par ref à la fois : la suite tourne contre la PROD PARTAGÉE
# (seed/cleanup sur les mêmes comptes test). Deux runs simultanés se purgent
# mutuellement leurs seeds (beforeAll escrow) et cassent les assertions en
# delta. Un nouveau push annule le run devenu obsolète.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Valeurs PUBLIQUES hardcodées (présentes dans le bundle client / le code du
  # repo) : on ne dépend plus de secrets GitHub potentiellement désynchronisés.
  # Diagnostic 11/06 : le secret PLAYWRIGHT_TEST_PASSWORD ne correspondait pas
  # au mot de passe réel des comptes test (vérifié bcrypt en DB) → 119 fails.
  # La clé service_role n'est PLUS lue depuis le secret GitHub (qui contenait
  # en réalité la clé anon → 79 fails) : elle est résolue à chaque run via
  # l'API Management Supabase avec SUPABASE_ACCESS_TOKEN (le même token que
  # deploy-supabase, prouvé fonctionnel). Cf. step « Résoudre la clé ».
  E2E_SUPABASE_URL: 'https://flripxtsyegjshnhzjkz.supabase.co'
  E2E_PUBLISHABLE_KEY: 'sb_publishable_wrR-KGZqiovTPBym6mjXPw_V8l4ae-C'
  # Clé anon legacy (publique, présente dans tout bundle client historique) :
  # verify-rpps compare le Bearer à SUPABASE_ANON_KEY pour exempter de captcha.
  E2E_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscmlweHRzeWVnanNobmh6amt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMTk2OTYsImV4cCI6MjA4ODc5NTY5Nn0.ywor0oGht7aYi8J1YwNRo_rfmJtQ6GBodmCp1kAB3UY'
  E2E_TEST_PASSWORD: 'Playwright!Test2026'
  SUPABASE_PROJECT_REF: 'flripxtsyegjshnhzjkz'

jobs:
  # PR — chromium only (job rapide pour feedback)
  e2e-pr:
    name: Playwright E2E (PR — Chromium)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Conteneur officiel Playwright : navigateurs + dépendances système
    # préinstallés. Indispensable : `npx playwright install --with-deps`
    # hangait indéfiniment sur la phase apt des runners (job tué à 25 min).
    # Le tag DOIT matcher la version résolue du lockfile (1.58.2).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Résoudre la clé service_role (Management API — autonome)
        # Le secret GitHub SUPABASE_SERVICE_ROLE_KEY contenait la clé anon
        # (79 tests backend en échec, « permission denied for table … »).
        # Plutôt que de dépendre d'un secret manuel désynchronisable, on
        # demande la vraie clé à l'API Management avec SUPABASE_ACCESS_TOKEN
        # (token déjà utilisé par deploy-supabase, donc valide). La clé est
        # masquée des logs puis injectée via GITHUB_ENV pour les steps suivants.
        env:
          SB_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FALLBACK_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          RESP=$(curl -s --max-time 20 \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SB_ACCESS_TOKEN" || true)
          KEY=$(printf '%s' "$RESP" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const a=JSON.parse(d);const k=a.find(x=>x.name==="service_role"&&x.api_key)||a.find(x=>x.type==="secret"&&!x.disabled&&x.api_key);process.stdout.write(k&&k.api_key?k.api_key:"")}catch(e){}})')
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Clé service_role résolue via Management API ✓"
          else
            echo "::warning::Management API injoignable — fallback sur le secret GitHub SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$FALLBACK_KEY" >> "$GITHUB_ENV"
          fi
      - name: Préflight credentials (échec immédiat si credential invalide)
        run: |
          set -e
          # 1) La clé résolue doit être un VRAI service_role : seul lui passe
          # l'endpoint admin GoTrue (une clé anon répond 401/403 ici alors
          # qu'elle répond 200 sur le REST public).
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$E2E_SUPABASE_URL/auth/v1/admin/users?per_page=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          if [ "$code" != "200" ]; then
            echo "::error::La clé service_role résolue est invalide (admin GoTrue → HTTP $code). Vérifier SUPABASE_ACCESS_TOKEN (Dashboard → Account → Access Tokens) ou le secret SUPABASE_SERVICE_ROLE_KEY de fallback."
            exit 1
          fi
          echo "service_role OK (admin GoTrue 200)"
          # 2) Login compte test (publishable key + mot de passe fixe)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$E2E_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $E2E_PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"playwright-soignant@jolene.app\",\"password\":\"$E2E_TEST_PASSWORD\"}")
          if [ "$code" != "200" ]; then
            echo "::error::Login compte test playwright-soignant impossible (HTTP $code) — mot de passe DB désynchronisé."
            exit 1
          fi
          echo "login compte test OK"
      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --host 0.0.0.0 &
          npx wait-on http://127.0.0.1:4173 -t 30000 || true
      - name: Run Playwright tests (chromium)
        # SUPABASE_SERVICE_ROLE_KEY arrive via GITHUB_ENV (step « Résoudre la
        # clé ») — ne PAS la remapper ici depuis secrets (valeur fausse).
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Détail a11y si échec (rapport court en fin de log)
        if: failure()
        run: npx playwright test e2e/a11y.spec.ts --project=chromium --reporter=line --retries=0 || true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          CI: 'true'
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 7

  # push main — matrix complète (cross-browser + mobile)
  e2e-main:
    name: Playwright E2E (${{ matrix.project }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Informatif (comme e2e-pr) : la matrice cross-browser sur la MÊME DB prod a
    # une flakiness inhérente (seed/cleanup partagés, timing Safari/Firefox). Les
    # vrais gates bloquants sont Typecheck+build / Drift / Lighthouse / Vercel.
    continue-on-error: true
    # Conteneur officiel Playwright (chromium + firefox + webkit préinstallés,
    # toutes deps système incluses). Tag = version résolue lockfile (1.58.2).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # chromium seul sur main : la matrice 5-navigateurs partageait la MÊME DB
      # prod + les mêmes comptes test → cleanup/seed d'un navigateur écrasant les
      # données d'un autre = rouge aléatoire systématique (sans bug produit). On
      # garde le navigateur principal (= le job PR, fiable). Pour relancer la
      # couverture cross-browser/mobile à la demande : ajouter temporairement
      # firefox/webkit/mobile-iphone/mobile-pixel ici et lancer en workflow_dispatch.
      max-parallel: 1
      matrix:
        project:
          - chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Résoudre la clé service_role (Management API — autonome)
        # Même mécanique que le job PR : la vraie clé service_role est
        # récupérée via l'API Management (le secret GitHub homonyme est faux).
        env:
          SB_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FALLBACK_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          RESP=$(curl -s --max-time 20 \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SB_ACCESS_TOKEN" || true)
          KEY=$(printf '%s' "$RESP" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const a=JSON.parse(d);const k=a.find(x=>x.name==="service_role"&&x.api_key)||a.find(x=>x.type==="secret"&&!x.disabled&&x.api_key);process.stdout.write(k&&k.api_key?k.api_key:"")}catch(e){}})')
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Clé service_role résolue via Management API ✓"
          else
            echo "::warning::Management API injoignable — fallback sur le secret GitHub SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$FALLBACK_KEY" >> "$GITHUB_ENV"
          fi
      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --host 0.0.0.0 &
          npx wait-on http://127.0.0.1:4173 -t 30000 || true
      - name: Run Playwright tests (${{ matrix.project }})
        # SUPABASE_SERVICE_ROLE_KEY arrive via GITHUB_ENV (step « Résoudre la
        # clé ») — ne PAS la remapper ici depuis secrets (valeur fausse).
        run: npx playwright test --project=${{ matrix.project }}
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
          CI: 'true'
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7
