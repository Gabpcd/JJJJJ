name: Validate PR (typecheck + build + drift detection)

# Vérifie la qualité de chaque PR avant merge :
# 1. TypeScript strict compile
# 2. Build Vite (repère les erreurs d'import et de bundling)
# 3. Drift detection : cherche les patterns hérités de Lovable dans les
#    edge functions et le frontend, fail si détecté
# 4. Contrat front ↔ back : échoue si le frontend appelle un RPC / une edge
#    function / un bucket qui n'existe NI en prod NI dans le repo (anti-raccord
#    mort — la classe de bug qui a tué fn_ma_streak, fn_soignant_score_breakdown,
#    les buckets factures-honoraires/avoirs, etc.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main] # double-check post-merge

# Force les actions JS à utiliser Node 24 (Node 20 est déprécié sur GitHub
# Actions runners depuis le 19 sept 2025, removal le 16 sept 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  typecheck-and-build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        # `tsc -b` traverse les references (tsconfig.app.json + tsconfig.node.json).
        # `tsc --noEmit` sans -p ou -b ne vérifierait RIEN car le tsconfig.json
        # racine contient files: [] + des references — bug subtil qui a laissé
        # passer des "Cannot find name" en prod (cf. crash dashboard AS sur
        # getLabelProfession non importé).
        run: npx tsc -b

      - name: Build
        run: npm run build

  drift-detection:
    name: Drift detection (Lovable legacy patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for app.jolene.app legacy domain
        run: |
          # Les seules occurrences légitimes sont :
          # - src/lib/biometric.ts (namespace Keychain interne, ne doit PAS changer)
          # - src/components/SyncCalendrier.tsx (UID iCal stable, ne doit PAS changer)
          # Tout le reste doit être jolene.app
          echo "::group::Scanning for 'app.jolene.app' in edge functions"
          # Exclure les .md (docs qui peuvent légitimement mentionner le drift historique).
          # Exclure aussi les littéraux CORS (chaînes 'https://app.jolene.app' ou
          # "https://app.jolene.app") : ce sont des entrées de whitelist d'origine
          # autorisées dans les fonctions exposées au browser. Tout autre usage
          # (URL hardcodée comme destination fetch, redirect, lien, etc.) reste interdit.
          HITS=$(grep -rn --include='*.ts' --include='*.js' "app\.jolene\.app" supabase/functions/ 2>/dev/null \
            | grep -vE "['\"]https://app\.jolene\.app['\"]" || true)
          if [ -n "$HITS" ]; then
            echo "::error::app.jolene.app found in edge function source code — this is legacy Lovable drift"
            echo "$HITS"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Scanning for '#17A2B8' (ancien turquoise legacy) in code"
          # Scope: only real source files (not docs that may legitimately mention drift)
          HITS=$(grep -rn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.css' --include='*.html' "#17A2B8" src/ supabase/functions/ public/ 2>/dev/null \
            | grep -v "^[[:space:]]*//" \
            | grep -v "^[[:space:]]*\*" || true)
          if [ -n "$HITS" ]; then
            echo "::warning::Old turquoise branding found in code:"
            echo "$HITS"
          fi
          echo "::endgroup::"

          echo "::group::Scanning for ancient Lovable imports"
          if grep -rn "from ['\"]lovable" src/ 2>/dev/null; then
            echo "::error::Lovable imports found — should be removed"
            exit 1
          fi
          echo "::endgroup::"

      - name: Check Vercel config sanity
        run: |
          echo "::group::Checking index.html has canonical URL"
          if ! grep -q 'rel="canonical"' index.html; then
            echo "::warning::index.html is missing canonical URL (SEO)"
          fi
          echo "::endgroup::"

          echo "::group::Checking Open Graph URLs point to jolene.app"
          if grep -q 'og:url.*app\.jolene\.app' index.html; then
            echo "::error::og:url points to old app.jolene.app domain"
            exit 1
          fi
          echo "::endgroup::"

  contract-check:
    name: Contrat front ↔ back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Vérifier les raccords front ↔ back
        # Le script n'a AUCUNE dépendance npm (built-ins Node + fetch global) →
        # pas de `npm ci`. Introspection PROD via Management API (token + ref).
        # L'« existant » = état prod ∪ objets définis dans le repo (migrations +
        # supabase/functions), donc une PR qui ajoute backend+frontend ensemble
        # ne déclenche pas de faux positif.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Introspection PROD indisponible (secrets manquants) — vérification de contrat ignorée pour ne pas produire de faux négatifs."
            exit 0
          fi
          node scripts/check-contrat-frontend-backend.mjs

  # ── B7 (Lots 19+) — checks requis : guards + non-régression + escrow gaté ──

  guards:
    name: Garde-fous (test:guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: test:guards (grep non-régression, pur)
        run: bash tests/non-regression/guards.sh

  regression:
    name: Non-régression (dérivation + schema + invoicing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: test:regression:derivation (pur, toujours bloquant)
        run: npm run test:regression:derivation
      - name: test:schema + invoicing (DB) — dégradation gracieuse si secret absent
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL absent — schema+invoicing (DB) ignorés pour ne pas produire de faux négatif. Câbler ce secret pour rendre le check pleinement bloquant (B7)."
            exit 0
          fi
          npm run test:schema
          npm run test:regression:invoicing

  escrow-gate:
    name: Escrow (recette si paiements touchés)
    # Check REQUIS et TOUJOURS répondant : no-op vert quand le diff ne touche ni
    # supabase/ ni les chemins paiements/escrow (un check requis ne peut pas être
    # conditionnel/skippé, sinon les PR restent bloquées « en attente »).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Portée du diff
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE"...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || true)
          fi
          echo "Fichiers modifiés :"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qiE '^supabase/|escrow|paiement|stripe|sepa|mandat|facturation'; then
            echo "touche=true" >> "$GITHUB_OUTPUT"
          else
            echo "touche=false" >> "$GITHUB_OUTPUT"
          fi
      - name: No-op — paiements non concernés (check vert)
        if: steps.scope.outputs.touche == 'false'
        run: echo "✅ Le diff ne touche ni supabase/ ni les chemins paiements/escrow — test:escrow non requis."
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.touche == 'true'
        with:
          node-version: '24'
          cache: 'npm'
      - name: Recette escrow (mode test Stripe)
        if: steps.scope.outputs.touche == 'true'
        # Noms de variables attendus par e2e/helpers/db.ts : SUPABASE_URL +
        # SUPABASE_SERVICE_ROLE_KEY + SUPABASE_PUBLISHABLE_KEY.
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_ANON_KEY }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
        # Dégradation gracieuse : si l'env recette est incomplet (notamment la clé
        # Stripe test pas encore câblée), on NE FAIT PAS échouer le check — sinon
        # toute PR touchant supabase/ serait bloquée avant que les secrets soient
        # posés. Warning + exit 0. Le check devient pleinement bloquant une fois
        # les 3 secrets présents (SUPABASE_URL, SERVICE_ROLE_KEY, STRIPE test).
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$STRIPE_SECRET_KEY_TEST" ]; then
            echo "::warning::Env recette escrow incomplet (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / STRIPE_SECRET_KEY_TEST) — recette ignorée pour ne pas produire de faux négatif. Câbler ces 3 secrets pour activer la recette escrow bloquante (B7)."
            exit 0
          fi
          npm ci
          npx playwright install --with-deps chromium
          npm run test:escrow

  # NB : le job supabase-advisors a été retiré parce que l'endpoint
  # /v1/projects/{ref}/advisors n'existe pas dans le Management API public.
  # Les advisors restent accessibles via le dashboard Supabase ou le MCP.
