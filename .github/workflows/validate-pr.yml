name: Validate PR (tests + typecheck + build + drift detection)

# Vérifie la qualité de chaque PR avant merge :
# 1. TypeScript strict compile
# 2. Tests unitaires Vitest
# 3. Build Vite (repère les erreurs d'import et de bundling)
# 4. Drift detection : cherche les patterns hérités de Lovable dans les
#    edge functions et le frontend, fail si détecté
# 5. Contrat front ↔ back : échoue si le frontend appelle un RPC / une edge
#    function / un bucket qui n'existe NI en prod NI dans le repo (anti-raccord
#    mort — la classe de bug qui a tué fn_ma_streak, fn_soignant_score_breakdown,
#    les buckets factures-honoraires/avoirs, etc.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main] # double-check post-merge

# Force les actions JS à utiliser Node 24 (Node 20 est déprécié sur GitHub
# Actions runners depuis le 19 sept 2025, removal le 16 sept 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  typecheck-and-build:
    # Conserver ce nom : il peut être référencé par la protection de branche.
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        # `tsc -b` traverse les references (tsconfig.app.json + tsconfig.node.json).
        # `tsc --noEmit` sans -p ou -b ne vérifierait RIEN car le tsconfig.json
        # racine contient files: [] + des references — bug subtil qui a laissé
        # passer des "Cannot find name" en prod (cf. crash dashboard AS sur
        # getLabelProfession non importé).
        run: npx tsc -b

      - name: Contrats des scénarios de charge
        run: node --test tests/node/load-seed-retire.node.mjs tests/node/prepare-candidatures-fixture.node.mjs tests/node/candidatures-rollback-runner.node.mjs tests/node/candidatures-staging-ui.node.mjs tests/node/load-tests.node.mjs tests/node/prepare-load-fixtures.node.mjs tests/node/diagnose-load-fixtures.node.mjs tests/node/prepare-dashboard-fixture.node.mjs tests/node/prepare-dashboard-pool.node.mjs tests/node/dashboard-staging-ui.node.mjs tests/node/dashboard-preview.node.mjs tests/node/wait-staging-schema.node.mjs

      - name: Relais candidatures — transports push simulés sans réseau
        run: node --test tests/node/push-candidatures.node.mjs tests/node/push-candidatures-catalogue.node.mjs

      - name: Tests unitaires
        run: npm test -- --reporter=dot

      - name: Garde de livraison mobile
        run: node --test tests/node/mobile-delivery-plan.node.mjs

      - name: Gardes de la recette financière isolée
        run: node --test tests/node/recette-escrow-safety.node.mjs

      - name: Documents facturation réels avec IO fictives
        run: node --test tests/node/facturation-documents.node.mjs tests/node/facturation-numerotation.node.mjs tests/node/numerotation-catalogue.node.mjs tests/node/numerotation-verrous.node.mjs tests/node/detail-facture-document.node.mjs

      - name: Gardes du déploiement generate-invoice staging sans réseau ni secrets
        run: node --test tests/node/refresh-generate-invoice-staging.node.mjs

      - name: Tester la préparation Connect staging fermée sans réseau
        run: node --test tests/node/connect-staging-closed.node.mjs tests/node/connect-staging-admission.node.mjs tests/node/connect-staging-catalogue.node.mjs tests/node/connect-staging-installed.node.mjs tests/node/connect-test-fixture.node.mjs tests/node/connect-test-fixture-ci.node.mjs

      - name: Gardes du témoin seed Connect sans réseau
        run: node --test tests/node/connect-test-fixture-rollback.node.mjs

      - name: Contrats du pilote documentaire F1 sans réseau ni credentials
        run: node --test tests/node/f1-cloud-pilot.node.mjs tests/node/f1-cloud-adapter.node.mjs tests/node/f1-cloud-documents.node.mjs tests/node/f1-cloud-network.node.mjs tests/node/f1-cloud-workflow.node.mjs

      - name: Navigation HTML — transport loopback sans navigateur
        run: node --test tests/node/recette-navigation-html.node.mjs tests/node/rotate-playwright-fixtures.node.mjs tests/node/signup-private-password.node.mjs tests/node/temporary-fixture-plan.node.mjs tests/node/temporary-fixture-confinement.node.mjs

      - name: Deno figé pour le chargement des polices Edge
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '2.9.7'

      # Acquisition du graphe npm uniquement, avant le runtime sans droits.
      # Aucun credential Supabase, aucune base ou fonction distante.
      - name: Précharger les imports du contrôle Deno
        run: deno cache --no-config --no-lock --node-modules-dir=none tests/deno/facturation-polices.test.ts supabase/functions/generate-invoice/index.ts

      - name: Polices et module Edge sous Deno sans IO
        run: |
          deno check --no-config --no-lock --node-modules-dir=none --cached-only supabase/functions/generate-invoice/fonts.ts
          deno test --no-config --no-lock --node-modules-dir=none --cached-only --no-check --no-prompt --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi --deny-sys tests/deno/facturation-polices.test.ts

      - name: Isolation des migrations PR et du bootstrap staging
        run: node --test tests/node/staging-migration-base.node.mjs tests/node/staging-litige-reconciliation.node.mjs

      - name: Catalogue paiement indépendant sans réseau
        run: node --test tests/node/paiements-catalogue.node.mjs

      - name: Garde du témoin F1 avant migration sans réseau
        run: node --test tests/node/f1-heures-temoin-avant-migration.node.mjs

      - name: Vérifier les empreintes inventaire explicites
        run: node --test tests/node/security-definer-inventory.node.mjs tests/node/litige-resolveur-garde.node.mjs

      - name: Isolation du draft contrat SQL sans réseau
        run: node --test tests/node/contrat-v11-sql-proof.node.mjs

      - name: Suppression avec historique — contrôleur sans réseau
        run: node --test tests/node/suppression-historique-catalogue.node.mjs

      - name: Diagnostic financier — contrôleur sans réseau
        run: node --test tests/node/diagnostic-financier-catalogue.node.mjs

      - name: Journal et préflight fournisseurs hors réseau
        run: node --test tests/node/recette-fournisseurs-manifest.node.mjs tests/node/recette-fournisseurs-preflight.node.mjs tests/node/recette-fournisseurs-collector.node.mjs

      - name: Projection des statuts stores sans réseau ni secrets
        run: ruby scripts/mobile/store-status.test.rb

      - name: Projection des sauvegardes sans réseau ni secrets
        run: node --test tests/node/collect-backup-status.node.mjs

      - name: Remplacement contrôlé d’une soumission Apple sans réseau ni secrets
        run: ruby fastlane/ios_review_submission.test.rb

      - name: Valider les formats de captures stores
        run: npm run screenshots:play:check && npm run screenshots:app-store:check

      - name: Build
        run: npm run build

      - name: Syntaxe du JavaScript livré compatible avec iOS 15
        run: node scripts/check-browser-syntax.mjs dist

  drift-detection:
    name: Drift detection (Lovable legacy patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for app.jolene.app legacy domain
        run: |
          # Les seules occurrences légitimes sont :
          # - src/lib/biometric.ts (namespace Keychain interne, ne doit PAS changer)
          # - src/components/SyncCalendrier.tsx (UID iCal stable, ne doit PAS changer)
          # Tout le reste doit être jolene.app
          echo "::group::Scanning for 'app.jolene.app' in edge functions"
          # Exclure les .md (docs qui peuvent légitimement mentionner le drift historique).
          # Exclure aussi les littéraux CORS (chaînes 'https://app.jolene.app' ou
          # "https://app.jolene.app") : ce sont des entrées de whitelist d'origine
          # autorisées dans les fonctions exposées au browser. Tout autre usage
          # (URL hardcodée comme destination fetch, redirect, lien, etc.) reste interdit.
          HITS=$(grep -rn --include='*.ts' --include='*.js' "app\.jolene\.app" supabase/functions/ 2>/dev/null \
            | grep -vE "['\"]https://app\.jolene\.app['\"]" || true)
          if [ -n "$HITS" ]; then
            echo "::error::app.jolene.app found in edge function source code — this is legacy Lovable drift"
            echo "$HITS"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Scanning for '#17A2B8' (ancien turquoise legacy) in code"
          # Scope: only real source files (not docs that may legitimately mention drift)
          HITS=$(grep -rn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.css' --include='*.html' "#17A2B8" src/ supabase/functions/ public/ 2>/dev/null \
            | grep -v "^[[:space:]]*//" \
            | grep -v "^[[:space:]]*\*" || true)
          if [ -n "$HITS" ]; then
            echo "::warning::Old turquoise branding found in code:"
            echo "$HITS"
          fi
          echo "::endgroup::"

          echo "::group::Scanning for ancient Lovable imports"
          if grep -rn "from ['\"]lovable" src/ 2>/dev/null; then
            echo "::error::Lovable imports found — should be removed"
            exit 1
          fi
          echo "::endgroup::"

      - name: Check Vercel config sanity
        run: |
          echo "::group::Checking index.html has canonical URL"
          if ! grep -q 'rel="canonical"' index.html; then
            echo "::warning::index.html is missing canonical URL (SEO)"
          fi
          echo "::endgroup::"

          echo "::group::Checking Open Graph URLs point to jolene.app"
          if grep -q 'og:url.*app\.jolene\.app' index.html; then
            echo "::error::og:url points to old app.jolene.app domain"
            exit 1
          fi
          echo "::endgroup::"

  contract-check:
    name: Contrat front ↔ back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Vérifier les raccords front ↔ back
        # Le script n'a AUCUNE dépendance npm (built-ins Node + fetch global) →
        # pas de `npm ci`. Introspection PROD via Management API (token + ref).
        # L'« existant » = état prod ∪ objets définis dans le repo (migrations +
        # supabase/functions), donc une PR qui ajoute backend+frontend ensemble
        # ne déclenche pas de faux positif.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Introspection PROD indisponible (secrets manquants) — vérification de contrat ignorée pour ne pas produire de faux négatifs."
            exit 0
          fi
          node scripts/check-contrat-frontend-backend.mjs

  # ── B7 (Lots 19+) — checks requis : guards + non-régression + escrow gaté ──

  guards:
    name: Garde-fous (test:guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: test:guards (grep non-régression, pur)
        run: bash tests/non-regression/guards.sh

  regression:
    name: Non-régression (dérivation + schema + invoicing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Mission caregiver loading lifecycle (blocking)
        run: npx vitest run src/pages/DetailMissionSoignant.chargement.test.tsx
      - name: test:regression:derivation (pur, toujours bloquant)
        run: npm run test:regression:derivation

      - name: test:regression:invoicing (pur, toujours bloquant)
        run: npm run test:regression:invoicing

      # Sur une PR, le job sql-transaction applique la branche au staging puis
      # valide le schéma dans une transaction annulée. Tester directement la
      # PROD à ce stade produirait des faux négatifs pour les migrations encore
      # non mergées. Sur main, on attend au contraire le deploy du même SHA
      # avant toute introspection afin d'éliminer la course CI/deploy.
      - name: Attendre Deploy Supabase du même SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 21
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          SUPABASE_DEPLOY_MAX_WAIT_MS: '1200000'
        run: node scripts/ci/wait-for-supabase-deploy.mjs

      - name: test:schema PROD post-déploiement (lecture seule)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: verify-full
        run: |
          set -euo pipefail
          if [ -z "${PGPASSWORD:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Secrets Supabase PROD absents : test:schema ne peut pas s'exécuter."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != 'flripxtsyegjshnhzjkz' ]; then
            echo "::error::SUPABASE_PROJECT_REF ne cible pas la production Jolene autorisée."
            exit 1
          fi
          SUPABASE_DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=verify-full&sslrootcert=./config/certs/supabase-prod-ca-2021.crt" \
            npm run test:schema

  sql-transaction:
    name: Migrations + sécurité SQL (transaction annulée)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres-connect-reference:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: connect_pretransfer_temoin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-ci-ephemere
        ports: ['127.0.0.1:54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d connect_pretransfer_temoin"
          --health-interval 5s --health-timeout 5s --health-retries 6
    concurrency:
      # Même verrou que le bootstrap staging : leurs écritures ne doivent
      # jamais s'exécuter simultanément sur la base partagée.
      group: jolene-supabase-staging-writes
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Les migrations PR sont testées puis annulées. Seul le schéma de base
      # main peut être synchronisé durablement ; ce job ne déploie pas la PR.
      # Une PR sans migration ne dépend du staging que pour une recette SQL explicite.
      - name: Déterminer si les migrations sont concernées
        id: migration_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA"...HEAD -- 'supabase/migrations/*.sql'; then
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE_SHA"...HEAD -- \
            'tests/security/facturation-remplacement-commission-f1.test.sql' \
            'tests/fixtures/facturation-remplacement-f1/catalogue.sql' \
            'tests/security/facturation-heures-ajustees-chainage-f1.test.sql' \
            'tests/security/facturation-commissions-pieces-matrice-f1.test.sql' \
            'supabase/migrations/20261001102511_aligner_commissions_pieces_et_estimation.sql' \
            'tests/fixtures/facturation-heures-ajustees-f1/catalogue.sql'; then
            has_f1_regression=false
          else
            has_f1_regression=true
          fi
          echo "has_f1_regression=$has_f1_regression" >> "$GITHUB_OUTPUT"

          if git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'supabase/migrations/*.sql' | grep -Fxq 'supabase/migrations/20261001201055_reserver_remboursement_connect_avant_transfert.sql'; then
            echo "has_connect_candidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_connect_candidate=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE_SHA"...HEAD -- \
            'scripts/ci/connect-test-fixture*.mjs' \
            'scripts/ci/connect-test-fixture-prepare.sql' \
            'tests/node/connect-test-fixture*.node.mjs'; then
            echo "has_connect_fixture=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_connect_fixture=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE_SHA"...HEAD -- \
            'tests/fixtures/contrat-service-v11/**' \
            'tests/security/contrat-service-v11.test.sql' \
            'scripts/ci/contrat-v11-sql-proof.mjs'; then
            echo "has_contract_fixture=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$has_f1_regression" = true ]; then
              echo "::error::La fixture contrat et la recette F1 doivent rester séparées."
              exit 1
            fi
            # Une preuve de draft ne doit jamais déclencher le bootstrap.
            if ! git diff --quiet "$BASE_SHA"...HEAD -- 'supabase/migrations/*.sql'; then
              echo "::error::La recette contrat doit rester sans migration produit."
              exit 1
            fi
            echo "has_contract_fixture=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node pour les preuves annulées
        if: steps.migration_scope.outputs.has_contract_fixture == 'true' || steps.migration_scope.outputs.has_connect_candidate == 'true' || steps.migration_scope.outputs.has_connect_fixture == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Connect — référence du delta fermé dans PostgreSQL 17 éphémère
        if: steps.migration_scope.outputs.has_connect_candidate == 'true'
        env:
          JOLENE_CONNECT_WITNESS: CI_EPHEMERE
          PGHOST: 127.0.0.1
          PGPORT: '54329'
          PGDATABASE: connect_pretransfer_temoin
          PGUSER: postgres
          PGPASSWORD: fixture-ci-ephemere
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          JOLENE_CONNECT_CATALOGUE_REFERENCE: ${{ runner.temp }}/connect-catalogue-reference.json
        run: python3 scripts/ci/connect-staging-admission-pg17.py

      - name: Connect — reconnaître strictement le staging installé et fermé
        id: connect_installation
        if: steps.migration_scope.outputs.has_connect_candidate == 'true'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/connect-staging-installed-proof.mjs inspect

      - name: Contrat v1.1 draft — preuve SQL seulement, puis contrôle indépendant
        if: steps.migration_scope.outputs.has_contract_fixture == 'true'
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/contrat-v11-sql-proof.mjs

      # Source staging déjà installée et catalogue épinglé : pas de bootstrap,
      # aucune migration ni ouverture Connect pour ce témoin du seed seul.
      - name: Connect — seed exact sous SAVEPOINT et ROLLBACK puis relecture
        if: steps.migration_scope.outputs.has_connect_fixture == 'true'
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/connect-test-fixture-rollback.mjs

      - name: Conserver le verdict assaini du témoin seed Connect
        if: always() && steps.migration_scope.outputs.has_connect_fixture == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: connect-test-fixture-rollback-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/connect-test-fixture-rollback.json
          if-no-files-found: warn
          retention-days: 7

      - name: Setup Supabase CLI
        if: steps.migration_scope.outputs.has_migrations == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Synchroniser le schéma main vers le staging
        if: steps.migration_scope.outputs.has_migrations == 'true' && steps.connect_installation.outputs.mode != 'installed'
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_SUPABASE_ACCESS_TOKEN" ] \
             || [ -z "$STAGING_SUPABASE_PROJECT_REF" ] \
             || [ -z "$STAGING_SUPABASE_DB_PASSWORD" ] \
             || [ -z "$BASE_SHA" ]; then
            echo "::error::Secrets Supabase STAGING ou SHA de base absents : le bootstrap SQL bloquant ne peut pas s'exécuter. Aucun repli production n'est autorisé."
            exit 1
          fi
          if [ "$STAGING_SUPABASE_PROJECT_REF" != 'mejpriaetwgtcstbgfid' ] \
             || [ "$STAGING_SUPABASE_PROJECT_REF" = 'flripxtsyegjshnhzjkz' ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF ne cible pas le staging Jolene autorisé : bootstrap SQL refusé."
            exit 1
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          BASE_WORKTREE="$RUNNER_TEMP/jolene-base-main"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          trap 'git worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true' EXIT

          # Ne jamais copier les migrations PR ici : db push les persisterait
          # avant le test rollback, y compris leurs RPC encore non approuvées.
          # Un staging en avance sur cette base exige une réconciliation revue
          # ou une actualisation de la PR, jamais une réparation automatique.
          registry_code=$(curl -sS --connect-timeout 10 --max-time 60 \
            -o "$RUNNER_TEMP/jolene-staging-registry.json" -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"query":"SELECT version FROM supabase_migrations.schema_migrations ORDER BY version"}')
          if [ "$registry_code" -lt 200 ] || [ "$registry_code" -ge 300 ]; then
            echo "::error::Lecture du registre staging impossible (HTTP $registry_code) : aucune synchronisation effectuée."
            exit 1
          fi
          node scripts/ci/check-staging-migration-base.mjs \
            "$BASE_WORKTREE" "$RUNNER_TEMP/jolene-staging-registry.json"

          SUPABASE_ACCESS_TOKEN="$STAGING_SUPABASE_ACCESS_TOKEN" \
            supabase link \
              --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
              --password "$STAGING_SUPABASE_DB_PASSWORD" \
              --workdir "$BASE_WORKTREE"

          # Le staging vierge n'active pas pg_cron par défaut, alors que plusieurs
          # migrations historiques de main créent les jobs de production. Le
          # bootstrap doit donc installer cette dépendance avant de rejouer main ;
          # l'opération reste strictement limitée au project ref staging contrôlé
          # ci-dessus et est idempotente.
          jq -nc \
            --arg query 'CREATE EXTENSION IF NOT EXISTS pg_cron WITH SCHEMA pg_catalog;' \
            '{query: $query}' > /tmp/jolene-staging-pg-cron.json
          cron_code=$(curl -sS --connect-timeout 10 --max-time 60 \
            -o /tmp/jolene-staging-pg-cron-response.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/jolene-staging-pg-cron.json)
          if [ "$cron_code" -lt 200 ] || [ "$cron_code" -ge 300 ]; then
            echo "::error::Activation de pg_cron refusée sur le staging (HTTP $cron_code)."
            jq -r '.message // .error // "Erreur SQL non détaillée"' \
              /tmp/jolene-staging-pg-cron-response.json 2>/dev/null || true
            exit 1
          fi

          # Réconciliation persistante et bornée de la base STAGING : le DO
          # historique de routage salarié a été rejoué deux fois. Le script
          # refuse tout autre corps/droit et reconstruit uniquement main.
          # Les migrations PR suivantes restent entièrement sous ROLLBACK.
          node scripts/ci/reconcile-staging-litige-base.mjs \
            "$BASE_WORKTREE" "$RUNNER_TEMP/jolene-staging-registry.json" \
            > "$RUNNER_TEMP/jolene-staging-litige-base.sql"
          jq -Rs '{query: .}' "$RUNNER_TEMP/jolene-staging-litige-base.sql" \
            > "$RUNNER_TEMP/jolene-staging-litige-base.json"
          reconcile_code=$(curl -sS --connect-timeout 10 --max-time 60 \
            -o "$RUNNER_TEMP/jolene-staging-litige-base-response.json" -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/jolene-staging-litige-base.json")
          if [ "$reconcile_code" -lt 200 ] || [ "$reconcile_code" -ge 300 ]; then
            echo "::error::Réconciliation bornée de la base staging refusée (HTTP $reconcile_code)."
            jq -r '.message // .error // "Erreur SQL non détaillée"' \
              "$RUNNER_TEMP/jolene-staging-litige-base-response.json" 2>/dev/null || true
            exit 1
          fi

          SUPABASE_ACCESS_TOKEN="$STAGING_SUPABASE_ACCESS_TOKEN" \
            supabase db push \
              --include-all \
              --yes \
              --password "$STAGING_SUPABASE_DB_PASSWORD" \
              --workdir "$BASE_WORKTREE"

      - name: F1 — catalogue et absence de résidus avant transaction
        if: steps.migration_scope.outputs.has_f1_regression == 'true'
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = 'mejpriaetwgtcstbgfid'
          test -n "$STAGING_SUPABASE_ACCESS_TOKEN"
          # Une seule identité attendue, déterminée par la base effectivement testée.
          git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null
          if git cat-file -e "$BASE_SHA:supabase/migrations/20261001160404_ordonner_verrous_commissions_honoraires.sql" 2>/dev/null; then
            expected_f1_helper='c736c66d76001b64ba425484f77c6ea2'
          else
            expected_f1_helper='c793ac81eaef0fe18fb5920c9264c675'
          fi
          jq -Rs '{query: .}' tests/fixtures/facturation-heures-ajustees-f1/catalogue.sql > "$RUNNER_TEMP/f1-catalogue-query.json"
          code=$(curl -sS --connect-timeout 10 --max-time 30 \
            -o "$RUNNER_TEMP/f1-catalogue-avant.json" -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/f1-catalogue-query.json")
          test "$code" -ge 200 && test "$code" -lt 300
          jq -e --arg helper "$expected_f1_helper" 'type == "array" and length == 1 and .[0].residus == 0 and .[0].compteurs.net_requests == 0 and .[0].helper_remplacement_md5 == $helper and (.[0].compteurs | length == 25) and (.[0].routines_md5 | test("^[a-f0-9]{32}$")) and (.[0].triggers_md5 | test("^[a-f0-9]{32}$"))' "$RUNNER_TEMP/f1-catalogue-avant.json"

      - name: F1 — reproduction exacte avant la migration candidate
        if: steps.migration_scope.outputs.has_migrations == 'true' && steps.migration_scope.outputs.has_f1_regression == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          added_migrations=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'supabase/migrations/*.sql')
          if printf '%s\n' "$added_migrations" | grep -Fxq 'supabase/migrations/20261001102511_aligner_commissions_pieces_et_estimation.sql'; then
            node scripts/ci/f1-heures-temoin-avant-migration.mjs
          fi

      - name: Paiements — catalogue avant migration
        if: steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/paiements-catalogue.mjs avant

      - name: Suppression — catalogue avant transaction
        if: steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/suppression-historique-catalogue.mjs avant

      - name: Diagnostic financier — catalogue avant transaction
        if: steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/diagnostic-financier-catalogue.mjs avant

      - name: Push candidatures — catalogue avant transaction
        if: steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/push-candidatures-catalogue.mjs avant

      - name: Numérotation — catalogue avant transaction
        if: steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/numerotation-catalogue.mjs avant

      - name: Exécuter les migrations ajoutées et les régressions SQL sans persister
        if: steps.migration_scope.outputs.has_migrations == 'true' || steps.migration_scope.outputs.has_f1_regression == 'true'
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_MIGRATIONS: ${{ steps.migration_scope.outputs.has_migrations }}
          CONNECT_INSTALLATION_MODE: ${{ steps.connect_installation.outputs.mode }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_SUPABASE_ACCESS_TOKEN" ] || [ -z "$STAGING_SUPABASE_PROJECT_REF" ] || [ -z "$BASE_SHA" ]; then
            echo "::error::Secrets Supabase STAGING ou SHA de base absents : la validation SQL bloquante ne peut pas s'exécuter. Aucun repli production n'est autorisé."
            exit 1
          fi
          if [ "$STAGING_SUPABASE_PROJECT_REF" != 'mejpriaetwgtcstbgfid' ] \
             || [ "$STAGING_SUPABASE_PROJECT_REF" = 'flripxtsyegjshnhzjkz' ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF ne cible pas le staging Jolene autorisé : validation SQL refusée."
            exit 1
          fi

          mapfile -t MIGRATIONS < <(
            git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'supabase/migrations/*.sql' | sort
          )
          # Le témoin PG17 a rejoué la migration. Sur l'installation reconnue,
          # conserver toutes les suites SQL, sans réinstaller le moteur/cohorte.
          if [ "$CONNECT_INSTALLATION_MODE" = 'installed' ]; then
            test "${#MIGRATIONS[@]}" -eq 1
            test "${MIGRATIONS[0]}" = 'supabase/migrations/20261001201055_reserver_remboursement_connect_avant_transfert.sql'
            MIGRATIONS=()
          fi
          SQL_TESTS=(
            tests/admin/security/admin-launch-access-guard.test.sql
            tests/admin/security/admin-document-moderation-hardening.test.sql
            tests/admin/security/database-runtime-lint-fixes.test.sql
            tests/admin/security/database-runtime-lint-residual.test.sql
            tests/admin/security/database-establishment-rpc-rbac.test.sql
            tests/admin/security/litige-rpc-flow.test.sql
            tests/admin/security/litige-admin-financial-resolution.test.sql
            tests/admin/security/mission-start-direct-insert-gate.test.sql
            tests/admin/security/rpps-diploma-exemption.test.sql
            tests/admin/security/external-hours-p0-hardening.test.sql
            tests/admin/security/heures-compteurs-coherence.test.sql
            tests/admin/security/empechement-penalty-hardening.test.sql
            tests/admin/security/etablissement-rib-review-queue.test.sql
            tests/admin/security/manual-review-admin-queue.test.sql
            tests/security/establishment-admin-review-hardening.test.sql
            tests/security/etablissement-verification-source-replacement.test.sql
            tests/security/admin-suspension-auth.test.sql
            tests/security/moyenne-44h-12-semaines.test.sql
            tests/security/p0-auth-rls.test.sql
            tests/security/inscription-progressive.test.sql
            tests/security/suppression-compte-isolation-psc.test.sql
            tests/security/suppression-compte-historique-financier.test.sql
            tests/security/exploration-sans-profil.test.sql
            tests/security/alertes-recherches-etablissement.test.sql
            tests/security/debit-cron-alertes.test.sql
            tests/security/auto-resolution-cron-propre.test.sql
            tests/security/decouverte-api-alertes.test.sql
            tests/security/rappels-quotidiens-file.test.sql
            tests/security/activation-inscriptions-publiques.test.sql
            tests/security/recherche-publique-comptage.test.sql
            tests/security/apercu-marche-anonyme.test.sql
            tests/security/notation-reverse-transactionnelle.test.sql
            tests/security/notation-anonymisation-compte.test.sql
            tests/security/otp-signature-routage-projet.test.sql
            tests/security/parrainage-attribution-protegee.test.sql
            tests/security/copies-bulletins-officiels.test.sql
            tests/security/export-etablissement-sans-troncature.test.sql
            tests/security/monitoring-chorus-plage-nocturne.test.sql
            tests/security/monitoring-crons-etats-transitoires.test.sql
            tests/security/contrat-storage-acces.test.sql
            tests/security/stripe-webhook-jwt-role.test.sql
            tests/security/suivi-escrow-mission.test.sql
            tests/security/financial-audit-jwt-role.test.sql
            tests/security/factures-numerotation-series.test.sql
            tests/security/push-candidatures.test.sql
            tests/security/facturation-hebdomadaire-f1.test.sql
            tests/security/facturation-remplacement-commission-f1.test.sql
            tests/security/stripe-refund-identifiers.test.sql
            tests/security/security-definer-inventory-explicit.test.sql
            tests/security/cloture-mission-tenant.test.sql
            tests/security/litige-resolveur-garde-initiale.test.sql
            tests/lot21/d4-cascade-profession-mission.test.sql
            tests/security/facturation-heures-ajustees-chainage-f1.test.sql
            tests/security/facturation-commissions-pieces-matrice-f1.test.sql
            tests/security/paiements-liberaux-facture.test.sql
            tests/security/numerotation-factures.test.sql
            tests/security/diagnostic-financier-documentaire.test.sql
            tests/security/notification-remboursement-manuel.test.sql
          )
          # Sans migration, ne pas exiger des fonctions main absentes du
          # staging : cette voie prouve seulement les trois bancs F1 LIVE.
          # Le helper de taux corrigé doit déjà être déployé (préflight), sans sync ici.
          # Avec migration, les 49 suites précédentes + le chaînage + la matrice restent obligatoires.
          case "$HAS_MIGRATIONS" in
            false) SQL_TESTS=(tests/security/facturation-remplacement-commission-f1.test.sql tests/security/facturation-heures-ajustees-chainage-f1.test.sql tests/security/facturation-commissions-pieces-matrice-f1.test.sql) ;;
            true) ;;
            *) echo "::error::Portée migration absente ou invalide."; exit 1 ;;
          esac

          {
            echo 'BEGIN;'
            echo "SET LOCAL statement_timeout = '120s';"
            echo "SET LOCAL lock_timeout = '10s';"
            for file in "${MIGRATIONS[@]}"; do
              printf '\n-- migration: %s\n' "$file"
              # Le COMMIT réel remet ces réglages locaux à leur valeur initiale.
              # Sous ROLLBACK global, restaurer le contexte du banc évite qu’un
              # search_path de migration rende les types des suites invisibles.
              echo "SELECT pg_catalog.set_config('jolene.pr_validation_settings', pg_catalog.jsonb_build_object('search_path', pg_catalog.current_setting('search_path'), 'statement_timeout', pg_catalog.current_setting('statement_timeout'), 'lock_timeout', pg_catalog.current_setting('lock_timeout'), 'TimeZone', pg_catalog.current_setting('TimeZone'))::text, true);"
              sed -E '/^[[:space:]]*(BEGIN|COMMIT|ROLLBACK);[[:space:]]*$/d' "$file"
              echo "SELECT pg_catalog.set_config(setting.key, setting.value, true) FROM pg_catalog.jsonb_each_text(pg_catalog.current_setting('jolene.pr_validation_settings')::jsonb) AS setting;"
            done
            test_index=0
            for file in "${SQL_TESTS[@]}"; do
              test -f "$file" || { echo "::error::Suite SQL absente: $file" >&2; exit 1; }
              test_index=$((test_index + 1))
              savepoint="jolene_sql_test_${test_index}"
              printf '\n-- regression: %s\n' "$file"
              printf 'SAVEPOINT %s;\n' "$savepoint"
              sed -E '/^[[:space:]]*\\/d; /^[[:space:]]*(BEGIN|COMMIT|ROLLBACK);[[:space:]]*$/d' "$file"
              printf 'ROLLBACK TO SAVEPOINT %s;\n' "$savepoint"
              printf 'RELEASE SAVEPOINT %s;\n' "$savepoint"
            done
            echo 'ROLLBACK;'
          } > /tmp/jolene-pr-validation.sql

          if [ "$CONNECT_INSTALLATION_MODE" = 'installed' ]; then
            # Relecture indépendante même après erreur ; aucun retry, reset ou repair.
            node scripts/ci/connect-staging-installed-proof.mjs regressions /tmp/jolene-pr-validation.sql
          else
            jq -Rs '{query: .}' /tmp/jolene-pr-validation.sql > /tmp/jolene-pr-validation.json
            code=$(curl -sS --connect-timeout 10 --max-time 180 \
              -o /tmp/jolene-pr-validation-response.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${STAGING_SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/jolene-pr-validation.json)
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Validation SQL transactionnelle refusée par Supabase (HTTP $code)."
              jq -r '.message // .error // "Erreur SQL non détaillée"' \
                /tmp/jolene-pr-validation-response.json 2>/dev/null || true
              exit 1
            fi
          fi
          echo "✅ ${#MIGRATIONS[@]} migration(s) ajoutée(s) et ${#SQL_TESTS[@]} suites SQL validées sous ROLLBACK."

      - name: Connect — delta exact staging annulé puis relecture indépendante
        if: steps.migration_scope.outputs.has_connect_candidate == 'true' && steps.connect_installation.outputs.mode == 'empty'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/connect-staging-catalogue-proof.mjs proof

      - name: Connect — seules les empreintes et assertions vérifiées sont conservées
        if: success() && steps.migration_scope.outputs.has_connect_candidate == 'true' && steps.connect_installation.outputs.mode == 'empty'
        uses: actions/upload-artifact@v5
        with:
          name: connect-closed-catalogue-proof-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/connect-catalogue-proof.json
          retention-days: 7
          if-no-files-found: error

      - name: Connect — preuve de conservation de l'installation et de la cohorte
        if: success() && steps.migration_scope.outputs.has_connect_candidate == 'true' && steps.connect_installation.outputs.mode == 'installed'
        uses: actions/upload-artifact@v5
        with:
          name: connect-installed-catalogue-proof-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/connect-installed-proof.json
          retention-days: 7
          if-no-files-found: error

      - name: Numérotation — SELECT indépendant après succès ou échec
        if: always() && steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/numerotation-catalogue.mjs apres

      - name: Push candidatures — SELECT indépendant après succès ou échec
        if: always() && steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/push-candidatures-catalogue.mjs apres

      - name: Paiements — SELECT indépendant après succès ou échec
        if: always() && steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/paiements-catalogue.mjs apres

      - name: Suppression — SELECT indépendant après succès ou échec
        if: always() && steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/suppression-historique-catalogue.mjs apres

      - name: Diagnostic financier — SELECT indépendant après succès ou échec
        if: always() && steps.migration_scope.outputs.has_migrations == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/diagnostic-financier-catalogue.mjs apres

      - name: F1 — SELECT indépendant après succès ou échec SQL
        if: always() && steps.migration_scope.outputs.has_f1_regression == 'true'
        timeout-minutes: 2
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$STAGING_SUPABASE_PROJECT_REF" = 'mejpriaetwgtcstbgfid'
          test -n "$STAGING_SUPABASE_ACCESS_TOKEN"
          test -f "$RUNNER_TEMP/f1-catalogue-avant.json"
          code=$(curl -sS --connect-timeout 10 --max-time 30 \
            -o "$RUNNER_TEMP/f1-catalogue-apres.json" -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${STAGING_SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${STAGING_SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/f1-catalogue-query.json")
          test "$code" -ge 200 && test "$code" -lt 300
          jq -e 'type == "array" and length == 1 and .[0].residus == 0' "$RUNNER_TEMP/f1-catalogue-apres.json"
          jq -S . "$RUNNER_TEMP/f1-catalogue-avant.json" > "$RUNNER_TEMP/f1-avant-canonique.json"
          jq -S . "$RUNNER_TEMP/f1-catalogue-apres.json" > "$RUNNER_TEMP/f1-apres-canonique.json"
          cmp "$RUNNER_TEMP/f1-avant-canonique.json" "$RUNNER_TEMP/f1-apres-canonique.json"
          echo 'F1_CONTROLE_INDEPENDANT_OK : catalogue et compteurs inchangés, zéro résidu.'

  paiements-concurrence:
    name: Paiements — verrous PostgreSQL 17 éphémère
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        # Métadonnées officielles Docker Hub lues le 01/10/2026, aucune couche locale.
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: paiements_concurrence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-ci-ephemere
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d paiements_concurrence"
          --health-interval 5s --health-timeout 5s --health-retries 6
    env:
      JOLENE_PG_CONCURRENCY: CI_EPHEMERE
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: paiements_concurrence
      PGUSER: postgres
      PGPASSWORD: fixture-ci-ephemere
    steps:
      - uses: actions/checkout@v5
      - name: Lecteur ACL des deux formats du dump (sans PostgreSQL)
        run: python3 -m unittest discover -s tests/python -p 'test_paiements_concurrence_acl.py' -v
      - name: Deux écrivains, observateur et reprises exactes
        run: python3 scripts/ci/paiements-concurrence-pg17.py
      - name: Catalogue F1 — cast du type interne et états des triggers
        run: node --test tests/postgres/f1-cloud-catalogue-cast.pg17.mjs

  numerotation-concurrence:
    name: Numérotation — réservations et reprises PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        # Même image officielle figée que le banc paiements, sans cloud.
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: numerotation_temoin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-ci-ephemere
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d numerotation_temoin"
          --health-interval 5s --health-timeout 5s --health-retries 6
    env:
      JOLENE_NUMBERING_WITNESS: CI_EPHEMERE
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: numerotation_temoin
      PGUSER: postgres
      PGPASSWORD: fixture-ci-ephemere
    steps:
      - uses: actions/checkout@v5
      - name: Rouge historique, migration réelle et deux écrivains observés
        run: python3 scripts/ci/numerotation-concurrence-pg17.py

  escrow-gate:
    name: Escrow (recette si paiements touchés)
    # Check REQUIS et TOUJOURS répondant : no-op vert quand le diff ne touche ni
    # supabase/ ni les chemins paiements/escrow (un check requis ne peut pas être
    # conditionnel/skippé, sinon les PR restent bloquées « en attente »).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Portée du diff
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE"...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || true)
          fi
          echo "Fichiers modifiés :"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qiE '^supabase/|escrow|paiement|stripe|sepa|mandat|facturation'; then
            echo "touche=true" >> "$GITHUB_OUTPUT"
          else
            echo "touche=false" >> "$GITHUB_OUTPUT"
          fi
      - name: No-op — paiements non concernés (check vert)
        if: steps.scope.outputs.touche == 'false'
        run: echo "✅ Le diff ne touche ni supabase/ ni les chemins paiements/escrow — test:escrow non requis."
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.touche == 'true'
        with:
          node-version: '24'
          cache: 'npm'
      - name: Régressions paiement/escrow sans accès production
        if: steps.scope.outputs.touche == 'true'
        # Ce check PR reste pur : il ne crée aucune fixture dans la base partagée
        # et ne prétend pas appeler Stripe. La vraie recette Stripe test/Connect
        # est le workflow manuel `recette-escrow-stripe.yml`, exécuté sur la
        # branche Supabase de recette avec une clé sk_test.
        run: |
          python3 -m unittest discover -s tests/python -p 'test_resend_stripe_test_event.py' -v
          npm ci
          npx vitest run \
            tests/admin/security/contrat-original-acces.test.ts \
            src/lib/contratMissionUi.test.ts \
            src/components/SignerContratOtp.continuite.test.tsx \
            src/pages/ContratMission.continuite.test.tsx \
            tests/admin/security/copies-bulletins-handler.test.ts \
            tests/admin/security/copies-bulletins-pdf.test.ts \
            src/components/gains/PaiementsEscrowAVenir.test.tsx \
            tests/admin/security/escrow-release-debite-gate.test.ts \
            tests/admin/security/invoice-payment-state-cas.test.ts \
            tests/admin/security/mission-payment-persistence.test.ts \
            tests/admin/security/refund-queue-recovery.test.ts \
            tests/admin/security/stripe-escrow-reversal.test.ts \
            tests/admin/security/stripe-transfer-reversal-hardening.test.ts \
            tests/admin/security/stripe-payment-rbac.test.ts \
            tests/admin/security/stripe-webhook-source-reconciliation.test.ts

  # NB : le job supabase-advisors a été retiré parce que l'endpoint
  # /v1/projects/{ref}/advisors n'existe pas dans le Management API public.
  # Les advisors restent accessibles via le dashboard Supabase ou le MCP.
