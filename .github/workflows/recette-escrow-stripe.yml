name: Recette escrow — legs Stripe (branche test)

# Déroule les legs STRIPE de la recette escrow 7b-D contre la branche Supabase
# de recette (JAMAIS la prod) : destination charge SEPA réelle, settlement
# webhook, A10.8 (attente fonds), payout manuel, refunds avec/sans
# reverse_transfer, échec de débit, dispute. Cf. scripts/recette-escrow-stripe.ts
# et docs/RECETTE_ESCROW.md.
#
# Prérequis secrets repo :
#   - STRIPE_TEST_SECRET_KEY : clé SECRÈTE **TEST** (sk_test_…) — jamais live.
#     ⚠️ Le compte/sandbox de cette clé doit avoir CONNECT ACTIVÉ
#     (dashboard.stripe.com/connect) : la recette crée un compte connecté.
#   - SUPABASE_ACCESS_TOKEN  : déjà en place (Management API).
#
# Garde-fous : refuse une clé non sk_test / livemode ; ref prod interdit ;
# l'endpoint webhook Stripe créé pour la branche est détruit en fin de run.

on:
  workflow_dispatch:
    inputs:
      branch_ref:
        description: 'Ref de la branche Supabase de recette'
        required: true
        default: 'wnepopwygokbhlqghydb'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  stripe-legs:
    name: S2/S5/S3x/S4x/S6/S7 + invariant solde plateforme
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Garde-fous clé + ref
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_TEST_SECRET_KEY:-}" ]; then
            echo "::error::Secret STRIPE_TEST_SECRET_KEY absent — le créer dans Settings → Secrets → Actions."
            exit 1
          fi
          case "$STRIPE_TEST_SECRET_KEY" in sk_test_*) ;; *) echo "::error::La clé n'est pas une clé TEST (sk_test_…)."; exit 1;; esac
          if [ "${{ inputs.branch_ref }}" = "flripxtsyegjshnhzjkz" ]; then
            echo "::error::Ref PROD interdit."; exit 1
          fi
          LIVE=$(curl -sf -u "$STRIPE_TEST_SECRET_KEY:" https://api.stripe.com/v1/balance | jq -r '.livemode')
          [ "$LIVE" = "false" ] || { echo "::error::livemode=$LIVE"; exit 1; }
          echo "✅ Clé test vérifiée (livemode=false)."
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

      # NB : plus de reveal de la clé service_role de la branche — l'auth des
      # invocations edge passe par un secret vault posé par le harness
      # (cf. CRON_BEARER dans scripts/recette-escrow-stripe.ts, fix run #4 :
      # la clé api-keys ne matchait pas l'env du runtime edge → 403).

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Sync fonctions escrow de la branche sur le code de main
        # Les fonctions de la branche datent de sa création : un fix edge mergé
        # sur main (ex. #817 mandat SEPA) n'y est pas. On redéploie les 5
        # fonctions du flux escrow depuis le checkout AVANT chaque run.
        # --use-api ne relit pas verify_jwt (CLAUDE.md) : le gateway garde la
        # valeur posée à la création de la branche (false, cf. config.toml).
        run: |
          set -euo pipefail
          for fn in escrow-debit-echeance escrow-release process-stripe-refunds stripe-webhook stripe-connect-webhook; do
            supabase functions deploy "$fn" --project-ref "${{ inputs.branch_ref }}" --use-api
            echo "✓ $fn"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Basculer les secrets edge de la branche en TEST + webhook Stripe
        id: wh
        run: |
          set -euo pipefail
          # Deux destinations Stripe distinctes : compte plateforme et comptes
          # Connect. Chaque destination possède son propre signing secret.
          WH_PLATFORM=$(curl -sf https://api.stripe.com/v1/webhook_endpoints \
            -u "$STRIPE_TEST_SECRET_KEY:" \
            -d "url=https://${{ inputs.branch_ref }}.supabase.co/functions/v1/stripe-webhook" \
            -d "enabled_events[]=payment_intent.succeeded" \
            -d "enabled_events[]=payment_intent.payment_failed" \
            -d "enabled_events[]=charge.dispute.created" \
            -d "enabled_events[]=charge.refunded" \
            -d "api_version=2026-02-25.clover" \
            -d "description=recette-escrow plateforme ${{ inputs.branch_ref }} (éphémère)")
          WH_CONNECT=$(curl -sf https://api.stripe.com/v1/webhook_endpoints \
            -u "$STRIPE_TEST_SECRET_KEY:" \
            -d "connect=true" \
            -d "url=https://${{ inputs.branch_ref }}.supabase.co/functions/v1/stripe-connect-webhook" \
            -d "enabled_events[]=account.updated" \
            -d "enabled_events[]=payout.created" \
            -d "enabled_events[]=payout.paid" \
            -d "enabled_events[]=payout.failed" \
            -d "enabled_events[]=payout.canceled" \
            -d "api_version=2026-02-25.clover" \
            -d "description=recette-escrow Connect ${{ inputs.branch_ref }} (éphémère)")
          WH_PLATFORM_ID=$(echo "$WH_PLATFORM" | jq -r '.id')
          WH_PLATFORM_SECRET=$(echo "$WH_PLATFORM" | jq -r '.secret')
          WH_CONNECT_ID=$(echo "$WH_CONNECT" | jq -r '.id')
          WH_CONNECT_SECRET=$(echo "$WH_CONNECT" | jq -r '.secret')
          echo "::add-mask::$WH_PLATFORM_SECRET"
          echo "::add-mask::$WH_CONNECT_SECRET"
          echo "platform_endpoint_id=$WH_PLATFORM_ID" >> "$GITHUB_OUTPUT"
          echo "connect_endpoint_id=$WH_CONNECT_ID" >> "$GITHUB_OUTPUT"
          # Secrets edge de la BRANCHE (clé test + 2 signing secrets) — redémarre les fns
          curl -sf -X POST "https://api.supabase.com/v1/projects/${{ inputs.branch_ref }}/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "[{\"name\":\"STRIPE_SECRET_KEY\",\"value\":\"$STRIPE_TEST_SECRET_KEY\"},{\"name\":\"STRIPE_PLATFORM_WEBHOOK_SECRET\",\"value\":\"$WH_PLATFORM_SECRET\"},{\"name\":\"STRIPE_CONNECT_WEBHOOK_SECRET\",\"value\":\"$WH_CONNECT_SECRET\"}]"
          echo "⏳ propagation secrets edge…"; sleep 45
          echo "✅ endpoints plateforme/Connect + secrets branche posés."
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dérouler les legs Stripe
        # pipefail OBLIGATOIRE : sans lui, `| tee` rend le step vert même si le
        # script échoue (faux positif run #2 du 08/07 — 73 s « vert » avec
        # rapport vide). Un FAIL du harness doit faire le run ROUGE (§6.2).
        run: |
          set -euo pipefail
          npx tsx scripts/recette-escrow-stripe.ts | tee rapport-stripe.log
        env:
          RECETTE_BRANCH_REF: ${{ inputs.branch_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

      - name: Nettoyage endpoint webhook (toujours)
        if: always()
        run: |
          [ -n "${{ steps.wh.outputs.platform_endpoint_id }}" ] && \
            curl -s -X DELETE "https://api.stripe.com/v1/webhook_endpoints/${{ steps.wh.outputs.platform_endpoint_id }}" \
              -u "$STRIPE_TEST_SECRET_KEY:" > /dev/null || true
          [ -n "${{ steps.wh.outputs.connect_endpoint_id }}" ] && \
            curl -s -X DELETE "https://api.stripe.com/v1/webhook_endpoints/${{ steps.wh.outputs.connect_endpoint_id }}" \
              -u "$STRIPE_TEST_SECRET_KEY:" > /dev/null || true
          echo "endpoints webhooks supprimés."
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

      - name: Rapport artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapport-recette-stripe
          path: rapport-stripe.log
          retention-days: 90
