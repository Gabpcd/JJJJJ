name: Mobile delivery — manual release only

# Lot 6 (docs/mobile-swift/DECISIONS_LOT6.md) : ce workflow ne livre plus qu'Android, la coquille
# Capacitor (android/) : build natif Google Play, ou mise à jour OTA signée. Il ne construit ni ne
# soumet plus rien pour iOS : la coquille Capacitor iOS (ios/) est gelée, et l'app Swift passe par
# ios-native-testflight.yml (envoi) puis ios-native-app-store.yml (soumission), sans OTA (Apple 2.5.2).

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, native, ota]
        default: check
        description: 'Android only. check: verify only; native: build and submit to Google Play; ota: publish compatible signed update'

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

concurrency:
  group: mobile-delivery
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      guard_sha: ${{ steps.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # A manual release must use trusted main; branch dispatches cannot publish.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - id: guard
        # Freeze the guard implementation from the trusted main checkout, even
        # when the release resumes an older reserved source without this helper.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOBILE_DELIVERY_SHA: ${{ github.sha }}
          MOBILE_DELIVERY_MODE: ${{ inputs.mode || 'check' }}
          MOBILE_DELIVERY_PLATFORM: android
        run: node scripts/mobile/delivery-plan.mjs

  ota:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'ota' && needs.plan.outputs.mode == 'ota'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build compatible mobile bundle
        env:
          VITE_NATIVE_BUILD: 'true'
          GIT_COMMIT_SHA: ${{ needs.plan.outputs.sha }}
          VITE_ENV: production
          VITE_TURNSTILE_SITE_KEY: ''
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: npm run preflight:mobile && REQUIRE_ANDROID_APP_LINKS=1 npm run build
      - name: Sign the archive and compatibility manifest
        env:
          MOBILE_UPDATE_PRIVATE_KEY: ${{ secrets.MOBILE_UPDATE_PRIVATE_KEY }}
          MOBILE_UPDATE_KEY_FILE: ${{ runner.temp }}/mobile-update.pem
        run: |
          node -e 'require("fs").writeFileSync(process.env.MOBILE_UPDATE_KEY_FILE,process.env.MOBILE_UPDATE_PRIVATE_KEY,{mode:0o600})'
          node scripts/mobile/sign-update.mjs
      - name: Recheck deployed backend before OTA publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOBILE_DELIVERY_SHA: ${{ needs.plan.outputs.sha }}
          MOBILE_DELIVERY_GUARD_SHA: ${{ needs.plan.outputs.guard_sha }}
        run: |
          [[ "$MOBILE_DELIVERY_GUARD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git show "$MOBILE_DELIVERY_GUARD_SHA:scripts/mobile/delivery-plan-backend.mjs" > "$RUNNER_TEMP/mobile-delivery-plan-backend.mjs"
          node "$RUNNER_TEMP/mobile-delivery-plan-backend.mjs"
      - name: Publish archive first and manifest last
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mobile/publish-update.mjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/mobile-update.pem"

  reserve-native:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'native' && needs.plan.outputs.mode == 'native'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: node scripts/mobile/release-state.mjs reserve android

  native:
    needs: [plan, reserve-native]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'native' && needs.plan.outputs.mode == 'native'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GIT_COMMIT_SHA: ${{ needs.plan.outputs.sha }}
      VITE_ENV: production
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: node scripts/mobile/release-state.mjs check android
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.state.outputs.submitted != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - if: steps.state.outputs.submitted != 'true'
        run: npm ci
      - if: steps.state.outputs.submitted != 'true'
        run: npm run build:mobile
      - name: Restore Android signing
        if: steps.state.outputs.submitted != 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/mobile/prepare-ci-signing.mjs android
      - name: Build Android release
        if: steps.state.outputs.submitted != 'true'
        working-directory: android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.state.outputs.submitted != 'true'
        with:
          name: mobile-android-${{ needs.plan.outputs.sha }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Recheck deployed backend before store submission
        if: steps.state.outputs.submitted != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOBILE_DELIVERY_SHA: ${{ needs.plan.outputs.sha }}
          MOBILE_DELIVERY_GUARD_SHA: ${{ needs.plan.outputs.guard_sha }}
        run: |
          [[ "$MOBILE_DELIVERY_GUARD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git show "$MOBILE_DELIVERY_GUARD_SHA:scripts/mobile/delivery-plan-backend.mjs" > "$RUNNER_TEMP/mobile-delivery-plan-backend.mjs"
          node "$RUNNER_TEMP/mobile-delivery-plan-backend.mjs"
      - name: Submit Android for review
        if: steps.state.outputs.submitted != 'true'
        env:
          GOOGLE_PLAY_KEY_FILE: ${{ runner.temp }}/jolene-signing/play.json
          ANDROID_AAB_PATH: ${{ github.workspace }}/android/app/build/outputs/bundle/release/app-release.aab
        run: bundle exec fastlane android submit
      - name: Record the Android submission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: node scripts/mobile/release-state.mjs record android
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/jolene-signing"
