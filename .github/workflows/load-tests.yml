name: Load tests (k6)

# Lance les tests de charge k6 contre le projet STAGING.
# Trigger MANUEL (workflow_dispatch) — JAMAIS sur prod, JAMAIS auto sur push.
#
# Prérequis :
# 1. Workflow `deploy-supabase-staging.yml` exécuté au moins 1× (schema + edge fns)
# 2. Secrets GitHub :
#    - STAGING_SUPABASE_PROJECT_REF et STAGING_SUPABASE_ACCESS_TOKEN
#      (URL et clés du staging résolues et masquées à chaque exécution)
#    - PLAYWRIGHT_TEST_PASSWORD : mot de passe des comptes de recette fixes
#
# Voir docs/tests-charge.md pour les cibles de performance et l'interprétation des résultats.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scénario à exécuter"
        type: choice
        required: true
        default: '03-recherche-missions'
        options:
          - '01-inscription-bloc'
          - '02-login-simultane'
          - '03-recherche-missions'
          - '04-candidatures-simultanees'
          - '05-dashboard-concurrent'
          - '06-cron-weekly-invoicing'
          - 'all'
      vus_override:
        description: "VUs override (vide = défaut du script)"
        type: string
        required: false
        default: ''
      duration_override:
        description: "Durée override (vide = défaut du script, ex: 2m)"
        type: string
        required: false
        default: ''
      dashboard_fixture_only:
        description: "E seulement : préparer/contrôler/nettoyer dix profils, sans k6"
        type: boolean
        required: false
        default: false
      diagnostic_sql:
        description: "Avant C/all : six sondes SQL staging en lecture seule sur le catalogue préparé"
        type: boolean
        required: false
        default: false
      candidatures_frontend_only:
        description: "D2 seulement : trois connexions UI et deux candidatures, sans k6"
        type: boolean
        required: false
        default: false
      candidatures_frontend_date:
        description: "D2 UI seulement : jour explicite YYYY-MM-DD, entre 1 et 31 jours dans le futur"
        type: string
        required: false
        default: ''
      candidatures_sql_only:
        description: "D2 seulement : preuve SQL annulée, sans Auth HTTP ni k6"
        type: boolean
        required: false
        default: false
      candidatures_sql_date:
        description: "D2 SQL seulement : jour explicite YYYY-MM-DD, entre 1 et 31 jours dans le futur"
        type: string
        required: false
        default: ''

concurrency:
  group: jolene-supabase-staging-writes
  cancel-in-progress: false

jobs:
  load-tests:
    if: ${{ !inputs.candidatures_frontend_only && inputs.candidatures_frontend_date == '' && !inputs.candidatures_sql_only && inputs.candidatures_sql_date == '' && (!inputs.dashboard_fixture_only || inputs.scenario != '05-dashboard-concurrent') }}
    name: Run k6 scenario(s)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Vérifier le périmètre du mode sans charge
        env:
          FIXTURE_ONLY: ${{ inputs.dashboard_fixture_only }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ "$FIXTURE_ONLY" = "true" ] && [ "$SCENARIO" != "05-dashboard-concurrent" ]; then
            echo "::error::Le contrôle sans charge est réservé au scénario E."
            exit 1
          fi

      - name: Install k6
        if: ${{ !inputs.dashboard_fixture_only }}
        uses: grafana/setup-k6-action@v1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Résoudre les accès du staging uniquement
        run: node scripts/ci/prepare-staging-api-env.mjs
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Verify k6 installation
        if: ${{ !inputs.dashboard_fixture_only }}
        run: k6 version

      - name: Sanity check — staging URL répond
        run: |
          set -e
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            "${STAGING_SUPABASE_URL}/auth/v1/health" \
            -H "apikey: ${STAGING_SUPABASE_ANON_KEY}" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging URL ne répond pas (status=$STATUS). Vérifier que deploy-supabase-staging.yml a été exécuté."
            exit 1
          fi
          echo "Staging /auth/v1/health OK ($STATUS)"

      - name: Prepare results directory
        run: mkdir -p tests/load/results

      - name: Préparer le catalogue fictif de recherche sur staging
        if: inputs.scenario == '03-recherche-missions' || inputs.scenario == 'all'
        run: node scripts/ci/prepare-load-fixtures.mjs prepare
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_FIXTURE_COUNT: '500'

      - name: Diagnostiquer la recherche sur le catalogue préparé
        if: inputs.diagnostic_sql && (inputs.scenario == '03-recherche-missions' || inputs.scenario == 'all')
        run: node scripts/ci/diagnose-load-fixtures.mjs
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_FIXTURE_COUNT: '500'

      - name: Préparer dix identités dashboard éphémères sur staging
        if: inputs.scenario == '05-dashboard-concurrent' || inputs.scenario == 'all'
        run: node scripts/ci/prepare-dashboard-pool.mjs prepare
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run scenario
        if: ${{ !inputs.dashboard_fixture_only }}
        env:
          LOAD_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_TEST_SCENARIO: ${{ inputs.scenario }}
          LOAD_TEST_VUS: ${{ inputs.vus_override }}
          LOAD_TEST_DURATION: ${{ inputs.duration_override }}
        run: |
          set -euo pipefail

          # Les paramètres restent des données, jamais du code shell.
          [[ -z "$LOAD_TEST_VUS" || "$LOAD_TEST_VUS" =~ ^[1-9][0-9]{0,2}$ ]] || exit 1
          [[ -z "$LOAD_TEST_DURATION" || "$LOAD_TEST_DURATION" =~ ^[1-9][0-9]{0,3}(s|m)$ ]] || exit 1
          [[ "$LOAD_TEST_SCENARIO" =~ ^(all|0[1-6]-[a-z-]+)$ ]] || exit 1

          run_one() {
            local script="$1"
            echo "::group::k6 run $script"
            # `|| true` : on capture l'exit code mais on continue pour avoir
            # les résultats. La somme des thresholds échoués décide en step
            # final si on fail le job.
            local EXIT_CODE=0
            k6 run "$script" || EXIT_CODE=$?
            echo "::endgroup::"
            return ${EXIT_CODE:-0}
          }

          if [ "$LOAD_TEST_SCENARIO" = "all" ]; then
            FAILED=0
            for s in tests/load/scenarios/*.js; do
              run_one "$s" || FAILED=$((FAILED + 1))
            done
            echo "Scenarios échoués (thresholds dépassés) : $FAILED"
            exit $FAILED
          else
            run_one "tests/load/scenarios/${LOAD_TEST_SCENARIO}.js"
          fi

      - name: Nettoyer exclusivement les dix identités dashboard du manifeste
        if: always() && (inputs.scenario == '05-dashboard-concurrent' || inputs.scenario == 'all')
        run: node scripts/ci/prepare-dashboard-pool.mjs cleanup
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Nettoyer exclusivement les données du manifeste
        if: always() && (inputs.scenario == '03-recherche-missions' || inputs.scenario == 'all')
        run: node scripts/ci/prepare-load-fixtures.mjs cleanup
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_FIXTURE_COUNT: '500'

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ inputs.scenario }}-${{ github.run_id }}
          path: tests/load/results/
          retention-days: 30

      - name: Summary
        if: always()
        env:
          SCENARIO: ${{ inputs.scenario }}
          FIXTURE_ONLY: ${{ inputs.dashboard_fixture_only }}
        run: |
          {
            echo "### Load test $SCENARIO sur staging"
            echo "Mode contrôle fixtures sans k6 : $FIXTURE_ONLY"
            echo ""
            if [ -d tests/load/results ]; then
              for f in tests/load/results/*.json; do
                [ -f "$f" ] || continue
                echo "- \`$(basename "$f")\` ($(stat -c %s "$f") bytes)"
              done
            fi
            echo ""
            echo "Métriques détaillées : artifacts \`k6-results-*\`."
            echo "Cibles + interprétation : voir \`docs/tests-charge.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  dashboard-frontend:
    name: E10 — deux identités frontend staging, sans charge
    if: ${{ !inputs.candidatures_frontend_only && inputs.candidatures_frontend_date == '' && !inputs.candidatures_sql_only && inputs.candidatures_sql_date == '' && inputs.dashboard_fixture_only && inputs.scenario == '05-dashboard-concurrent' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Résoudre les accès du staging uniquement
        run: node scripts/ci/prepare-staging-api-env.mjs
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      - name: Construire le frontend connecté au staging, sans télémétrie
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.STAGING_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ env.STAGING_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ''
          VITE_TURNSTILE_SITE_KEY: ''
          VITE_ENV: test
          SENTRY_UPLOAD_ENABLED: 'false'
      - name: Vérifier la preview locale avant toute création de compte
        run: node scripts/ci/recette-dashboard-staging.mjs verify-preview
      - name: Préparer les dix identités après le build
        id: prepare
        timeout-minutes: 4
        run: node scripts/ci/prepare-dashboard-pool.mjs prepare
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deux connexions UI réelles, dashboard et rechargement
        id: recette_ui
        timeout-minutes: 4
        run: node scripts/ci/recette-dashboard-staging.mjs run
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Nettoyer les manifests exacts sans supprimer les audits
        if: always()
        timeout-minutes: 6
        run: node scripts/ci/prepare-dashboard-pool.mjs cleanup
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirmer les zéros après cleanup et les audits conservés
        if: always() && steps.prepare.outcome == 'success'
        run: node scripts/ci/recette-dashboard-staging.mjs verify-cleanup
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preuves filtrées, sans sessions ni traces réseau
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ui-staging-${{ github.run_id }}
          path: tests/load/results/
          retention-days: 7

  candidatures-sql:
    name: D2 — preuve SQL sous ROLLBACK uniquement
    # Une date sans drapeau sélectionne aussi ce job, qui la refuse : pas de
    # repli silencieux vers k6. Toute combinaison D2 exclut les deux autres jobs.
    if: ${{ !inputs.candidatures_frontend_only && inputs.candidatures_frontend_date == '' && (inputs.candidatures_sql_only || inputs.candidatures_sql_date != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      LOAD_D_SQL_ONLY: ${{ inputs.candidatures_sql_only }}
      LOAD_D_SQL_JOUR: ${{ inputs.candidatures_sql_date }}
      LOAD_TEST_SCENARIO: ${{ inputs.scenario }}
      LOAD_TEST_VUS: ${{ inputs.vus_override }}
      LOAD_TEST_DURATION: ${{ inputs.duration_override }}
      DASHBOARD_FIXTURE_ONLY: ${{ inputs.dashboard_fixture_only }}
      DIAGNOSTIC_SQL: ${{ inputs.diagnostic_sql }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: https://mejpriaetwgtcstbgfid.supabase.co
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Refuser les combinaisons invalides avant tout accès distant
        run: node scripts/ci/prove-candidatures-rollback.mjs check
      - name: Catalogue figé puis transaction D2 annulée
        run: node scripts/ci/prove-candidatures-rollback.mjs run
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Conserver uniquement le résultat filtré de la preuve SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2-sql-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/load/results/d2-sql-rollback.json
          if-no-files-found: error
          retention-days: 7


  candidatures-frontend:
    name: D2 — deux candidatures frontend staging, sans k6
    # Toute entrée UI sélectionne ce job : date seule et modes combinés sont
    # refusés par check AVANT résolution des clés, build ou accès distant.
    if: ${{ inputs.candidatures_frontend_only || inputs.candidatures_frontend_date != '' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LOAD_D_FRONTEND_ONLY: ${{ inputs.candidatures_frontend_only }}
      LOAD_D_JOUR: ${{ inputs.candidatures_frontend_date }}
      LOAD_D_SQL_ONLY: ${{ inputs.candidatures_sql_only }}
      LOAD_D_SQL_JOUR: ${{ inputs.candidatures_sql_date }}
      LOAD_TEST_SCENARIO: ${{ inputs.scenario }}
      LOAD_TEST_VUS: ${{ inputs.vus_override }}
      LOAD_TEST_DURATION: ${{ inputs.duration_override }}
      DASHBOARD_FIXTURE_ONLY: ${{ inputs.dashboard_fixture_only }}
      DIAGNOSTIC_SQL: ${{ inputs.diagnostic_sql }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: https://mejpriaetwgtcstbgfid.supabase.co
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Refuser modes combinés et paramètres invalides avant accès distant
        id: check
        run: node scripts/ci/recette-candidatures-staging.mjs check
      - name: Vérifier le catalogue figé avant tout compte Auth
        run: node scripts/ci/recette-candidatures-staging.mjs catalogue
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - run: npm ci
      - name: Résoudre les accès du staging uniquement
        run: node scripts/ci/prepare-staging-api-env.mjs
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Construire le frontend staging sans télémétrie
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.STAGING_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ env.STAGING_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ''
          VITE_TURNSTILE_SITE_KEY: ''
          VITE_ENV: test
          SENTRY_UPLOAD_ENABLED: 'false'
      - name: Vérifier la preview avant toute création Auth
        run: node scripts/ci/recette-candidatures-staging.mjs verify-preview
      - name: Préparer exactement deux AS et un établissement
        id: prepare
        timeout-minutes: 3
        run: node scripts/ci/recette-candidatures-staging.mjs prepare
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Connexions, deux dépôts puis relecture établissement et recharges
        timeout-minutes: 5
        run: node scripts/ci/recette-candidatures-staging.mjs run
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Compter les audits après fermeture des navigateurs même sur échec UI
        if: always() && steps.prepare.outcome != 'skipped'
        run: node scripts/ci/recette-candidatures-staging.mjs snapshot
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Nettoyer le manifeste privé exact et conserver tous les audits
        if: always() && steps.prepare.outcome != 'skipped'
        timeout-minutes: 5
        run: node scripts/ci/recette-candidatures-staging.mjs cleanup
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Vérifier les zéros et les audits conservés
        if: always() && steps.prepare.outcome == 'success'
        run: node scripts/ci/recette-candidatures-staging.mjs verify-cleanup
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Preuves filtrées sans manifeste privé ni session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2-frontend-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/load/results/d2-frontend/
          retention-days: 7
