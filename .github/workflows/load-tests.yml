name: Load tests (k6)

# Lance les tests de charge k6 contre le projet STAGING.
# Trigger MANUEL (workflow_dispatch) — JAMAIS sur prod, JAMAIS auto sur push.
#
# Prérequis :
# 1. Workflow `deploy-supabase-staging.yml` exécuté au moins 1× (schema + edge fns)
# 2. Secrets GitHub :
#    - STAGING_SUPABASE_PROJECT_REF et STAGING_SUPABASE_ACCESS_TOKEN
#      (URL et clés du staging résolues et masquées à chaque exécution)
#    - PLAYWRIGHT_TEST_PASSWORD : mot de passe des comptes de recette fixes
#
# Voir docs/tests-charge.md pour les cibles de performance et l'interprétation des résultats.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scénario à exécuter"
        type: choice
        required: true
        default: '03-recherche-missions'
        options:
          - '01-inscription-bloc'
          - '02-login-simultane'
          - '03-recherche-missions'
          - '04-candidatures-simultanees'
          - '05-dashboard-concurrent'
          - '06-cron-weekly-invoicing'
          - 'all'
      vus_override:
        description: "VUs override (vide = défaut du script)"
        type: string
        required: false
        default: ''
      duration_override:
        description: "Durée override (vide = défaut du script, ex: 2m)"
        type: string
        required: false
        default: ''
      diagnostic_sql:
        description: "Avant C/all : six sondes SQL staging en lecture seule sur le catalogue préparé"
        type: boolean
        required: false
        default: false

concurrency:
  group: jolene-supabase-staging-writes
  cancel-in-progress: false

jobs:
  load-tests:
    name: Run k6 scenario(s)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Résoudre les accès du staging uniquement
        run: node scripts/ci/prepare-staging-api-env.mjs
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Verify k6 installation
        run: k6 version

      - name: Sanity check — staging URL répond
        run: |
          set -e
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            "${STAGING_SUPABASE_URL}/auth/v1/health" \
            -H "apikey: ${STAGING_SUPABASE_ANON_KEY}" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging URL ne répond pas (status=$STATUS). Vérifier que deploy-supabase-staging.yml a été exécuté."
            exit 1
          fi
          echo "Staging /auth/v1/health OK ($STATUS)"

      - name: Prepare results directory
        run: mkdir -p tests/load/results

      - name: Préparer le catalogue fictif de recherche sur staging
        if: inputs.scenario == '03-recherche-missions' || inputs.scenario == 'all'
        run: node scripts/ci/prepare-load-fixtures.mjs prepare
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_FIXTURE_COUNT: '500'

      - name: Diagnostiquer la recherche sur le catalogue préparé
        if: inputs.diagnostic_sql && (inputs.scenario == '03-recherche-missions' || inputs.scenario == 'all')
        run: node scripts/ci/diagnose-load-fixtures.mjs
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_FIXTURE_COUNT: '500'

      - name: Run scenario
        env:
          LOAD_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_TEST_SCENARIO: ${{ inputs.scenario }}
          LOAD_TEST_VUS: ${{ inputs.vus_override }}
          LOAD_TEST_DURATION: ${{ inputs.duration_override }}
        run: |
          set -euo pipefail

          # Les paramètres restent des données, jamais du code shell.
          [[ -z "$LOAD_TEST_VUS" || "$LOAD_TEST_VUS" =~ ^[1-9][0-9]{0,2}$ ]] || exit 1
          [[ -z "$LOAD_TEST_DURATION" || "$LOAD_TEST_DURATION" =~ ^[1-9][0-9]{0,3}(s|m)$ ]] || exit 1
          [[ "$LOAD_TEST_SCENARIO" =~ ^(all|0[1-6]-[a-z-]+)$ ]] || exit 1

          run_one() {
            local script="$1"
            echo "::group::k6 run $script"
            # `|| true` : on capture l'exit code mais on continue pour avoir
            # les résultats. La somme des thresholds échoués décide en step
            # final si on fail le job.
            local EXIT_CODE=0
            k6 run "$script" || EXIT_CODE=$?
            echo "::endgroup::"
            return ${EXIT_CODE:-0}
          }

          if [ "$LOAD_TEST_SCENARIO" = "all" ]; then
            FAILED=0
            for s in tests/load/scenarios/*.js; do
              run_one "$s" || FAILED=$((FAILED + 1))
            done
            echo "Scenarios échoués (thresholds dépassés) : $FAILED"
            exit $FAILED
          else
            run_one "tests/load/scenarios/${LOAD_TEST_SCENARIO}.js"
          fi

      - name: Nettoyer exclusivement les données du manifeste
        if: always() && (inputs.scenario == '03-recherche-missions' || inputs.scenario == 'all')
        run: node scripts/ci/prepare-load-fixtures.mjs cleanup
        env:
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          LOAD_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_FIXTURE_COUNT: '500'

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ inputs.scenario }}-${{ github.run_id }}
          path: tests/load/results/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### Load test ${{ inputs.scenario }} sur staging" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d tests/load/results ]; then
            for f in tests/load/results/*.json; do
              [ -f "$f" ] || continue
              echo "- \`$(basename "$f")\` ($(stat -c %s "$f") bytes)" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Métriques détaillées : artifacts \`k6-results-*\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Cibles + interprétation : voir \`docs/tests-charge.md\`." >> "$GITHUB_STEP_SUMMARY"
