name: Installer SMS signature staging fermé (manuel)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA main exact portant cet installateur et son manifeste relus
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: jolene-supabase-staging-writes
  queue: max
  cancel-in-progress: false

jobs:
  install-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Refuser tout contexte autre que main exact avant credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'Gabpcd/JJJJJ' || "$GITHUB_EVENT_NAME" != 'workflow_dispatch' || "$GITHUB_REF" != 'refs/heads/main' || ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ || "$GITHUB_SHA" != "$EXPECTED_SHA" || "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            echo 'EXACT_TRUSTED_MAIN_REQUIRED'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.14.0'
      - name: Tester les refus et le transport simulé sans secret ni réseau
        run: node --test tests/node/install-sms-staging-closed.node.mjs tests/node/install-sms-staging-closed-sql.node.mjs
      - name: Installer uniquement la CLI Supabase figée
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.98.0'
      - name: Prouver la cible, déployer send-sms seul puis installer le SQL vide
        timeout-minutes: 10
        run: node scripts/ci/install-sms-staging-closed.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Publier seulement le reçu fermé
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-sms-staging-closed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install-sms-staging-closed/result.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
