permissions:
  contents: read

concurrency:
  group: ios-swift-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  # Toolchain fixée, identique au pilote (mobile-native/scripts/ios-ci-toolchain.mjs) :
  # jamais de repli silencieux vers une autre version de Xcode ou de runtime.
  JOLENE_XCODE_APP: /Applications/Xcode_26.4.1.app
  JOLENE_XCODE_VERSION_ATTENDUE: 'Xcode 26.4.1'
  JOLENE_XCODE_BUILD_ATTENDU: '17E202'
  JOLENE_IOS_RUNTIME: '26.2'

defaults:
  run:
    shell: bash

jobs:
  coeur:
    name: Cœur — golden et contrats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 8
      - name: Vecteurs golden à jour (export puis diff)
        run: |
          if [ ! -f scripts/mobile/export-golden-vectors.mjs ]; then
            echo "::error::scripts/mobile/export-golden-vectors.mjs est absent : les vecteurs golden du plan §11 jours 3-4 ne sont pas encore exportés. Ce job ne peut pas déclarer les règles portées vérifiées."
            exit 1
          fi
          node scripts/mobile/export-golden-vectors.mjs
          git diff --exit-code --stat -- ios-native scripts/mobile \
            || { echo "::error::Les vecteurs golden versionnés diffèrent de l'export : relancez le script et versionnez le résultat."; exit 1; }
          if [ -n "$(git status --porcelain -- ios-native)" ]; then
            echo "::error::L'export a créé des fichiers non versionnés sous ios-native/ :"; git status --porcelain -- ios-native; exit 1
          fi
      - name: Fixtures démo à jour (export puis diff)
        run: |
          node scripts/mobile/export-demo-fixtures.mjs
          git diff --exit-code --stat -- ios-native \
            || { echo "::error::Les fixtures démo versionnées diffèrent de l'export (scripts/mobile/export-demo-fixtures.mjs)."; exit 1; }
          if [ -n "$(git status --porcelain -- ios-native)" ]; then
            echo "::error::L'export des fixtures a créé des fichiers non versionnés sous ios-native/ :"; git status --porcelain -- ios-native; exit 1
          fi
      - name: Contrats RPC sans dérive (types.ts, public.sql, manifeste)
        run: node scripts/mobile/check-rpc-contracts.mjs
      - name: Éclats des tests UI cohérents (DECISIONS_LOT2 décision 22)
        run: node --test tests/node/ios-swift-ci-eclats.node.mjs
      - name: Relevé des tests échoués et des durées par éclat — tests du script
        run: node --test scripts/mobile/ios-ci-resume-tests.test.mjs
      # Lot 5, T0 (LOT5_PLAN §2.9) : aucun littéral juridique dans le Swift livré — valeurs des CHECK
      # de matrice_modes_exercice (public.sql), sources de la matrice (migrations), noms interdits,
      # « Code du travail », « Légifrance », articles numérotés ; seules exceptions : TextesWeb.swift
      # et RPCResponse.marqueurCodeDuTravail. Une migration seule ne rejoue pas ce job : un littéral
      # Swift n'apparaît qu'avec un changement sous ios-native/, qui le déclenche.
      - name: Littéraux juridiques absents du Swift livré
        run: node scripts/mobile/check-litteraux-juridiques.mjs
      - name: Garde des littéraux juridiques — cas négatifs
        run: node --test scripts/mobile/check-litteraux-juridiques.test.mjs

  packages:
    name: Packages — swift test macOS
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Sélectionner Xcode 26.4.1 sans repli
        run: |
          sudo xcode-select -s "$JOLENE_XCODE_APP/Contents/Developer"
          version="$(xcodebuild -version)"
          echo "$version"
          [ "$(echo "$version" | sed -n 1p)" = "$JOLENE_XCODE_VERSION_ATTENDUE" ] || { echo "::error::Xcode attendu : $JOLENE_XCODE_VERSION_ATTENDUE"; exit 1; }
          echo "$version" | grep -q "$JOLENE_XCODE_BUILD_ATTENDU" || { echo "::error::Build Xcode attendu : $JOLENE_XCODE_BUILD_ATTENDU"; exit 1; }
          swift --version
      - name: Cache SPM des packages (supabase-swift 2.55.5)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ios-native/Packages/JoleneCore/.build
            ios-native/Packages/JoleneSupabase/.build
          key: spm-packages-${{ runner.os }}-xcode26.4.1-${{ hashFiles('ios-native/Packages/*/Package.swift', 'ios-native/Packages/*/Package.resolved') }}
          restore-keys: |
            spm-packages-${{ runner.os }}-xcode26.4.1-
      - name: JoleneCore — swift test
        working-directory: ios-native/Packages/JoleneCore
        run: |
          # Contrôle de concurrence strict : `swiftSettings` StrictConcurrency des Package.swift,
          # redoublé par le drapeau du compilateur (DECISIONS_LOT0). Les cibles du package sont
          # recompilées à chaque run (le cache SPM ne conserve que les dépendances) pour que
          # chaque avertissement soit visible ; 0 avertissement exigé hors `.build/checkouts/`.
          rm -rf .build/debug/JoleneCore.build .build/debug/JoleneCoreTests.build
          set +e
          swift build --build-tests -Xswiftc -strict-concurrency=complete > "$RUNNER_TEMP/joleneCore-build.log" 2>&1
          code=$?
          set -e
          tail -n 40 "$RUNNER_TEMP/joleneCore-build.log"
          [ "$code" -eq 0 ] || { echo "::error::swift build JoleneCore a échoué (code $code)."; exit 1; }
          avertissements="$(grep -E "^/.*: warning:" "$RUNNER_TEMP/joleneCore-build.log" | grep -v "/.build/checkouts/" | sort -u || true)"
          if [ -n "$avertissements" ]; then
            echo "$avertissements"
            echo "::error::JoleneCore : avertissements de compilation (concurrence stricte) — 0 attendu."; exit 1
          fi
          echo "JoleneCore : 0 avertissement en strict-concurrency=complete" | tee -a "$GITHUB_STEP_SUMMARY"
          set +e
          swift test -Xswiftc -strict-concurrency=complete > "$RUNNER_TEMP/joleneCore-tests.log" 2>&1
          code=$?
          set -e
          tail -n 60 "$RUNNER_TEMP/joleneCore-tests.log"
          [ "$code" -eq 0 ] || { echo "::error::swift test JoleneCore a échoué (code $code)."; exit 1; }
          # Bilan explicite exigé (XCTest ou Swift Testing) : un run sans aucun test n'est pas une preuve.
          xctest="$(grep -oE "Executed [0-9]+ tests?, with 0 failures" "$RUNNER_TEMP/joleneCore-tests.log" | tail -n 1 | grep -oE "[0-9]+" | head -n 1 || true)"
          swifttesting="$(grep -oE "Test run with [0-9]+ tests? passed" "$RUNNER_TEMP/joleneCore-tests.log" | tail -n 1 | grep -oE "[0-9]+" || true)"
          if grep -qE "with [1-9][0-9]* failures|tests? failed" "$RUNNER_TEMP/joleneCore-tests.log"; then echo "::error::JoleneCoreTests : des échecs sont rapportés."; exit 1; fi
          total=$(( ${xctest:-0} + ${swifttesting:-0} ))
          [ "$total" -ge 1 ] || { echo "::error::JoleneCoreTests : aucun test exécuté (XCTest ${xctest:-0}, Swift Testing ${swifttesting:-0})."; exit 1; }
          echo "JoleneCoreTests : $total tests verts (XCTest ${xctest:-0}, Swift Testing ${swifttesting:-0})" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: JoleneSupabase — swift test
        working-directory: ios-native/Packages/JoleneSupabase
        run: |
          # Contrôle de concurrence strict : `swiftSettings` StrictConcurrency des Package.swift,
          # redoublé par le drapeau du compilateur (DECISIONS_LOT0). Les cibles du package sont
          # recompilées à chaque run (le cache SPM ne conserve que les dépendances) pour que
          # chaque avertissement soit visible ; 0 avertissement exigé hors `.build/checkouts/`.
          rm -rf .build/debug/JoleneSupabase.build .build/debug/JoleneSupabaseTests.build
          set +e
          swift build --build-tests -Xswiftc -strict-concurrency=complete > "$RUNNER_TEMP/joleneSupabase-build.log" 2>&1
          code=$?
          set -e
          tail -n 40 "$RUNNER_TEMP/joleneSupabase-build.log"
          [ "$code" -eq 0 ] || { echo "::error::swift build JoleneSupabase a échoué (code $code)."; exit 1; }
          avertissements="$(grep -E "^/.*: warning:" "$RUNNER_TEMP/joleneSupabase-build.log" | grep -v "/.build/checkouts/" | sort -u || true)"
          if [ -n "$avertissements" ]; then
            echo "$avertissements"
            echo "::error::JoleneSupabase : avertissements de compilation (concurrence stricte) — 0 attendu."; exit 1
          fi
          echo "JoleneSupabase : 0 avertissement en strict-concurrency=complete" | tee -a "$GITHUB_STEP_SUMMARY"
          set +e
          swift test -Xswiftc -strict-concurrency=complete > "$RUNNER_TEMP/joleneSupabase-tests.log" 2>&1
          code=$?
          set -e
          tail -n 60 "$RUNNER_TEMP/joleneSupabase-tests.log"
          [ "$code" -eq 0 ] || { echo "::error::swift test JoleneSupabase a échoué (code $code)."; exit 1; }
          # Bilan explicite exigé (XCTest ou Swift Testing) : un run sans aucun test n'est pas une preuve.
          xctest="$(grep -oE "Executed [0-9]+ tests?, with 0 failures" "$RUNNER_TEMP/joleneSupabase-tests.log" | tail -n 1 | grep -oE "[0-9]+" | head -n 1 || true)"
          swifttesting="$(grep -oE "Test run with [0-9]+ tests? passed" "$RUNNER_TEMP/joleneSupabase-tests.log" | tail -n 1 | grep -oE "[0-9]+" || true)"
          if grep -qE "with [1-9][0-9]* failures|tests? failed" "$RUNNER_TEMP/joleneSupabase-tests.log"; then echo "::error::JoleneSupabaseTests : des échecs sont rapportés."; exit 1; fi
          total=$(( ${xctest:-0} + ${swifttesting:-0} ))
          [ "$total" -ge 1 ] || { echo "::error::JoleneSupabaseTests : aucun test exécuté (XCTest ${xctest:-0}, Swift Testing ${swifttesting:-0})."; exit 1; }
          echo "JoleneSupabaseTests : $total tests verts (XCTest ${xctest:-0}, Swift Testing ${swifttesting:-0})" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Conserver les journaux swift test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-swift-packages-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/*-tests.log
          retention-days: 7
          if-no-files-found: warn

  ui:
    name: UI — ${{ matrix.format }}
    runs-on: macos-26
    # Onze éclats de tests bornés à 30 min chacun et un build borné à 25 min (DECISIONS_LOT2 décision 22 ; DECISIONS_LOT3,
    # intégration de T3b, T7, T8, T10, T11, T12 et L3-TJ ; fusion des lots 2 et 3 : socle, quatre éclats du lot 2, six du
    # lot 3). 25 + 11 × 30 = 355 min dépasserait, avec la marge de préparation (checkout, simulateur, cache), le plafond
    # d'un job GitHub (360 min) : le job est porté à ce plafond. Les deux gardes restent tenues (ios-swift-ci-eclats :
    # plafond ≥ somme des éclats + 15 min = 345 ; check-rpc-contracts-lot3 : plafond ≥ 30 × 11 + 20 = 350). Durées
    # mesurées très en dessous de leurs délais (lot 2 seul : environ 1 h 20 ; lot 3 seul : environ 1 h 35, socle compris) :
    # le délai d'un éclat tombe avant celui du job sauf si presque tous les éclats atteignent leurs 30 min. Au-delà de
    # onze éclats, scinder le job (un job par lot) plutôt que d'ajouter un éclat : c'est fait pour le lot 1 (job
    # `ui-lot1`, « UI lot 1 — <format> », intégration de la vague B du 18/11/2026), qui reçoit ses XCUITest.
    # Gel iPhone (DECISIONS_LOT2, « Gel iPhone CI — 16/11/2026 ») : après un éclat gelé ou hors délai, le simulateur est
    # redémarré au début de l'éclat suivant, borné à 2 min dans ses 30 min (scripts/mobile/ios-ci-gel-simulateur.sh) :
    # aucune étape ni minute ajoutée au plafond.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: iphone, famille: iphone, orientation: portrait }
          - { format: ipad-portrait, famille: ipad, orientation: portrait }
          - { format: ipad-landscape, famille: ipad, orientation: landscape }
    env:
      JOLENE_UI_FORMAT: ${{ matrix.format }}
      JOLENE_UI_FAMILLE: ${{ matrix.famille }}
      JOLENE_UI_ORIENTATION: ${{ matrix.orientation }}
      JOLENE_UI_OUTPUT: ${{ github.workspace }}/ios-native/test-results/${{ matrix.format }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Sélectionner Xcode 26.4.1 sans repli
        run: |
          sudo xcode-select -s "$JOLENE_XCODE_APP/Contents/Developer"
          version="$(xcodebuild -version)"
          echo "$version"
          [ "$(echo "$version" | sed -n 1p)" = "$JOLENE_XCODE_VERSION_ATTENDUE" ] || { echo "::error::Xcode attendu : $JOLENE_XCODE_VERSION_ATTENDUE"; exit 1; }
          echo "$version" | grep -q "$JOLENE_XCODE_BUILD_ATTENDU" || { echo "::error::Build Xcode attendu : $JOLENE_XCODE_BUILD_ATTENDU"; exit 1; }
      - name: Choisir le simulateur iOS 26.2 (iPhone 17 ou iPad (A16)) sans installer de SDK
        id: simulateur
        run: |
          runtimes="$(xcrun simctl list runtimes --json)"
          devices="$(xcrun simctl list devices available --json)"
          # Réutilise la politique du pilote (mobile-native/scripts/ios-ci-toolchain.mjs) sans la modifier.
          udid="$(RUNTIMES="$runtimes" DEVICES="$devices" node --input-type=module -e '
            import { selectIosCiSimulator } from "./mobile-native/scripts/ios-ci-toolchain.mjs";
            const { device } = selectIosCiSimulator(JSON.parse(process.env.RUNTIMES).runtimes, JSON.parse(process.env.DEVICES).devices, process.env.JOLENE_UI_FAMILLE);
            process.stdout.write(device.udid);
          ')"
          echo "Simulateur retenu : $udid ($JOLENE_UI_FAMILLE, iOS $JOLENE_IOS_RUNTIME)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
      - name: Cache des paquets SPM clonés par xcodebuild
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/spm-cloned
          key: spm-xcodebuild-${{ runner.os }}-xcode26.4.1-${{ hashFiles('ios-native/Jolene.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios-native/Packages/*/Package.swift') }}
          restore-keys: |
            spm-xcodebuild-${{ runner.os }}-xcode26.4.1-
      - name: build-for-testing (scheme Jolene, sans signature) — une fois par job
        id: build
        # Délai propre au build (seconde revue fraîche de T4b, m6) : un build bloqué s'arrête ici, pas au
        # plafond du job (premier run vert : quelques minutes ; marge large).
        timeout-minutes: 25
        env:
          UDID: ${{ steps.simulateur.outputs.udid }}
        run: |
          mkdir -p "$JOLENE_UI_OUTPUT"
          debut=$(date +%s)
          set +e
          xcodebuild build-for-testing \
            -project ios-native/Jolene.xcodeproj \
            -scheme Jolene \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cloned" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > "$JOLENE_UI_OUTPUT/build-for-testing.log" 2>&1
          code=$?
          set -e
          duree=$(( $(date +%s) - debut ))
          grep -E "error: |warning: .*(JOLENE|Jolene)|\*\* TEST BUILD" "$JOLENE_UI_OUTPUT/build-for-testing.log" | tail -n 40 || true
          echo "duree_build_s=$duree" >> "$GITHUB_OUTPUT"
          echo "Durée build-for-testing : ${duree}s (mesure pour la porte go/no-go, docs/mobile-swift/PORTE_LOT0.md)"
          grep -q "TEST BUILD SUCCEEDED" "$JOLENE_UI_OUTPUT/build-for-testing.log" || { echo "::error::build-for-testing a échoué (code $code). Voir build-for-testing.log dans l'artefact."; exit 1; }
      - name: Package.resolved de l'app inchangé après la résolution SPM
        id: package_resolved
        # Revue fraîche B8 n°1 de L3-T15, m4 : build-for-testing résout les paquets (Sentry Cocoa et supabase-swift en
        # version exacte, dépendances transitives épinglées). Un Package.resolved réécrit voudrait dire que la CI a testé
        # un graphe que le dépôt ne décrit pas ; l'étape échoue toujours dans ce cas (jamais de continue-on-error).
        # Revue B8 de la vague 5, M1 : la référence est le fichier qu'écrit Xcode 26.4.1 (SwiftPM 6.2), celui du TestFlight
        # (`-onlyUsePackageVersionsFromResolvedFile`, ios-native-testflight.yml). SwiftPM 6.2 y élague
        # opentelemetry-swift-core et swift-atomics (trait OpenTelemetry de supabase-swift, désactivé), qu'Xcode 16.4
        # épingle ; aucun des deux n'épingle KSCrash (SENTRY_IOS.md §1). Diagnostic sans relancer ni attendre la fin du job : le diff est imprimé ici, le fichier
        # résolu et ce diff sont copiés dans $JOLENE_UI_OUTPUT/package-resolved/, puis publiés aussitôt par l'étape
        # suivante dans l'artefact « package-resolved-<format>-<sha> », lisible pendant que les éclats tournent.
        # **Correctif : committer tel quel le Package.resolved de cet artefact** (ou corriger project.yml si une version a
        # changé), puis relancer la CI. Délai de 1 min, plus 1 min pour l'artefact, hors éclats : le plafond du job reste
        # tenu (25 + 1 + 1 + 11 × 30 = 357 ≤ 360). Garde : tests/node/ios-swift-ci-eclats.node.mjs.
        timeout-minutes: 1
        run: |
          fichier=ios-native/Jolene.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if ! git diff --exit-code -- "$fichier"; then
            diagnostic="$JOLENE_UI_OUTPUT/package-resolved"
            mkdir -p "$diagnostic"
            git diff -- "$fichier" > "$diagnostic/Package.resolved.diff" || true
            if [ -f "$fichier" ]; then cp "$fichier" "$diagnostic/Package.resolved"; else echo "Package.resolved absent après la résolution SPM." > "$diagnostic/Package.resolved.absent"; fi
            { xcodebuild -version; echo "Commit testé : ${{ github.event.pull_request.head.sha || github.sha }}"; } > "$diagnostic/toolchain.txt" 2>&1 || true
            echo "::error::Package.resolved de l'app réécrit par la résolution SPM d'Xcode 26.4.1 (diff ci-dessus). Correctif : committer tel quel le Package.resolved de l'artefact package-resolved-$JOLENE_UI_FORMAT-<sha> (ou corriger project.yml si une version a changé), puis relancer la CI (docs/mobile-swift/SENTRY_IOS.md §1)."
            exit 1
          fi
      - name: Publier le Package.resolved résolu par la CI (diagnostic, sur échec seulement)
        # Immédiatement après la vérification : l'artefact est lisible dès qu'elle échoue, même si le job est annulé ensuite
        # (journaux perdus à l'annulation, run 43948577842). Il ne change jamais le statut : la vérification a déjà échoué.
        if: failure() && steps.package_resolved.outcome == 'failure'
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-resolved-${{ matrix.format }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ios-native/test-results/${{ matrix.format }}/package-resolved/
          retention-days: 7
          if-no-files-found: warn
      # Éclats (DECISIONS_LOT2 décision 22 : découpage par domaine dès qu'un format dépasse 20 min). Fusion des lots 2 et 3 :
      # socle une seule fois, puis les éclats du lot 2, puis ceux du lot 3 ; chaque classe XCUITest nommée par -only-testing
      # dans un seul éclat, et sautée par le socle (gardes : tests/node/ios-swift-ci-eclats.node.mjs et
      # tests/node/check-rpc-contracts-lot3.node.mjs). Une classe XCUITest nouvelle tourne dans l'éclat socle tant qu'elle
      # n'est pas rangée dans un éclat de lot. Le résumé exige les onze éclats verts.
      # Lot 2 : une seule étape atteignait 25 à 30 min avec le lot 2, et dépassait ses 30 min sur iphone et
      # ipad-landscape au run 42532108708 ; l'éclat « lot2 » unique atteignait 20,7 min en paysage au
      # run 42536866359, d'où sa séparation par domaine par T4b avant l'ajout de DemoPointageTests ;
      # seconde revue fraîche de T4b : DemoPointageTests seul dans l'éclat « pointage », dix tests, pour
      # que « presences » reste sous 20 min avec DemoPointageEtatsTests. Éclats du lot 2 : « presences »
      # (DemoPresencesTests, DemoPointageEtatsTests), « pointage » (DemoPointageTests), « documents »
      # (DemoDocumentsTests ; DemoPresenceDetailTests de T5a depuis la fusion du lot 3 : « presences » atteignait
      # 28,7 min de tests en paysage et dépassait ses 30 min sur les trois formats au run 43349573460 ; « documents »
      # mesurait ensuite 9,7 / 18,5 / 18,1 min (iphone / ipad-portrait / ipad-landscape) au run 43400770161 et ne peut
      # plus rien recevoir sans dépasser 20 min),
      # « contrats » (DemoContratsTests, lecture T9a ; DemoSignatureContratTests, signature T9b). Les classes STAGING à
      # venir (lot 2 T11) s'ajoutent aux -skip-testing de l'éclat socle ; une nouvelle classe démo rejoint l'éclat de
      # son domaine, et ses -skip-testing du socle.
      # Lot 3 (DECISIONS_LOT3, intégration de T3b, T7 et T11, puis T8, T10, T12 et L3-TJ) : l'étape unique
      # dépassait ses 30 min sur iphone et ipad-portrait au run 42536888984 (35 XCUITest sur 58 exécutés) ; au run
      # 42541548740, l'éclat push + centre + préférences + profil prenait 27,5 min sur iphone ; au run 42549855710,
      # « lot3-compte » prenait 19,1 min sur ipad-landscape (seuil de 20 min). « lot3-compte » : liens universels, hub
      # Compte ; « lot3-push » : taps push ; « lot3-notifications » : centre, préférences, profil ; « lot3-inscription » :
      # compte rapide (L3-T7, dont les deux XCUITest de L3-TJ, sorti de « lot3-compte ») et complétion du profil
      # (L3-T8), plus DemoLiensLot2Tests (L2-T10, liens du lot 2 lancés à froid ; revue B8 n°1 de L2-T10, M1) :
      # « lot3-inscription » mesurait 4,9 / 9,0 / 8,7 min au run 43400770161, l'éclat le moins chargé hors
      # « lot3-revenus » (qu'une autre tranche en cours charge), et les liens (~5,5 à 8 min) le laissent sous 20 min, sans
      # douzième éclat (plafond du job) ; « lot3-profil-photo » (L3-T10) : photo et position du profil, rangée à part
      # parce que « lot3-notifications » (15 min sur iphone au run 42541548740) aurait dépassé 20 min ; « lot3-revenus »
      # (L3-T12) : onglet Revenus, domaine des tranches T12, T13, T14a et T14b ; L3-T13 y range DemoPaiementsTests
      # (paiements déclarés, quatre tests), L3-T14b DemoIbanTests (coordonnées bancaires, deux tests), puis L3-T14a
      # DemoStripeTests (Stripe Connect, deux tests), sans nouvel éclat (onze au plus). Lot 5 (revue B8 de #1147, m5) : le socle
      # mesurait 14 / 17 / 22 min au run 44204757942 ; ses dix XCUITest établissement (1 à 2 min chacun) l'auraient porté
      # au-delà de 30 min en iPad paysage. Plafond de onze éclats atteint : DemoEtabSessionTests (5) rejoint
      # « lot3-profil-photo » (7 / 7 / 12 min) et DemoEtabLiensTests (5) rejoint « presences » (8 / 11 / 11 min), chacun
      # estimé sous 20 min (décision 22), plutôt que les dix dans un seul éclat.
      # Lot 5, T4 : DemoEtabAccueilTests (3, Accueil établissement) rejoint « lot3-profil-photo », même éclat léger que la
      # session établissement (environ 1 à 2 min par test : l'éclat reste sous 20 min), sans douzième éclat.
      # Lot 1 (intégration de la vague B, 18/11/2026) : ses XCUITest tournent dans le job `ui-lot1`, jamais dans le socle.
      # Le socle mesurait 14,6 / 17,3 / 22,4 min (iphone / ipad-portrait / ipad-landscape) au run 44204757942, dont
      # DemoAccueilTests (3,5 / 3,5 / 5,0 min) et DemoExplorerTests (5,8 / 8,5 / 9,6 min) : sans eux, environ 5 / 5 / 8 min
      # mesurées, plus DemoContestationTests (lot 2, T5b, une seule méthode), sous 20 min. DemoFavorisTests sort de
      # « presences » pour le même job. Lot 4 (L4-T4, 18/11/2026) : ses XCUITest tournent dans l'éclat « lot4 » du job
      # `ui-lot1`, jamais dans le socle. Garde : tests/node/ios-swift-ci-eclats.node.mjs.
      # Stabilité de la CI (23/11/2026) : trois exécutions complètes depuis #1168 (runs 44475153698, 44555091967 et
      # 44797977486 ; iphone / ipad-portrait / ipad-landscape). « presences » y a pris 21, 20, 15 / 27, 29, 15 / 28, 28 min
      # puis 30 min (délai atteint au troisième run, ses dix-sept tests réussis en 28,7 min) ; « lot3-notifications »
      # 29,9, 19 min puis un gel / 17, 23, 23 / 27, 24, 24 min. Les trois classes établissement de « presences »
      # (DemoEtabLiensTests, DemoEtabMissionsTests, DemoEtabCandidaturesTests : 6,2 à 13,3 min de tests) et DemoProfilTests
      # (7,3 à 13,9 min) sortent vers le job `ui-lot1`, éclats « lot5-etablissement » et « lot3-profil » : « presences »
      # garde 6,1 à 15,5 min de tests et « lot3-notifications » 8,7 à 14,7 min, sous les 20 min de la décision 22, sans
      # douzième éclat ici. Aucun test retiré : chaque classe tourne toujours une fois par format.
      - name: test-without-building — éclat socle (JoleneCoreTests, JoleneDesignTests, XCUITest hors éclat — lot 0, compte, contestation) (${{ matrix.format }})
        id: tests
        # Même condition que les dix autres éclats (revue B8 de la vague 5, m1) : une dérive du Package.resolved (étape
        # précédente) ne masque plus JoleneCoreTests, JoleneDesignTests ni les XCUITest des lots 0 et 1.
        if: always() && steps.build.outcome == 'success'
        # Délai propre à l'étape : un simulateur ou un runner xctest bloqué est interrompu ici,
        # pas par le timeout du job, et le xcresult est clos avant le résumé.
        timeout-minutes: 30
        env:
          UDID: ${{ steps.simulateur.outputs.udid }}
          # Variables lues par le runner XCUITest via ProcessInfo (préfixe TEST_RUNNER_ retiré par xcodebuild).
          TEST_RUNNER_JOLENE_UI_ORIENTATION: ${{ matrix.orientation }}
          TEST_RUNNER_JOLENE_UI_FORMAT: ${{ matrix.format }}
          TEST_RUNNER_JOLENE_MODE: demo
        run: |
          resultat="$RUNNER_TEMP/ui-$JOLENE_UI_FORMAT-socle.xcresult"
          set +e
          # Veilleur du gel (scripts/mobile/ios-ci-gel-simulateur.sh), comme dans les éclats presences et pointage : depuis
          # le 24/11/2026, le socle exécute DemoPointageQRTests, dont un test saisit au pavé numérique (déclencheur des gels
          # relevés ; DECISIONS_LOT2, « Gel iPhone CI — 16/11/2026 »). Relevés gel-socle-* dans l'artefact ; le veilleur
          # ne fait jamais échouer l'étape.
          journal="$JOLENE_UI_OUTPUT/test-without-building-socle.log"
          bash scripts/mobile/ios-ci-gel-simulateur.sh veiller socle "$journal" > "$JOLENE_UI_OUTPUT/gel-socle-veilleur.log" 2>&1 &
          veilleur=$!
          xcodebuild test-without-building \
            -project ios-native/Jolene.xcodeproj \
            -scheme Jolene \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cloned" \
            -only-testing:JoleneUITests \
            -only-testing:JoleneCoreTests \
            -only-testing:JoleneDesignTests \
            -skip-testing:JoleneUITests/StagingConnexionTests \
