          echo "xcodebuild test-without-building (éclat lot3-inscription) : code $code"
      - name: Résumé xcresult (assertions, pas de succès fabriqué)
        if: always() && steps.build.outcome == 'success'
        env:
          CODE_SOCLE: ${{ steps.tests.outputs.code }}
          CODE_LOT3_COMPTE: ${{ steps.tests_lot3_compte.outputs.code }}
          CODE_LOT3_PUSH: ${{ steps.tests_lot3_push.outputs.code }}
          CODE_LOT3_NOTIFICATIONS: ${{ steps.tests_lot3_notifications.outputs.code }}
          CODE_LOT3_INSCRIPTION: ${{ steps.tests_lot3_inscription.outputs.code }}
        run: |
          mkdir -p "$JOLENE_UI_OUTPUT/attachments"
          for eclat in socle lot3-compte lot3-push lot3-notifications lot3-inscription; do
            xcresult="$RUNNER_TEMP/ui-$JOLENE_UI_FORMAT-$eclat.xcresult"
            [ -d "$xcresult" ] || { echo "::error::Bundle xcresult absent pour l'éclat $eclat : aucun test n'a produit de résultat."; exit 1; }
            xcrun xcresulttool get test-results summary --path "$xcresult" > "$JOLENE_UI_OUTPUT/xctest-summary-$eclat.json"
            xcrun xcresulttool export attachments --path "$xcresult" --output-path "$JOLENE_UI_OUTPUT/attachments/$eclat" || echo "Aucune pièce jointe exportable ($eclat)."
          done
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync, readdirSync, existsSync, writeFileSync, appendFileSync } from "node:fs";
            import { join } from "node:path";
            import { readPngDimensions } from "./mobile-native/scripts/png-dimensions.mjs";
            const out = process.env.JOLENE_UI_OUTPUT;
            // Éclats : chacun doit être vert et avoir exécuté au moins un test ; les classes des éclats de lot doivent
            // toutes avoir démarré (un -only-testing mal nommé n exécute rien).
            const eclats = [
              { nom: "socle", code: process.env.CODE_SOCLE, classes: [] },
              { nom: "lot3-compte", code: process.env.CODE_LOT3_COMPTE, classes: ["DemoLiensLot3Tests", "DemoInscriptionTests", "DemoCompteLot3Tests"] },
              { nom: "lot3-push", code: process.env.CODE_LOT3_PUSH, classes: ["DemoPushTests"] },
              { nom: "lot3-notifications", code: process.env.CODE_LOT3_NOTIFICATIONS, classes: ["DemoNotificationsTests", "DemoPreferencesTests", "DemoProfilTests"] },
              { nom: "lot3-inscription", code: process.env.CODE_LOT3_INSCRIPTION, classes: ["DemoCompletionInscriptionTests"] },
            ];
            let total = 0, passed = 0, failed = 0, skipped = 0, log = "";
            const lignes = [`### UI — ${process.env.JOLENE_UI_FORMAT}`, ""];
            const bundles = [];
            const eclatsKo = [];
            for (const e of eclats) {
              const s = JSON.parse(readFileSync(join(out, `xctest-summary-${e.nom}.json`), "utf8"));
              const t = s.totalTestCount ?? 0, p = s.passedTests ?? 0, f = s.failedTests ?? 0, k = s.skippedTests ?? 0;
              total += t; passed += p; failed += f; skipped += k;
              bundles.push(...(s.testTargets ?? s.testPlanConfigurations ?? []).map(x => x.name ?? x.testTargetName ?? "").filter(Boolean));
              const journal = readFileSync(join(out, `test-without-building-${e.nom}.log`), "utf8");
              log += journal;
              const absentes = e.classes.filter(c => !new RegExp(`Test Suite \x27${c}\x27 started`).test(journal));
              lignes.push(`- éclat ${e.nom} : xcodebuild code ${e.code || "absent"}, xcresult ${s.result} (${p} réussis, ${f} échoués, ${k} ignorés, ${t} au total)`);
              if (absentes.length) lignes.push(`- éclat ${e.nom} : classes jamais démarrées : ${absentes.join(", ")}`);
              if (!(e.code === "0" && s.result === "Passed" && t >= 1 && f === 0 && k === 0 && p === t && absentes.length === 0)) eclatsKo.push(e.nom);
            }
            lignes.push(`- résultat xcresult : ${eclatsKo.length ? "Failed" : "Passed"} (${passed} réussis, ${failed} échoués, ${skipped} ignorés, ${total} au total, éclats ${eclats.map(e => e.nom).join(" + ")})`,
              `- cibles exécutées sur le simulateur (destination ${process.env.JOLENE_UI_FORMAT}) : JoleneUITests (hors StagingConnexionTests), JoleneCoreTests, JoleneDesignTests`);
            // Chaque cible doit avoir tourné : un plan qui en oublie une n est pas une preuve.
            const attendus = ["JoleneUITests", "JoleneCoreTests", "JoleneDesignTests"];
            const manquantes = attendus.filter(cible => !bundles.includes(cible) && !new RegExp(`Test Suite \x27${cible}[^\x27]*\x27 (started|passed)`).test(log));
            if (manquantes.length) lignes.push(`- cibles sans aucun test exécuté : ${manquantes.join(", ")}`);
            // Contrôle d orientation des captures (mobile-native/scripts/png-dimensions.mjs repris tel quel).
            const attendu = process.env.JOLENE_UI_ORIENTATION;
            const mauvaises = [];
            const captures = [];
            for (const e of eclats) {
              const dossier = join(out, "attachments", e.nom);
              const pngs = existsSync(dossier) ? readdirSync(dossier).filter(n => n.toLowerCase().endsWith(".png")) : [];
              for (const name of pngs) {
                const { width, height } = readPngDimensions(readFileSync(join(dossier, name)));
                const portrait = width < height;
                if ((attendu === "portrait") !== portrait) mauvaises.push(`${e.nom}/${name} ${width}x${height}`);
                captures.push({ name: `${e.nom}/${name}`, width, height });
              }
            }
            writeFileSync(join(out, "orientation.json"), JSON.stringify({ requested: attendu, captures, mauvaises }, null, 2));
            lignes.push(`- captures PNG : ${captures.length} (orientation attendue ${attendu}${captures.length ? "" : " — aucune capture exportée : l orientation n est PAS prouvée par ce run"})`);
            if (mauvaises.length) lignes.push(`- captures dans la mauvaise orientation : ${mauvaises.join(", ")}`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lignes.join("\n") + "\n");
            console.log(lignes.join("\n"));
            // JoleneCoreTests seul dépasse 100 tests : un total inférieur signifie qu une cible n a pas tourné.
            const ok = eclatsKo.length === 0 && total >= 100 && failed === 0 && skipped === 0 && passed === total && mauvaises.length === 0 && manquantes.length === 0;
            if (!ok) { console.error("::error::Tests simulateur non concluants (JoleneUITests, JoleneCoreTests, JoleneDesignTests) : voir le résumé ci-dessus et l artefact xcresult."); process.exit(1); }
          '
      - name: Durée de build dans le résumé (mesure porte go/no-go)
        if: always() && steps.build.outcome == 'success'
        env:
          DUREE: ${{ steps.build.outputs.duree_build_s }}
        run: |
          echo "- durée build-for-testing : ${DUREE}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Attentes bloquées absorbées (relevé, n’échoue pas le job)
        if: always() && steps.build.outcome == 'success'
        # `require` (ios-native/JoleneUITests/UITestSupport.swift) joint `<préfixe>-attente-bloquee-
        # <fichier>-<ligne>.txt` à chaque attente qui a mesuré du temps non décompté, réussie ou non.
        # Un dépassement du budget de blocage fait déjà échouer le test ; les blocages ABSORBÉS sous
        # le budget, eux, ne doivent pas passer inaperçus dans un job vert : ils sont relevés depuis
        # le manifest.json de `xcresulttool export attachments` (étape « Résumé xcresult »), en
        # section du résumé et en annotation sur la ligne de l’appelant (GitHub n’affiche que les
        # 10 premières annotations d’une étape ; le tableau du résumé les liste toutes). Relevé
        # d’information seulement : il ne décide jamais du statut du job (continue-on-error).
        continue-on-error: true
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync, existsSync, appendFileSync } from "node:fs";
            import { join } from "node:path";
            const format = process.env.JOLENE_UI_FORMAT;
            const attachments = join(process.env.JOLENE_UI_OUTPUT, "attachments");
            const manifeste = join(attachments, "manifest.json");
            // Échappements des commandes de workflow GitHub (message, puis propriétés) et des cellules Markdown.
            const esc = v => String(v).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            const prop = v => esc(v).replace(/:/g, "%3A").replace(/,/g, "%2C");
            const cell = v => String(v).replace(/\|/g, "\\|").replace(/\s+/g, " ");
            const lignes = ["", `#### Attentes bloquées absorbées — ${format}`, ""];
            let tests = null;
            try { tests = JSON.parse(readFileSync(manifeste, "utf8")); } catch { tests = null; }
            if (!Array.isArray(tests)) {
              lignes.push(`- ${existsSync(manifeste) ? "manifest.json illisible" : "aucun manifest.json exporté"} : attentes bloquées NON relevées par ce run`);
              console.log(`::warning::Attentes bloquées non relevées (${format}) : manifest.json des pièces jointes absent ou illisible.`);
            } else {
              const bloquees = [];
              for (const t of tests) for (const a of t.attachments ?? []) {
                const nom = a.suggestedHumanReadableName ?? "";
                if (!nom.includes("-attente-bloquee-")) continue;
                let texte = "";
                try { texte = readFileSync(join(attachments, a.exportedFileName ?? ""), "utf8"); } catch { texte = ""; }
                const champ = libelle => texte.match(new RegExp(`^${libelle} : (.+)$`, "m"))?.[1].trim();
                // Appelant : ligne « Appelant : Fichier.swift:N » du rapport, à défaut le nom de la pièce
                // jointe (`<préfixe>-attente-bloquee-<Fichier>-<N>_<rang>_<UUID>.txt` une fois exportée).
                const parRapport = (champ("Appelant") ?? "").match(/^(.+\.swift):(\d+)$/);
                const parNom = nom.match(/-attente-bloquee-(.+)-(\d+)(?:_\d+_[0-9A-Fa-f-]+)?\.txt$/);
                bloquees.push({
                  test: t.testIdentifier ?? "?",
                  fichier: parRapport?.[1] ?? (parNom ? `${parNom[1]}.swift` : null),
                  ligne: parRapport?.[2] ?? parNom?.[2] ?? null,
                  attente: champ("Attente") ?? "?",
                  nonDecompte: (champ("Temps non décompté") ?? "").match(/^\d+(?:[,.]\d+)? s/)?.[0] ?? "?",
                  budget: champ("Budget de blocage") ?? "?",
                  issue: champ("Issue") ?? "?",
                });
              }
              if (!bloquees.length) {
                lignes.push("- aucune : aucun `require` n’a mesuré de temps non décompté");
              } else {
                lignes.push(`${bloquees.length} attente(s) ont mesuré du temps non décompté (blocage de l’observateur ou du thread principal de l’app). Relevé d’information : le job n’échoue pas pour cela.`, "",
                  "| Test | Appelant | Attente | Non décompté | Budget de blocage | Issue |", "| --- | --- | --- | --- | --- | --- |");
                for (const b of bloquees) {
                  const appelant = b.fichier ? `${b.fichier}:${b.ligne}` : "?";
                  lignes.push(`| ${cell(b.test)} | \`${cell(appelant)}\` | ${cell(b.attente)} | ${cell(b.nonDecompte)} | ${cell(b.budget)} | ${cell(b.issue)} |`);
                  const message = `Attente bloquée absorbée (${format}) : « ${b.attente} », ${b.nonDecompte} non décomptées (budget de blocage ${b.budget}), ${b.issue} — ${b.test}`;
                  const cible = b.fichier && b.ligne ? ` file=${prop(`ios-native/JoleneUITests/${b.fichier}`)},line=${prop(b.ligne)}` : "";
                  console.log(`::warning${cible}::${esc(message)}`);
                }
              }
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lignes.join("\n") + "\n");
            console.log(lignes.join("\n"));
          '
      - name: Conserver xcresult, captures et journaux
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-swift-ui-${{ matrix.format }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ui-${{ matrix.format }}-socle.xcresult
            ${{ runner.temp }}/ui-${{ matrix.format }}-lot3-compte.xcresult
            ${{ runner.temp }}/ui-${{ matrix.format }}-lot3-push.xcresult
            ${{ runner.temp }}/ui-${{ matrix.format }}-lot3-notifications.xcresult
            ${{ runner.temp }}/ui-${{ matrix.format }}-lot3-inscription.xcresult
            ios-native/test-results/${{ matrix.format }}/
          retention-days: 7
          if-no-files-found: warn
      - name: Éteindre le simulateur
        if: always()
        run: xcrun simctl shutdown all || true
