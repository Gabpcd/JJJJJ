      - name: test-without-building — éclat lot3-inscription (XCUITest complétion du profil) (${{ matrix.format }})
        id: tests_lot3_inscription
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          UDID: ${{ steps.simulateur.outputs.udid }}
          TEST_RUNNER_JOLENE_UI_ORIENTATION: ${{ matrix.orientation }}
          TEST_RUNNER_JOLENE_UI_FORMAT: ${{ matrix.format }}
          TEST_RUNNER_JOLENE_MODE: demo
        run: |
          resultat="$RUNNER_TEMP/ui-$JOLENE_UI_FORMAT-lot3-inscription.xcresult"
          set +e
          xcodebuild test-without-building \
            -project ios-native/Jolene.xcodeproj \
