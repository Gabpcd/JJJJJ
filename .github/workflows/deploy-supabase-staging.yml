name: Deploy Supabase STAGING (migrations + edge functions)

# Déploie le schéma + edge functions sur le projet STAGING (jolene-staging,
# project_ref mejpriaetwgtcstbgfid). Trigger MANUEL uniquement (workflow_dispatch)
# pour éviter de toucher staging à chaque push main (ça reste isolé pour les
# tests de charge k6).
#
# Prérequis (secrets GitHub repo) :
# - STAGING_SUPABASE_ACCESS_TOKEN : dashboard Supabase → Account → Access Tokens
# - STAGING_SUPABASE_PROJECT_REF  : mejpriaetwgtcstbgfid
# - STAGING_SUPABASE_DB_PASSWORD  : Project Settings → Database → Connection String
#
# Usage : Actions → "Deploy Supabase STAGING" → Run workflow.
# Voir docs/staging.md pour la procédure complète.

on:
  workflow_dispatch:
    inputs:
      skip_functions:
        description: "Skip edge functions deploy (migrations seulement)"
        type: boolean
        required: false
        default: false
      seed_load_test_data:
        description: "Seeder les 500 missions terminées pour scenario F (cron)"
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: deploy-supabase-staging
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Apply SQL migrations (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show CLI version (debug)
        run: supabase --version

      - name: Link to staging Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Heal schema_migrations drift (orphan remote versions)
        # Identique au workflow prod : nettoie les orphelins remote pour que
        # `db push` ne plante pas. Pour un staging vierge, ce step ne fera rien.
        # Pour un staging déjà bootstrappé qui a divergé, il rejoue la même
        # logique de heal (best-effort).
        continue-on-error: true
        run: |
          set -euo pipefail

          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"
          AUTH="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"

          REMOTE_JSON=$(curl -sf -X POST "$API" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT version FROM supabase_migrations.schema_migrations ORDER BY version"}' || echo '[]')

          echo "$REMOTE_JSON" | jq -r '.[].version' > /tmp/remote_versions.txt 2>/dev/null || true

          ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -n1 basename \
            | awk -F_ '{print $1}' \
            | sort -u > /tmp/local_versions.txt

          sort -u /tmp/remote_versions.txt -o /tmp/remote_versions.txt 2>/dev/null || true

          echo "Remote versions: $(wc -l < /tmp/remote_versions.txt 2>/dev/null || echo 0)"
          echo "Local versions:  $(wc -l < /tmp/local_versions.txt)"

          comm -23 /tmp/remote_versions.txt /tmp/local_versions.txt > /tmp/orphans.txt 2>/dev/null || touch /tmp/orphans.txt

          ORPHAN_COUNT=$(wc -l < /tmp/orphans.txt)
          if [ "$ORPHAN_COUNT" -gt 0 ]; then
            echo "::warning::Found $ORPHAN_COUNT orphan remote migrations — removing from schema_migrations"
            cat /tmp/orphans.txt
            VERSIONS=$(awk 'BEGIN{q=sprintf("%c",39)} {printf "%s%s%s%s", (NR==1?"":","), q, $1, q}' /tmp/orphans.txt)
            DELETE_QUERY="{\"query\":\"DELETE FROM supabase_migrations.schema_migrations WHERE version IN ($VERSIONS)\"}"
            curl -sf -X POST "$API" \
              -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d "$DELETE_QUERY"
          else
            echo "Schema_migrations en sync avec le repo (ou staging vierge)."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Push pending migrations
        # Sur un staging vierge, applique les 333 migrations d'un coup.
        # Sur un staging déjà à jour, no-op.
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Seed load test data (optional)
        if: ${{ inputs.seed_load_test_data }}
        # Seeder 500 missions TERMINEE pour le scenario F (cron weekly invoicing).
        # Idempotent : DELETE WHERE intitule LIKE '[loadtest]%' avant INSERT.
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"
          AUTH="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"
          SQL=$(cat tests/load/seed/seed-staging.sql | jq -Rs .)
          curl -sf -X POST "$API" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"query\":${SQL}}"
          echo "Load test seed appliqué (500 missions [loadtest])."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

  deploy-functions:
    name: Deploy edge functions (staging)
    if: ${{ !inputs.skip_functions }}
    runs-on: ubuntu-latest
    needs: deploy-migrations
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function from supabase/functions
        run: |
          set -euo pipefail
          cd supabase/functions
          for dir in */; do
            fn="${dir%/}"
            if [ -f "$fn/index.ts" ]; then
              echo "::group::Deploying $fn (staging)"
              supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --use-api
              echo "::endgroup::"
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Summary
        run: |
          echo "### Deploy Supabase STAGING ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations SQL appliquées" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.seed_load_test_data }}" = "true" ]; then
            echo "- 500 missions [loadtest] seedées (scenario F)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ inputs.skip_functions }}" != "true" ]; then
            echo "- Edge functions déployées" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Projet staging : \`${{ secrets.STAGING_SUPABASE_PROJECT_REF }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Prochaine étape : lancer le workflow \"Load tests (k6)\"." >> "$GITHUB_STEP_SUMMARY"
