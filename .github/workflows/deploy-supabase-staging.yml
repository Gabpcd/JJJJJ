name: Deploy Supabase STAGING (bootstrap from prod schema dump)

# Bootstrap le projet STAGING (jolene-staging, mejpriaetwgtcstbgfid) à partir
# d'un dump du schéma prod. Les migrations Lovable historiques (depuis mars
# 2026) supposent un état DB déjà créé hors-CLI (dashboard Lovable), donc
# `supabase db push` from-scratch échoue avec "relation public.missions does
# not exist" sur la 1re migration (20260311115120_*).
#
# Stratégie :
#   1. Dump du schéma prod via `supabase db dump` (schéma seul, pas de data).
#   2. Dump des données de `supabase_migrations.schema_migrations` (tracking).
#   3. Reset borné de public/private, puis apply sur staging via `psql`.
#   4. Réconciliation des dépendances auth/storage/realtime/crons hors dump.
#   5. Re-exécution de la migration `20260503050000_playwright_seed_test_accounts.sql`
#      pour seeder les comptes test (auth schema exclu du dump par défaut).
#   6. Optionnel : seed 500 missions [loadtest] pour scenario F.
#
# Trigger MANUEL uniquement (workflow_dispatch).
#
# Prérequis (secrets GitHub) :
# - PROD (lecture pour dump) :
#   * SUPABASE_ACCESS_TOKEN
#   * SUPABASE_PROJECT_REF       (flripxtsyegjshnhzjkz)
#   * SUPABASE_DB_PASSWORD
# - STAGING (écriture) :
#   * STAGING_SUPABASE_ACCESS_TOKEN
#   * STAGING_SUPABASE_PROJECT_REF (mejpriaetwgtcstbgfid)
#   * STAGING_SUPABASE_DB_PASSWORD
#
# Voir docs/staging.md pour la procédure complète.

on:
  workflow_dispatch:
    inputs:
      reset_first:
        description: "Reset staging public + private et crons avant bootstrap (DESTRUCTIF, staging uniquement)"
        type: boolean
        required: false
        default: false
      seed_load_test_data:
        description: "Seeder les 500 missions [loadtest] pour scenario F (cron)"
        type: boolean
        required: false
        default: false
      skip_functions:
        description: "Skip edge functions deploy (migrations + dump seulement)"
        type: boolean
        required: false
        default: false
      export_frontend_config_only:
        description: "Exporter uniquement la configuration frontend publique du staging"
        type: boolean
        required: false
        default: false
      repair_test_profiles_only:
        description: "Réparer uniquement les trois profils E2E staging, sans reset"
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RETIRED_EDGE_FUNCTIONS: 'admin-2fa'

concurrency:
  # Partagé avec le job SQL des PR : une seule écriture à la fois sur le
  # projet staging, même lorsque les opérations viennent de workflows distincts.
  group: jolene-supabase-staging-writes
  cancel-in-progress: false

jobs:
  export-frontend-config:
    name: Export staging frontend public config
    if: ${{ inputs.export_frontend_config_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Export publishable configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$STAGING_REF" = 'mejpriaetwgtcstbgfid'
          project_status() {
            curl -fsS \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${STAGING_REF}" \
              | jq -r '.status // "UNKNOWN"'
          }
          STATUS="$(project_status)"
          if [ "$STATUS" != 'ACTIVE_HEALTHY' ]; then
            echo "Staging indisponible ($STATUS) : reprise demandée."
            RESTORE_STATUS="$(curl -sS -o /tmp/staging-restore.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${STAGING_REF}/restore")"
            if [ "$RESTORE_STATUS" -lt 200 ] || [ "$RESTORE_STATUS" -ge 300 ]; then
              jq -r '.message // .error // "Reprise du staging refusée"' /tmp/staging-restore.json
              exit 1
            fi
            for attempt in $(seq 1 40); do
              STATUS="$(project_status)"
              [ "$STATUS" = 'ACTIVE_HEALTHY' ] && break
              echo "Reprise staging en cours ($attempt/40, statut $STATUS)."
              sleep 15
            done
            test "$STATUS" = 'ACTIVE_HEALTHY'
          fi
          curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${STAGING_REF}/api-keys?reveal=true" \
            > /tmp/staging-api-keys.json
          PUBLIC_KEY="$(jq -r '.[] | select(.type == "publishable") | .api_key' /tmp/staging-api-keys.json | head -n 1)"
          if [ -z "$PUBLIC_KEY" ]; then
            CREATE_STATUS="$(curl -sS -o /tmp/staging-created-api-key.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.supabase.com/v1/projects/${STAGING_REF}/api-keys?reveal=true" \
              --data '{"type":"publishable","name":"default","description":"Frontend mobile de recette automatisée"}')"
            if [ "$CREATE_STATUS" -lt 200 ] || [ "$CREATE_STATUS" -ge 300 ]; then
              jq -r '.message // .error // "Création de clé publishable refusée"' /tmp/staging-created-api-key.json
              exit 1
            fi
            PUBLIC_KEY="$(jq -er '.api_key | select(type == "string" and length > 20)' /tmp/staging-created-api-key.json)"
          fi
          test "${#PUBLIC_KEY}" -gt 20
          jq -e -n \
            --arg url "https://${STAGING_REF}.supabase.co" \
            --arg key "$PUBLIC_KEY" \
            '{VITE_SUPABASE_URL: $url, VITE_SUPABASE_PUBLISHABLE_KEY: $key}' \
            > /tmp/jolene-staging-frontend.json

      - name: Upload public frontend configuration
        uses: actions/upload-artifact@v4
        with:
          name: jolene-staging-frontend-config
          path: /tmp/jolene-staging-frontend.json
          retention-days: 1

  repair-test-profiles:
    name: Repair staging E2E profiles without reset
    if: ${{ inputs.repair_test_profiles_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install postgresql-client
        run: |
          set -e
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Build staging-only DB URL
        id: staging-url
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$STAGING_REF" = 'mejpriaetwgtcstbgfid'
          test "$STAGING_REF" != 'flripxtsyegjshnhzjkz'
          projects_json="$(supabase projects list --output json)"
          REGION="$(jq -er --arg ref "$STAGING_REF" '
            .[] | select(.id == $ref) | .region
            | select(type == "string" and test("^[a-z0-9-]+$"))
          ' <<<"$projects_json")"
          ENCODED_PWD=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['STAGING_DB_PASSWORD'], safe=''))")
          URL="postgres://postgres.${STAGING_REF}:${ENCODED_PWD}@aws-0-${REGION}.pooler.supabase.com:5432/postgres?sslmode=require"
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Repair fixed test profiles and founder access
        run: |
          set -euo pipefail
          URL="${{ steps.staging-url.outputs.url }}"
          psql "$URL" -v ON_ERROR_STOP=1 \
            -f db/migrations_archive/20260503050000_playwright_seed_test_accounts.sql
          psql "$URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $repair_etablissement$
          DECLARE
            v_etab_id uuid;
          BEGIN
            SELECT id INTO v_etab_id
              FROM auth.users
             WHERE email = 'playwright-etab@jolene.app'
               AND deleted_at IS NULL;
            IF v_etab_id IS NULL THEN
              RAISE EXCEPTION 'Compte playwright-etab absent du staging';
            END IF;

            UPDATE public.etablissements
               SET siret = '90000000000001',
                   contrat_service_signe = true,
                   contrat_service_signe_le = COALESCE(contrat_service_signe_le, now()),
                   siret_verifie = true,
                   siret_verifie_le = COALESCE(siret_verifie_le, now()),
                   finess_verifie = true,
                   finess_verifie_le = COALESCE(finess_verifie_le, now()),
                   statut_verification = 'VERIFIE',
                   peut_publier_missions = true,
                   representant_identite_verifiee = true,
                   representant_identite_verifiee_le = COALESCE(representant_identite_verifiee_le, now()),
                   rattachement_methode = 'ADMIN',
                   rattachement_verifie = true,
                   rattachement_verifie_le = COALESCE(rattachement_verifie_le, now()),
                   email_contact_verifie = true,
                   email_contact_verifie_le = COALESCE(email_contact_verifie_le, now()),
                   onboarding_termine_le = COALESCE(onboarding_termine_le, now()),
                   mode_paiement_commission = 'FACTURE_MENSUELLE',
                   stripe_customer_id = NULL,
                   stripe_sepa_payment_method_id = NULL,
                   est_compte_test = true,
                   supprime_le = NULL
             WHERE id = v_etab_id
               AND est_compte_test IS TRUE;

            INSERT INTO public.membres_etablissement (
              etablissement_id, user_id, role, actif, accepte_le
            ) VALUES (
              v_etab_id, v_etab_id, 'PROPRIETAIRE', true, now()
            )
            ON CONFLICT (etablissement_id, user_id) DO UPDATE
               SET role = 'PROPRIETAIRE',
                   actif = true,
                   accepte_le = COALESCE(public.membres_etablissement.accepte_le, now());
          END
          $repair_etablissement$;

          DO $repair_admin$
          DECLARE
            v_admin_id uuid;
          BEGIN
            SELECT id INTO v_admin_id
              FROM auth.users
             WHERE lower(COALESCE(email, '')) = 'admin@jolene.app'
               AND deleted_at IS NULL
             FOR UPDATE;
            IF v_admin_id IS NULL THEN
              RAISE EXCEPTION 'Compte admin@jolene.app absent du staging';
            END IF;

            UPDATE auth.users
               SET raw_app_meta_data = COALESCE(raw_app_meta_data, '{}'::jsonb)
                 || jsonb_build_object('role', 'ADMIN_PLATEFORME'),
                   email_confirmed_at = COALESCE(email_confirmed_at, now()),
                   updated_at = now()
             WHERE id = v_admin_id;

            INSERT INTO public.equipe_admin (
              user_id, nom, prenom, email, poste, acces_groupes, actif
            ) VALUES (
              v_admin_id,
              'Test',
              'Admin',
              'admin@jolene.app',
              'Fondatrice — staging E2E',
              ARRAY[
                'Dashboard',
                'Utilisateurs',
                'Missions',
                'Litiges & contrats',
                'Finances',
                'Messagerie',
                'Conformité & Technique',
                'Fondateur'
              ]::text[],
              true
            )
            ON CONFLICT (user_id) DO UPDATE
               SET acces_groupes = EXCLUDED.acces_groupes,
                   actif = true,
                   maj_le = now();

            DELETE FROM auth.mfa_factors WHERE user_id = v_admin_id;
          END
          $repair_admin$;
          SQL

      - name: Verify repaired profiles
        run: |
          set -euo pipefail
          URL="${{ steps.staging-url.outputs.url }}"
          READY="$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM public.soignants s JOIN auth.users u ON u.id = s.id
                WHERE u.email = 'playwright-soignant@jolene.app' AND s.est_compte_test IS TRUE),
              (SELECT count(*) FROM public.etablissements e JOIN auth.users u ON u.id = e.id
                WHERE u.email = 'playwright-etab@jolene.app'
                  AND e.est_compte_test IS TRUE
                  AND e.statut_verification = 'VERIFIE'
                  AND e.peut_publier_missions IS TRUE),
              (SELECT count(*) FROM public.equipe_admin ea JOIN auth.users u ON u.id = ea.user_id
                WHERE u.email = 'admin@jolene.app' AND ea.actif IS TRUE
                  AND cardinality(ea.acces_groupes) >= 8);
          ")"
          echo "État profils E2E : $READY"
          test "$READY" = '1|1|1'
          echo "Trois profils E2E staging prêts, sans reset."

  bootstrap-staging:
    name: Bootstrap staging from prod schema dump
    if: ${{ !inputs.export_frontend_config_only && !inputs.repair_test_profiles_only }}
    runs-on: ubuntu-latest
    # Le dump prod contient ~75 000 lignes / plusieurs milliers d'objets.
    # Son application via le Session Pooler IPv4 dépasse à elle seule 15 min.
    # Garder une marge bornée pour les assertions et les migrations suivantes.
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install postgresql-client
        run: |
          set -e
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Show CLI version
        run: supabase --version

      - name: Refuser toute confusion PROD / STAGING
        run: |
          set -euo pipefail
          if [ "$PROD_REF" != 'flripxtsyegjshnhzjkz' ]; then
            echo "::error::SUPABASE_PROJECT_REF ne désigne pas la production Jolene attendue."
            exit 1
          fi
          if [ "$STAGING_REF" != 'mejpriaetwgtcstbgfid' ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF ne désigne pas le staging Jolene attendu."
            exit 1
          fi
          if [ "$PROD_REF" = "$STAGING_REF" ]; then
            echo "::error::Production et staging ne peuvent jamais partager le même project ref."
            exit 1
          fi
          if [ "$RESET_FIRST" != 'true' ]; then
            echo "::error::Ce bootstrap exige la confirmation explicite reset_first=true."
            exit 1
          fi
        env:
          PROD_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          RESET_FIRST: ${{ inputs.reset_first }}

      # ─── 1. Dump du schéma prod ──────────────────────────────────────
      - name: Link to PROD
        run: supabase link --project-ref "$PROD_REF" --password "$PROD_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PROD_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Dump prod schema (public + custom)
        run: |
          set -e
          # Liste explicite : aucun schéma géré auth/storage/vault/cron n'est
          # exporté et aucun secret de production n'entre dans l'artefact.
          supabase db dump --linked --schema public,private -f /tmp/prod-schema.sql
          echo "Schema dump : $(wc -l < /tmp/prod-schema.sql) lignes, $(stat -c %s /tmp/prod-schema.sql) bytes"
          head -20 /tmp/prod-schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Export prod schema_migrations compatible avec le staging
        run: |
          set -euo pipefail
          # La table gérée peut évoluer à des rythmes différents entre deux
          # projets (par exemple `created_by`). Ces trois colonnes constituent
          # le contrat commun utilisé par `supabase db push`.
          supabase db query --linked --agent=no --output csv \
            "SELECT version, statements::text AS statements, name
               FROM supabase_migrations.schema_migrations
              ORDER BY version" \
            > /tmp/migrations-data.csv
          header="$(head -n 1 /tmp/migrations-data.csv | tr -d '\r')"
          if [ "$header" != 'version,statements,name' ]; then
            echo "::error::Export schema_migrations inattendu : $header"
            exit 1
          fi
          echo "Historique migrations exporté dans un CSV compatible."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Exporter l'inventaire SECURITY DEFINER de production
        run: |
          set -euo pipefail
          # Le dump est volontairement schema-only. Cet inventaire ne contient
          # aucun secret ni donnée métier, mais il doit précéder les migrations
          # locales qui ajoutent ou requalifient une fonction.
          supabase db query --linked --agent=no --output csv \
            "SELECT signature, categorie, definition_md5, justification, recense_le
               FROM private.security_definer_inventory
              ORDER BY signature" \
            > /tmp/security-definer-inventory.csv
          header="$(head -n 1 /tmp/security-definer-inventory.csv | tr -d '\r')"
          if [ "$header" != 'signature,categorie,definition_md5,justification,recense_le' ]; then
            echo "::error::Export de l'inventaire SECURITY DEFINER inattendu : $header"
            exit 1
          fi
          echo "Inventaire SECURITY DEFINER production exporté sans donnée sensible."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ─── 2. Apply sur staging ────────────────────────────────────────
      - name: Build staging DB URL
        id: staging-url
        run: |
          set -euo pipefail
          # Les runners GitHub sont IPv4-only tandis que la connexion directe
          # Supabase est IPv6. Le Session Pooler conserve une session Postgres
          # complète et supporte donc les DDL du bootstrap.
          ENCODED_PWD=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['STAGING_DB_PASSWORD'], safe=''))")
          REF="$STAGING_REF"
          if [ "$REF" != 'mejpriaetwgtcstbgfid' ] \
             || [ "$REF" = 'flripxtsyegjshnhzjkz' ]; then
            echo "::error::URL destructive refusée : project ref staging invalide."
            exit 1
          fi
          projects_json="$(supabase projects list --output json)"
          REGION="$(jq -er --arg ref "$REF" '
            .[] | select(.id == $ref) | .region
            | select(type == "string" and test("^[a-z0-9-]+$"))
          ' <<<"$projects_json")"
          URL="postgres://postgres.${REF}:${ENCODED_PWD}@aws-0-${REGION}.pooler.supabase.com:5432/postgres?sslmode=require"
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          psql "$URL" -v ON_ERROR_STOP=1 -c \
            "SELECT CASE WHEN current_database() = 'postgres' THEN 1 ELSE 0 END;" \
            >/dev/null
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Reset staging applicatif (optional, DESTRUCTIF)
        if: inputs.reset_first
        run: |
          set -euo pipefail
          echo "::warning::Reset strictement limité au staging : crons + private + public"
          psql "${{ steps.staging-url.outputs.url }}" -v ON_ERROR_STOP=1 <<'SQL'
          DO $desinscrire_crons$
          DECLARE
            v_job_id bigint;
          BEGIN
            IF to_regclass('cron.job') IS NOT NULL THEN
              FOR v_job_id IN EXECUTE 'SELECT jobid FROM cron.job'
              LOOP
                PERFORM cron.unschedule(v_job_id);
              END LOOP;
            END IF;
          END
          $desinscrire_crons$;

          DROP SCHEMA IF EXISTS private CASCADE;
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;
          GRANT ALL ON SCHEMA public TO postgres, service_role;

          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            REVOKE ALL ON TABLES FROM anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            REVOKE ALL ON SEQUENCES FROM anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            REVOKE ALL ON FUNCTIONS FROM anon, authenticated;

          -- Supabase gère ce schéma : on conserve sa structure et on ne purge
          -- que les versions staging avant d'importer l'historique prod.
          TRUNCATE TABLE supabase_migrations.schema_migrations;
          SQL

      - name: Apply prod schema dump on staging
        run: |
          set -euo pipefail
          # Une transaction unique garantit un rollback complet au premier
          # échec ou si GitHub interrompt le job.
          psql "${{ steps.staging-url.outputs.url }}" \
            --single-transaction \
            -v ON_ERROR_STOP=1 \
            -f /tmp/prod-schema.sql

      - name: Apply schema_migrations tracking data
        run: |
          set -euo pipefail
          # Importer uniquement les colonnes communes évite de dépendre des
          # colonnes gérées ajoutées progressivement par Supabase.
          psql "${{ steps.staging-url.outputs.url }}" \
            --single-transaction \
            -v ON_ERROR_STOP=1 \
            -c "TRUNCATE TABLE supabase_migrations.schema_migrations;" \
            -c "\\copy supabase_migrations.schema_migrations(version, statements, name) FROM '/tmp/migrations-data.csv' WITH (FORMAT csv, HEADER true)"

      - name: Restaurer l'inventaire SECURITY DEFINER avant les migrations locales
        run: |
          set -euo pipefail
          psql "${{ steps.staging-url.outputs.url }}" \
            --single-transaction \
            -v ON_ERROR_STOP=1 \
            -c "TRUNCATE TABLE private.security_definer_inventory;" \
            -c "\\copy private.security_definer_inventory(signature, categorie, definition_md5, justification, recense_le) FROM '/tmp/security-definer-inventory.csv' WITH (FORMAT csv, HEADER true)"

      # Le dump représente la prod au début du run. Il faut ensuite appliquer
      # les migrations locales plus récentes, sinon staging testerait les
      # nouvelles Edge Functions contre l'ancien schéma de production.
      - name: Link to STAGING and push pending local migrations
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$STAGING_REF" \
            --password "$STAGING_DB_PASSWORD"
          supabase db push \
            --include-all \
            --password "$STAGING_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Aligner le routage Vault sur le staging sans copier de secret PROD
        run: |
          set -euo pipefail
          api_keys_json="$(supabase projects api-keys \
            --project-ref "$STAGING_REF" \
            --output json)"
          service_role_key="$(jq -er '
            (if type == "array" then .
             elif (.api_keys | type) == "array" then .api_keys
             elif (.data | type) == "array" then .data
             else error("format de clés API Supabase inattendu")
             end)
            | map(select(
                (.name // .type // "") == "service_role"
              ))
            | first
            | (.api_key // .key // .value)
            | select(type == "string" and length >= 32)
          ' <<<"$api_keys_json")"
          echo "::add-mask::$service_role_key"

          psql "${{ steps.staging-url.outputs.url }}" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT vault.update_secret(
            id,
            'https://mejpriaetwgtcstbgfid.supabase.co',
            'supabase_url',
            'URL du projet Jolene staging'
          )
          FROM vault.secrets
          WHERE name = 'supabase_url';

          SELECT vault.create_secret(
            'https://mejpriaetwgtcstbgfid.supabase.co',
            'supabase_url',
            'URL du projet Jolene staging'
          )
          WHERE NOT EXISTS (
            SELECT 1 FROM vault.secrets WHERE name = 'supabase_url'
          );
          SQL

          psql "${{ steps.staging-url.outputs.url }}" \
            -v ON_ERROR_STOP=1 \
            -v service_role_key="$service_role_key" <<'SQL'
          SELECT vault.update_secret(
            id,
            :'service_role_key',
            'service_role_key',
            'Clé service_role du projet Jolene staging'
          )
          FROM vault.secrets
          WHERE name = 'service_role_key';

          SELECT vault.create_secret(
            :'service_role_key',
            'service_role_key',
            'Clé service_role du projet Jolene staging'
          )
          WHERE NOT EXISTS (
            SELECT 1 FROM vault.secrets WHERE name = 'service_role_key'
          );
          SQL

          VAULT_READY=$(psql "${{ steps.staging-url.outputs.url }}" \
            -t -A -v ON_ERROR_STOP=1 -c "
              SELECT CASE
                WHEN count(*) FILTER (
                  WHERE name = 'supabase_url'
                    AND decrypted_secret = 'https://mejpriaetwgtcstbgfid.supabase.co'
                ) = 1
                 AND count(*) FILTER (
                  WHERE name = 'cron_automations_key'
                    AND length(decrypted_secret) >= 32
                ) = 1
                 AND count(*) FILTER (
                  WHERE name = 'service_role_key'
                    AND length(decrypted_secret) >= 32
                ) = 1
                THEN 1 ELSE 0
              END
              FROM vault.decrypted_secrets
              WHERE name IN (
                'supabase_url',
                'cron_automations_key',
                'service_role_key'
              );
            ")
          if [ "$VAULT_READY" != '1' ]; then
            echo "::error::Vault staging incomplet ou mal routé (valeurs non affichées)."
            exit 1
          fi
          echo "Vault staging : noms requis présents et URL isolée."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Rejouer la réconciliation idempotente hors dump
        run: |
          set -euo pipefail
          # Le dump de production est volontairement schema-only : les tables
          # de référence existent après restauration, mais leurs données
          # canoniques doivent être rejouées explicitement.
          psql "${{ steps.staging-url.outputs.url }}" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260714084802_synchroniser_regles_profil_exercice.sql

          # La matrice juridique profession × établissement est elle aussi une
          # donnée de référence absente du dump schema-only.
          psql "${{ steps.staging-url.outputs.url }}" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260712161000_finaliser_matrice_modes_exercice.sql
          psql "${{ steps.staging-url.outputs.url }}" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260713164844_corriger_sources_modes_exercice_et_specialites_infirmieres.sql

          # Ce fichier est une migration normale en production et un script
          # volontairement rejouable après chaque reset staging.
          psql "${{ steps.staging-url.outputs.url }}" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260729143000_reinstaller_dependances_auth_storage_apres_bootstrap.sql

      - name: Assert launch migrations on STAGING without cron activation
        run: |
          set -euo pipefail
          URL="${{ steps.staging-url.outputs.url }}"

          LAUNCH_MIGRATIONS=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*)
              FROM supabase_migrations.schema_migrations
             WHERE version IN (
               '20260729121419',
               '20260729121442',
               '20260729121443',
               '20260729134515',
               '20260729143000'
             );
          ")
          INVENTORY_COUNT=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM private.security_definer_inventory;
          ")
          EXPECTED_INVENTORY_COUNT=$(python3 -c "
          import csv
          with open('/tmp/security-definer-inventory.csv', newline='', encoding='utf-8-sig') as source:
              print(sum(1 for _ in csv.DictReader(source)))
          ")
          PROFILE_RULES=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM public.regles_exercice_profession;
          ")
          EXERCISE_MATRIX_RULES=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM public.matrice_modes_exercice;
          ")
          PRIVATE_SERVICE_ACCESS=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT CASE
              WHEN has_schema_privilege('service_role', 'private', 'USAGE')
               AND has_function_privilege(
                 'service_role',
                 'private.fn_mission_est_reelle(uuid)',
                 'EXECUTE'
               )
               AND has_function_privilege(
                 'service_role',
                 'private.fn_externalisation_est_reelle(public.externalisation_actions)',
                 'EXECUTE'
               )
              THEN 1 ELSE 0
            END;
          ")
          HAS_CRON=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_extension WHERE extname = 'pg_cron';
          ")
          ACTIVE_CRITICAL=0
          CRITICAL_COUNT=0
          if [ "$HAS_CRON" = '1' ]; then
            read -r CRITICAL_COUNT ACTIVE_CRITICAL < <(
              psql "$URL" -t -A -F ' ' -v ON_ERROR_STOP=1 -c "
              SELECT count(*), count(*) FILTER (WHERE active IS TRUE)
                FROM cron.job
               WHERE jobname IN (
                 'litige-escalation-cron',
                 'email-cron-hourly-immediate',
                 'email-cron-daily',
                 'process-stripe-refunds-15min',
                 'escrow-debit-echeance',
                 'escrow-release',
                 'jolene_process_externalisations',
                 'weekly-invoicing-cron',
                 'jolene-monitor-crons-edge-critiques'
               );
            ")
          fi
          STORAGE_POLICIES=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*)
              FROM pg_catalog.pg_policies
             WHERE schemaname = 'storage'
               AND tablename = 'objects'
               AND policyname IN (
                 'pol_storage_jolene_insert',
                 'pol_storage_jolene_select',
                 'justificatifs_insert_auth',
                 'justificatifs_select_auth',
                 'pol_contrats_signes_select',
                 'soignant_lit_ses_attestations',
                 'soignant_supprime_ses_attestations',
                 'soignant_upload_ses_attestations'
               );
          ")
          PRIVATE_BUCKETS=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM storage.buckets
             WHERE id IN (
               'attestations-heures-externes',
               'contrats-signes',
               'jolene-documents',
               'justificatifs'
             )
               AND public IS FALSE;
          ")
          REALTIME_TABLES=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*) FROM pg_catalog.pg_publication_tables
             WHERE pubname = 'supabase_realtime'
               AND schemaname = 'public'
               AND tablename IN (
                 'messages_chat',
                 'messages_mission',
                 'notifications',
                 'presence_status',
                 'typing_status'
               );
          ")
          AUTH_TRIGGER=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*)
              FROM pg_catalog.pg_trigger t
              JOIN pg_catalog.pg_class c ON c.oid = t.tgrelid
              JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'auth'
               AND c.relname = 'users'
               AND t.tgname = 'trg_auth_user_deleted_cleanup'
               AND t.tgisinternal IS FALSE;
          ")
          RELIABILITY_VIEW=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT CASE
              WHEN to_regclass('extensions.vm_fiabilite_soignants') IS NULL
              THEN 0 ELSE 1
            END;
          ")
          GHOST_MIGRATIONS=$(psql "$URL" -t -A -v ON_ERROR_STOP=1 -c "
            SELECT count(*)
              FROM supabase_migrations.schema_migrations
             WHERE version IN (
               '20260728142033', '20260728143731', '20260728153500',
               '20260728160000', '20260728170000', '20260728171000',
               '20260728172000', '20260728180000', '20260728190000',
               '20260728203000', '20260728204000', '20260728205000',
               '20260728205500', '20260728206000', '20260728211000',
               '20260728212000', '20260728213000', '20260728214000',
               '20260728215000', '20260728220000', '20260728223500'
             );
          ")

          if [ "$LAUNCH_MIGRATIONS" != '5' ]; then
            echo "::error::Migrations lancement incomplètes sur staging ($LAUNCH_MIGRATIONS/5)."
            exit 1
          fi
          if ! [[ "$EXPECTED_INVENTORY_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Inventaire SECURITY DEFINER production illisible ($EXPECTED_INVENTORY_COUNT)."
            exit 1
          fi
          if [ "$INVENTORY_COUNT" != "$EXPECTED_INVENTORY_COUNT" ]; then
            echo "::error::Inventaire SECURITY DEFINER staging incomplet ($INVENTORY_COUNT/$EXPECTED_INVENTORY_COUNT)."
            exit 1
          fi
          if [ "$PROFILE_RULES" != '17' ]; then
            echo "::error::Référentiel des professions staging incomplet ($PROFILE_RULES/17)."
            exit 1
          fi
          if [ "$EXERCISE_MATRIX_RULES" != '43' ]; then
            echo "::error::Matrice des modes d'exercice staging incomplète ($EXERCISE_MATRIX_RULES/43)."
            exit 1
          fi
          if [ "$PRIVATE_SERVICE_ACCESS" != '1' ]; then
            echo "::error::Accès service_role au schéma private incomplet."
            exit 1
          fi
          if [ "$ACTIVE_CRITICAL" != '0' ]; then
            echo "::error::$ACTIVE_CRITICAL cron(s) critique(s) actifs sur staging avant sondes."
            exit 1
          fi
          if [ "$CRITICAL_COUNT" != '9' ]; then
            echo "::error::Crons critiques staging incomplets ($CRITICAL_COUNT/9)."
            exit 1
          fi
          if [ "$STORAGE_POLICIES" != '8' ] \
             || [ "$PRIVATE_BUCKETS" != '4' ] \
             || [ "$REALTIME_TABLES" != '5' ] \
             || [ "$AUTH_TRIGGER" != '1' ] \
             || [ "$RELIABILITY_VIEW" != '1' ]; then
            echo "::error::Dépendances gérées non restaurées (policies=$STORAGE_POLICIES, buckets=$PRIVATE_BUCKETS, realtime=$REALTIME_TABLES, auth_trigger=$AUTH_TRIGGER, vue=$RELIABILITY_VIEW)."
            exit 1
          fi
          if [ "$GHOST_MIGRATIONS" != '0' ]; then
            echo "::error::$GHOST_MIGRATIONS/21 migrations fantômes subsistent sur staging."
            exit 1
          fi

          echo "Migrations lancement : $LAUNCH_MIGRATIONS/5"
          echo "Inventaire SECURITY DEFINER : $INVENTORY_COUNT/$EXPECTED_INVENTORY_COUNT"
          echo "Référentiel des professions : $PROFILE_RULES/17"
          echo "Matrice des modes d'exercice : $EXERCISE_MATRIX_RULES/43"
          echo "Accès service_role/private : OK"
          echo "Dépendances gérées : 8 policies, 4 buckets, 5 tables Realtime, trigger Auth et vue OK"
          echo "Crons critiques : $CRITICAL_COUNT/9 présents, $ACTIVE_CRITICAL actif"
          echo "Migrations fantômes : $GHOST_MIGRATIONS/21"

      # ─── 3. Seed comptes test Playwright (auth schema pas dans le dump) ─
      - name: Re-execute playwright seed migration
        run: |
          set -e
          # Cette migration crée playwright-soignant@jolene.app et
          # playwright-etab@jolene.app dans auth.users (idempotent via DO blocks).
          # Indispensable pour scenarios B/D/E qui en dépendent.
          psql "${{ steps.staging-url.outputs.url }}" -v ON_ERROR_STOP=1 \
            -f db/migrations_archive/20260503050000_playwright_seed_test_accounts.sql

      # ─── 4. Seed load test data (optional) ──────────────────────────
      - name: Seed [loadtest] missions
        if: inputs.seed_load_test_data
        run: |
          set -e
          psql "${{ steps.staging-url.outputs.url }}" -v ON_ERROR_STOP=1 \
            -f tests/load/seed/seed-staging.sql

      # ─── 5. Verify ──────────────────────────────────────────────────
      - name: Verify staging bootstrap
        run: |
          set -e
          URL="${{ steps.staging-url.outputs.url }}"

          TABLES=$(psql "$URL" -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          MIGRATIONS=$(psql "$URL" -t -A -c "SELECT count(*) FROM supabase_migrations.schema_migrations;")
          PLAYWRIGHT_USERS=$(psql "$URL" -t -A -c "SELECT count(*) FROM auth.users WHERE email LIKE 'playwright-%@jolene.app';")

          echo "Tables public        : $TABLES"
          echo "Migrations tracking  : $MIGRATIONS"
          echo "Comptes Playwright   : $PLAYWRIGHT_USERS"

          if [ "$TABLES" -lt 20 ]; then
            echo "::error::Trop peu de tables ($TABLES) — bootstrap incomplet"
            exit 1
          fi
          if [ "$PLAYWRIGHT_USERS" -lt 2 ]; then
            echo "::error::Comptes test Playwright non seedés ($PLAYWRIGHT_USERS/2)"
            exit 1
          fi

          if [ "${{ inputs.seed_load_test_data }}" = "true" ]; then
            LOADTEST=$(psql "$URL" -t -A -c "SELECT count(*) FROM public.missions WHERE intitule LIKE '[loadtest]%' AND statut='TERMINEE';")
            echo "Missions [loadtest]  : $LOADTEST"
            if [ "$LOADTEST" -lt 500 ]; then
              echo "::error::Seed loadtest incomplet ($LOADTEST/500)"
              exit 1
            fi
          fi

          echo "::notice::Bootstrap staging OK : $TABLES tables, $MIGRATIONS migrations trackées, $PLAYWRIGHT_USERS comptes test"

  deploy-functions:
    name: Deploy edge functions (staging)
    if: ${{ !inputs.skip_functions && !inputs.export_frontend_config_only && !inputs.repair_test_profiles_only }}
    runs-on: ubuntu-latest
    needs: bootstrap-staging
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Install postgresql-client
        run: |
          set -e
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Refuser tout déploiement Edge hors staging Jolene
        run: |
          set -euo pipefail
          if [ "$STAGING_REF" != 'mejpriaetwgtcstbgfid' ] \
             || [ "$STAGING_REF" = 'flripxtsyegjshnhzjkz' ]; then
            echo "::error::Project ref Edge staging invalide."
            exit 1
          fi
        env:
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Build staging DB URL for post-deploy probes
        id: staging-db
        run: |
          set -euo pipefail
          projects_json="$(supabase projects list --output json)"
          REGION="$(jq -er --arg ref "$STAGING_REF" '
            .[] | select(.id == $ref) | .region
            | select(type == "string" and test("^[a-z0-9-]+$"))
          ' <<<"$projects_json")"
          ENCODED_PWD=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['STAGING_DB_PASSWORD'], safe=''))")
          URL="postgres://postgres.${STAGING_REF}:${ENCODED_PWD}@aws-0-${REGION}.pooler.supabase.com:5432/postgres?sslmode=require"
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          psql "$URL" -v ON_ERROR_STOP=1 -c \
            "SELECT CASE WHEN current_database() = 'postgres' THEN 1 ELSE 0 END;" \
            >/dev/null
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Deploy every function from supabase/functions
        run: |
          set -euo pipefail
          cd supabase/functions
          for dir in */; do
            fn="${dir%/}"
            if [ -f "$fn/index.ts" ]; then
              echo "::group::Deploying $fn (staging)"
              supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --use-api
              echo "::endgroup::"
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Supprimer les Edge Functions retirées
        run: |
          set -euo pipefail
          remote_functions="$(supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json)"

          for fn in $RETIRED_EDGE_FUNCTIONS; do
            if jq -e --arg fn "$fn" \
              '(.functions // .) | any(.[]; ((.slug // .name // "") == $fn))' \
              <<<"$remote_functions" >/dev/null; then
              supabase functions delete "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --yes
            else
              echo "$fn déjà absent du projet distant."
            fi
          done

          remote_functions="$(supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json)"
          for fn in $RETIRED_EDGE_FUNCTIONS; do
            if jq -e --arg fn "$fn" \
              '(.functions // .) | any(.[]; ((.slug // .name // "") == $fn))' \
              <<<"$remote_functions" >/dev/null; then
              echo "::error::La fonction retirée $fn existe encore à distance."
              exit 1
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Sonder les huit crons Edge sans les activer
        run: |
          set -euo pipefail
          URL="${{ steps.staging-db.outputs.url }}"
          probes="$(psql "$URL" -t -A -v ON_ERROR_STOP=1 \
            -c "SELECT private.fn_sonder_crons_edge_critiques();")"
          if ! jq -e '
            type == "object"
            and length == 8
            and all(.[]; type == "number")
          ' <<<"$probes" >/dev/null; then
            echo "::error::La sonde staging n'a pas retourné huit request_id."
            exit 1
          fi

          probes_ready=false
          for attempt in $(seq 1 18); do
            status="$(
              psql "$URL" -t -A -v ON_ERROR_STOP=1 \
                -v probes="$probes" <<'SQL'
              SELECT private.fn_etat_sondes_crons_edge_critiques(:'probes'::jsonb);
          SQL
            )"
            if jq -e '.ready == true' <<<"$status" >/dev/null; then
              if ! jq -e '
                .success == true
                and .ok == 8
                and .echecs == 0
                and .en_attente == 0
              ' <<<"$status" >/dev/null; then
                echo "::error::Au moins une sonde auth-only staging a échoué."
                jq . <<<"$status"
                exit 1
              fi
              probes_ready=true
              break
            fi
            echo "Sondes staging en attente ($attempt/18)."
            [ "$attempt" = '18' ] || sleep 5
          done

          if [ "$probes_ready" != 'true' ]; then
            echo "::error::Délai dépassé pour les sondes staging."
            exit 1
          fi

          controller="$(psql "$URL" -t -A -v ON_ERROR_STOP=1 \
            -c "SELECT private.fn_controler_crons_edge_critiques();")"
          if ! jq -e '.success == true and .echecs == 0' \
            <<<"$controller" >/dev/null; then
            echo "::error::Le contrôleur staging a détecté un échec."
            jq . <<<"$controller"
            exit 1
          fi

          read -r cron_count active_count < <(
            psql "$URL" -t -A -F ' ' -v ON_ERROR_STOP=1 -c "
              SELECT count(*), count(*) FILTER (WHERE active IS TRUE)
                FROM cron.job
               WHERE jobname IN (
                 'litige-escalation-cron',
                 'email-cron-hourly-immediate',
                 'email-cron-daily',
                 'process-stripe-refunds-15min',
                 'escrow-debit-echeance',
                 'escrow-release',
                 'jolene_process_externalisations',
                 'weekly-invoicing-cron',
                 'jolene-monitor-crons-edge-critiques'
               );
            "
          )
          if [ "$cron_count" != '9' ] || [ "$active_count" != '0' ]; then
            echo "::error::Les sondes staging ont altéré les crons ($cron_count/9, $active_count actif)."
            exit 1
          fi
          echo "Sondes auth-only : 8/8 HTTP 2xx ; crons staging laissés inactifs."

      - name: Summary
        run: |
          echo "### Deploy Supabase STAGING ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Stratégie : dump prod schema → psql staging" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schéma prod dumpé (public + custom) et appliqué" >> "$GITHUB_STEP_SUMMARY"
          echo "- supabase_migrations tracking restauré" >> "$GITHUB_STEP_SUMMARY"
          echo "- Comptes test Playwright re-seedés" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.seed_load_test_data }}" = "true" ]; then
            echo "- 500 missions [loadtest] seedées (scenario F)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ inputs.skip_functions }}" != "true" ]; then
            echo "- Edge functions déployées" >> "$GITHUB_STEP_SUMMARY"
            echo "- 8 sondes auth-only réussies ; 9 crons staging laissés inactifs" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Projet staging : \`${{ secrets.STAGING_SUPABASE_PROJECT_REF }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Prochaine étape : Actions → \"Load tests (k6)\"." >> "$GITHUB_STEP_SUMMARY"
