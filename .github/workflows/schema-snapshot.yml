name: Schema snapshot (weekly)

# Dump le schéma public de Supabase et re-versionne la baseline
# `supabase/schema/public.sql` (contre laquelle drift-check.yml diffe chaque
# jour). Sans re-baseline, la baseline se périme à CHAQUE migration mergée et
# le drift-check part au rouge (dérive légitime — incident 04/07/2026).
#
# Fix permanent : ce workflow se déclenche AUTOMATIQUEMENT après un
# `deploy-supabase` réussi (workflow_run) et pousse la baseline sur la branche
# dédiée `auto/schema-baseline` ; une PR de cette branche vers main la fait
# atterrir (main exige une PR — protection de branche).
#
# NOTE 05/07/2026 : le déclencheur workflow_run n'a jamais tiré (name exact ✓,
# workflows sur main ✓, pas de filtre branches ✓ — cause inconnue). Fallback :
# schedule QUOTIDIEN 6h UTC (1h après drift-check) + dispatch manuel après un
# merge de migration si on veut verdir sans attendre.

on:
  workflow_run:
    workflows: ["Deploy Supabase (migrations + edge functions)"]
    types: [completed]
  schedule:
    # Quotidien 6h UTC — filet permanent puisque workflow_run ne tire pas.
    - cron: '0 6 * * *'
  workflow_dispatch: # Déclenchement manuel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  snapshot:
    name: Dump schema + re-baseline main
    runs-on: ubuntu-latest
    # Sur workflow_run : uniquement si le deploy a réussi (pas de re-baseline
    # sur un deploy rouge). Schedule/dispatch : toujours.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Dump public schema
        run: |
          set -euo pipefail
          mkdir -p supabase/schema
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db dump --schema public --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            > supabase/schema/public.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check if schema changed
        id: diff
        # git status --porcelain (et pas git diff --quiet) : un fichier
        # UNTRACKED ne produit aucun diff → tous les runs historiques
        # concluaient "changed=false" et le step PR était skipped, la
        # baseline n'a jamais atterri dans le repo (découvert Lot 9.0,
        # run #28652615624 du 03/07/2026). git status voit aussi le "??".
        run: |
          if [ -z "$(git status --porcelain supabase/schema/public.sql)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dump artifact
        # Toujours disponible même si la PR bot échoue ou est skipped —
        # permet de récupérer le dump et de le committer à la main.
        uses: actions/upload-artifact@v5
        with:
          name: schema-public-sql
          path: supabase/schema/public.sql
          retention-days: 14

      - name: Re-baseline via branche dédiée (main exige une PR)
        if: steps.diff.outputs.changed == 'true'
        # `main` est protégée : « Changes must be made through a pull request »
        # → un push direct du bot est refusé (GH006). On pousse donc la baseline
        # sur une branche dédiée NON protégée (le push GITHUB_TOKEN passe), puis
        # une PR `auto/schema-baseline` → main la fait atterrir. Le push --force
        # est sûr : la branche ne porte que ce commit de re-baseline au-dessus de
        # main, régénéré à chaque run.
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/schema/public.sql
          git commit -m "chore(schema): re-baseline auto du schéma prod"
          if git push --force origin HEAD:auto/schema-baseline; then
            echo "✅ Baseline poussée sur auto/schema-baseline."
          else
            echo "::warning::Push sur auto/schema-baseline refusé. Le dump reste disponible en artifact 'schema-public-sql' — le committer à la main."
            exit 0
          fi

      - name: Ouvrir + auto-merger la PR de baseline (chaînon manquant du pipeline)
        if: steps.diff.outputs.changed == 'true'
        # Sans cette étape, la baseline restait poussée sur auto/schema-baseline
        # SANS PR → jamais mergée → drift-check rouge en permanence (la baseline
        # versionnée sur main ne suivait aucune migration mergée). On ouvre donc
        # la PR automatiquement (idempotent : réutilise la PR ouverte s'il y en a
        # une) puis on tente l'auto-merge.
        #
        # NB dégradation gracieuse : une PR créée par le GITHUB_TOKEN ne
        # re-déclenche pas la CI (anti-boucle GitHub). L'auto-merge sur checks
        # requis peut donc rester en attente selon la protection de branche.
        # `--auto` d'abord (si le repo l'autorise), sinon merge immédiat (fichier
        # snapshot INERTE, zéro runtime), sinon la PR reste ouverte à merger en
        # 1 clic. Dans tous les cas : fini le « périmé en silence sans PR ».
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PR=$(gh pr list --head auto/schema-baseline --base main --state open --json number -q '.[0].number' || true)
          if [ -z "${PR:-}" ]; then
            gh pr create --base main --head auto/schema-baseline \
              --title "chore(schema): re-baseline auto du schéma prod (verdir drift-check)" \
              --body "PR auto-générée par \`schema-snapshot.yml\` après un deploy réussi. Seul \`supabase/schema/public.sql\` change (dump prod) — **aucun effet runtime**. Fait suivre la baseline versionnée aux migrations mergées et verdit drift-check."
            PR=$(gh pr view auto/schema-baseline --json number -q '.number')
          fi
          echo "PR de baseline : #$PR"
          if gh pr merge "$PR" --squash --auto; then
            echo "✅ Auto-merge activé sur #$PR (mergera dès checks OK)."
          elif gh pr merge "$PR" --squash; then
            echo "✅ #$PR mergée immédiatement (fichier snapshot inerte)."
          else
            echo "::warning::#$PR ouverte mais non mergée automatiquement — merger à la main (activer « Allow auto-merge » dans Settings pour du 100% hands-off)."
          fi
