name: Schema snapshot (weekly)

# Dump le schéma public de Supabase et re-versionne la baseline
# `supabase/schema/public.sql` (contre laquelle drift-check.yml diffe chaque
# jour). Sans re-baseline, la baseline se périme à CHAQUE migration mergée et
# le drift-check part au rouge (dérive légitime — incident 04/07/2026).
#
# Fix permanent : ce workflow se déclenche AUTOMATIQUEMENT après un
# `deploy-supabase` réussi (workflow_run) et committe la baseline DIRECTEMENT
# sur main via GITHUB_TOKEN (contents:write) — plus de dépendance à la création
# de PR par les Actions (réglage repo qui bloquait peter-evans). Le commit est
# non-fatal : si main est protégée contre les push Actions, warning + artifact.

on:
  workflow_run:
    workflows: ["Deploy Supabase (migrations + edge functions)"]
    types: [completed]
  schedule:
    # Filet hebdo (lundi 6h UTC) au cas où un deploy n'aurait pas re-baseliné.
    - cron: '0 6 * * 1'
  workflow_dispatch: # Déclenchement manuel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  snapshot:
    name: Dump schema + re-baseline main
    runs-on: ubuntu-latest
    # Sur workflow_run : uniquement si le deploy a réussi (pas de re-baseline
    # sur un deploy rouge). Schedule/dispatch : toujours.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Dump public schema
        run: |
          set -euo pipefail
          mkdir -p supabase/schema
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db dump --schema public --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            > supabase/schema/public.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check if schema changed
        id: diff
        # git status --porcelain (et pas git diff --quiet) : un fichier
        # UNTRACKED ne produit aucun diff → tous les runs historiques
        # concluaient "changed=false" et le step PR était skipped, la
        # baseline n'a jamais atterri dans le repo (découvert Lot 9.0,
        # run #28652615624 du 03/07/2026). git status voit aussi le "??".
        run: |
          if [ -z "$(git status --porcelain supabase/schema/public.sql)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dump artifact
        # Toujours disponible même si la PR bot échoue ou est skipped —
        # permet de récupérer le dump et de le committer à la main.
        uses: actions/upload-artifact@v5
        with:
          name: schema-public-sql
          path: supabase/schema/public.sql
          retention-days: 14

      - name: Re-baseline main (commit direct, non-fatal)
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/schema/public.sql
          git commit -m "chore(schema): re-baseline auto du schéma prod [skip ci]"
          # main a pu avancer depuis le checkout → rebase avant push.
          git pull --rebase --autostash origin main || true
          if git push origin HEAD:main; then
            echo "✅ Baseline re-versionnée sur main."
          else
            echo "::warning::Push de la baseline refusé (main protégée contre les push Actions ?). Le dump reste disponible en artifact 'schema-public-sql' — le committer à la main, ou activer Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests' + rétablir la création de PR."
          fi
