name: Schema snapshot (weekly)

# Dump le schéma public de Supabase toutes les semaines pour garder une
# trace versionnée de l'état réel de la base. Permet de détecter les
# modifications manuelles faites via le dashboard Supabase qui ne passent
# pas par les migrations.
#
# Si le schéma a changé, le workflow crée une PR avec le nouveau dump.

on:
  schedule:
    # Tous les lundis à 6h UTC (8h heure de Paris)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permet un déclenchement manuel

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  snapshot:
    name: Dump schema + create PR if changed
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Dump public schema
        run: |
          set -euo pipefail
          mkdir -p supabase/schema
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db dump --schema public --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            > supabase/schema/public.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check if schema changed
        id: diff
        # git status --porcelain (et pas git diff --quiet) : un fichier
        # UNTRACKED ne produit aucun diff → tous les runs historiques
        # concluaient "changed=false" et le step PR était skipped, la
        # baseline n'a jamais atterri dans le repo (découvert Lot 9.0,
        # run #28652615624 du 03/07/2026). git status voit aussi le "??".
        run: |
          if [ -z "$(git status --porcelain supabase/schema/public.sql)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dump artifact
        # Toujours disponible même si la PR bot échoue ou est skipped —
        # permet de récupérer le dump et de le committer à la main.
        uses: actions/upload-artifact@v5
        with:
          name: schema-public-sql
          path: supabase/schema/public.sql
          retention-days: 14

      - name: Create PR with updated schema
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(schema): weekly snapshot of Supabase public schema'
          title: 'Schema snapshot — weekly update'
          body: |
            Automated weekly dump of the Supabase public schema.

            If this PR contains changes, it means the schema on prod
            differs from the last snapshot. Investigate whether these
            changes came from migrations (expected) or from manual
            dashboard edits (⚠️ should be documented).
          branch: schema-snapshot-${{ github.run_number }}
          delete-branch: true
          labels: schema, automated
