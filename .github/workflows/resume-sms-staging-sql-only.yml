name: Reprendre SQL SMS staging fermé depuis v24 (manuel)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA main exact portant la reprise et son témoin CI épinglé relus
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: jolene-supabase-staging-writes
  queue: max
  cancel-in-progress: false
jobs:
  resume-sql-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Refuser tout contexte autre que main exact avant credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'Gabpcd/JJJJJ' || "$GITHUB_EVENT_NAME" != 'workflow_dispatch' || "$GITHUB_REF" != 'refs/heads/main' || ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ || "$GITHUB_SHA" != "$EXPECTED_SHA" || "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            echo 'EXACT_TRUSTED_MAIN_REQUIRED'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.14.0'
      - name: Tester les refus sans secret ni réseau
        run: node --test tests/node/resume-sms-staging-sql-only.node.mjs tests/node/resume-sms-staging-sql-only-sql.node.mjs
      - name: Refuser un manifeste encore en préparation avant credentials
        run: node --input-type=module -e "import{readFileSync as r}from'node:fs';import{checkResumeContract as c}from'./scripts/ci/resume-sms-staging-sql-only.mjs';c(JSON.parse(r('scripts/ci/resume-sms-staging-sql-only.contract.json')),JSON.parse(r('scripts/ci/install-sms-staging-closed.contract.json')));"
      - name: Vérifier v24 existante, aperçu annulé puis installation SQL vide
        timeout-minutes: 9
        run: node scripts/ci/resume-sms-staging-sql-only.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      - name: Publier seulement le reçu fermé
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resume-sms-staging-sql-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resume-sms-staging-sql-only/result.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
