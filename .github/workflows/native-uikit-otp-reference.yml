name: Diagnostic UIKit — comparaison des hôtes ARM64

# Temporary diagnostic branch. Manual only; never a product validation or release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host: '15'
            kind: touch
            family: iphone
          - os: macos-26
            host: '26'
            kind: touch
            family: iphone
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Compiler et observer uniquement le témoin UIKit
        run: node mobile-native/scripts/run-uikit-otp-reference-ci.mjs
        timeout-minutes: 15
        env:
          UIKIT_REFERENCE_KIND: ${{ matrix.kind }}
          IOS_DEVICE_FAMILY: ${{ matrix.family }}
          UIKIT_HOST_FAMILY: ${{ matrix.host }}
          UIKIT_REFERENCE_OUTPUT_DIR: ${{ github.workspace }}/mobile-native/test-results/uikit-otp-reference
      - name: Conserver les preuves propres au témoin
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uikit-host-${{ matrix.os }}-${{ github.sha }}
          path: mobile-native/test-results/uikit-otp-reference/
          retention-days: 7
          if-no-files-found: warn
