name: Restore local bootstrap (empty infrastructure only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/restore-local-bootstrap.yml'
      - 'tools/restore-local/**'

permissions:
  contents: read

concurrency:
  group: jolene-restore-local-bootstrap
  cancel-in-progress: false

jobs:
  empty-local-stacks:
    if: github.repository == 'Gabpcd/JJJJJ' && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && github.ref != 'refs/heads/ci/restore-app-phase-a-20261004' && github.head_ref != 'ci/restore-app-phase-a-20261004'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: tools/restore-local
    env:
      PRIVATE_DIR: /tmp/jolene-restore-private-${{ github.run_id }}-${{ github.run_attempt }}
      PROOF_DIR: /tmp/jolene-restore-proof-${{ github.run_id }}-${{ github.run_attempt }}
      DRILL_RUN: jolene-restore-drill-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact tested revision
        timeout-minutes: 1
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node (no npm install)
        timeout-minutes: 1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.0'
      - name: Identity and local guards
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PROOF_DIR"
          node scripts/restore/ci-guard.mjs identity > "$PROOF_DIR/identity.json"
          node --test scripts/restore/bootstrap.test.mjs scripts/restore/ci-guard.test.mjs scripts/restore/extensions.test.mjs scripts/export/export-schema.test.mjs > "$PROOF_DIR/unit-tests.tap"
          node scripts/restore/bootstrap.mjs plan "$PRIVATE_DIR" "$DRILL_RUN" > "$PROOF_DIR/plan.json"
      - name: Preload five public digest-pinned images (before isolation)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 270s node scripts/restore/bootstrap.mjs preload "$PRIVATE_DIR" > "$PROOF_DIR/preload.json" 2>&1
      - name: Preflight without application schema
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node scripts/restore/bootstrap.mjs preflight "$PRIVATE_DIR" > "$PROOF_DIR/preflight.json" 2>&1
      - name: Start two empty isolated stacks and check API health
        timeout-minutes: 4
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 210s node scripts/restore/bootstrap.mjs up "$PRIVATE_DIR" > "$PROOF_DIR/start.json" 2>&1
      - name: Reinspect network, empty SQL and health; refuse repeated start
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/restore/bootstrap.mjs inspect "$PRIVATE_DIR" > "$PROOF_DIR/inspect.json" 2>&1
          node scripts/restore/ci-guard.mjs existing-refusal "$PRIVATE_DIR" > "$PROOF_DIR/existing-refusal.json" 2>&1
      - name: Read installed and available extension versions (no CREATE)
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node scripts/restore/bootstrap.mjs extensions "$PRIVATE_DIR" > "$PROOF_DIR/extensions.json" 2>&1
      - name: Require nine exact extension versions on both stacks
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node scripts/restore/extensions.mjs compare "$PROOF_DIR/extensions.json" "$DRILL_RUN" > "$PROOF_DIR/extension-compatibility.json" 2>&1
      - name: Filtered container states before cleanup
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          if [[ -f "$PRIVATE_DIR/manifest.json" ]]; then
            node scripts/restore/bootstrap.mjs diagnose "$PRIVATE_DIR" > "$PROOF_DIR/diagnostic.json" 2>&1
          fi
      - name: Always clean only exact owned resources
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          if [[ -f "$PRIVATE_DIR/manifest.json" ]]; then
            node scripts/restore/bootstrap.mjs down "$PRIVATE_DIR" > "$PROOF_DIR/cleanup.json" 2>&1
            node scripts/restore/bootstrap.mjs down "$PRIVATE_DIR" > "$PROOF_DIR/cleanup-again.json" 2>&1
          else
            node scripts/restore/bootstrap.mjs absent "$DRILL_RUN" > "$PROOF_DIR/no-start.json" 2>&1
          fi
      - name: Independently verify exact absence
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          node scripts/restore/bootstrap.mjs absent "$DRILL_RUN" > "$PROOF_DIR/absence.json" 2>&1
      - name: Filtered proof only (never private compose, keys, DB logs or dumps)
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-empty-infra-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_DIR }}/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

  native-capture:
    if: github.repository == 'Gabpcd/JJJJJ' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/restore-app-phase-a-20261004'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PRIVATE_DIR: /tmp/jolene-restore-phase-a-private-${{ github.run_id }}-${{ github.run_attempt }}
      PROOF_DIR: /tmp/jolene-restore-phase-a-proof-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact manually selected revision
        timeout-minutes: 1
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Node without npm or SDK install
        timeout-minutes: 1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.0'
      - name: Exact source and pure refusal contracts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$PRIVATE_DIR" "$PROOF_DIR"
          node tools/restore-local/scripts/restore-app/phase-a.mjs identity > "$PRIVATE_DIR/identity.log" 2>&1
          node tools/restore-local/scripts/restore-app/phase-a.mjs units > "$PRIVATE_DIR/units.log" 2>&1
          node tools/restore-local/scripts/restore-app/phase-a.mjs plan > "$PRIVATE_DIR/plan.log" 2>&1
      - name: Reuse qualified ten-service containment and five pinned images
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=15s 570s node tools/restore-local/scripts/restore-app/phase-a.mjs bootstrap > "$PRIVATE_DIR/bootstrap.log" 2>&1
      - name: Exact import then synthetic Auth Storage snapshot and native TOC
        timeout-minutes: 23
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=15s 1320s node tools/restore-local/scripts/restore-app/phase-a.mjs native > "$PRIVATE_DIR/native.log" 2>&1
      - name: Closed container state before cleanup
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRIVATE_DIR" "$PROOF_DIR"
          node tools/restore-local/scripts/restore-app/phase-a.mjs diagnose > "$PRIVATE_DIR/diagnose.log" 2>&1
      - name: Always clean exact owned resources twice
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRIVATE_DIR" "$PROOF_DIR"
          node tools/restore-local/scripts/restore-app/phase-a.mjs cleanup > "$PRIVATE_DIR/cleanup.log" 2>&1
      - name: Independent exact absence
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRIVATE_DIR" "$PROOF_DIR"
          node tools/restore-local/scripts/restore-app/phase-a.mjs absence > "$PRIVATE_DIR/absence.log" 2>&1
      - name: Only closed projections - no dump Auth values files raw TOC or logs
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-app-phase-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROOF_DIR }}/identity.json
            ${{ env.PROOF_DIR }}/units.json
            ${{ env.PROOF_DIR }}/bootstrap-proof.json
            ${{ env.PROOF_DIR }}/phase-a.json
            ${{ env.PROOF_DIR }}/diagnostic.json
            ${{ env.PROOF_DIR }}/cleanup.json
            ${{ env.PROOF_DIR }}/cleanup-again.json
            ${{ env.PROOF_DIR }}/absence.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
