name: Pointages React Native — démonstration isolée

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-native/**'
      - 'src/lib/constantes.ts'
      - 'src/lib/documents.ts'
      - 'src/lib/documentUpload.ts'
      - 'src/lib/donnees-test.ts'
      - 'src/lib/geo.ts'
      - 'src/lib/profession-hierarchy.ts'
      - 'src/lib/date-heure-paris.ts'
      - 'src/lib/disponibilite-pointage.ts'
      - 'src/lib/profil-soignant.ts'
      - 'src/lib/valider-profil-soignant.ts'
      - 'src/lib/preferencesModesExercice.ts'
      - 'src/lib/luhn.ts'
      - 'src/lib/completude-planning-mission.ts'
      - 'src/components/planning/planning-candidat.ts'
      - 'src/lib/contratMissionUi.ts'
      - 'src/lib/signatureSmsStagingAdmission.ts'
      - 'supabase/functions/_shared/cdd-employeur.ts'
      - 'supabase/functions/_shared/contrat-liberal.ts'
      - 'supabase/functions/generate-contrat-mission-pdf/**'
      - 'tests/admin/security/fixtures/contrat-liberal-master-v3.html'
      - '.github/workflows/native-presence.yml'
      - 'scripts/ci/presence-contract-pg17.py'
      - 'tests/fixtures/presence-contract-live-20261029.json'
      - 'supabase/migrations/20261030000100_lecture_signature_pour_pointage.sql'
  push:
    branches: [main]
    paths:
      - 'mobile-native/**'
      - 'src/lib/constantes.ts'
      - 'src/lib/documents.ts'
      - 'src/lib/documentUpload.ts'
      - 'src/lib/donnees-test.ts'
      - 'src/lib/geo.ts'
      - 'src/lib/profession-hierarchy.ts'
      - 'src/lib/date-heure-paris.ts'
      - 'src/lib/disponibilite-pointage.ts'
      - 'src/lib/profil-soignant.ts'
      - 'src/lib/valider-profil-soignant.ts'
      - 'src/lib/preferencesModesExercice.ts'
      - 'src/lib/luhn.ts'
      - 'src/lib/completude-planning-mission.ts'
      - 'src/components/planning/planning-candidat.ts'
      - 'src/lib/contratMissionUi.ts'
      - 'src/lib/signatureSmsStagingAdmission.ts'
      - 'supabase/functions/_shared/cdd-employeur.ts'
      - 'supabase/functions/_shared/contrat-liberal.ts'
      - 'supabase/functions/generate-contrat-mission-pdf/**'
      - 'tests/admin/security/fixtures/contrat-liberal-master-v3.html'
      - '.github/workflows/native-presence.yml'
      - 'scripts/ci/presence-contract-pg17.py'
      - 'tests/fixtures/presence-contract-live-20261029.json'
      - 'supabase/migrations/20261030000100_lecture_signature_pour_pointage.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-presence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Synthetic demonstration only: no credentials, EAS, native delivery or store upload.
env:
  CI: '1'
  EXPO_PUBLIC_JOLENE_MODE: demo
  EXPO_PUBLIC_JOLENE_NAVIGATION_DIAGNOSTICS: '1'
  NATIVE_PILOT_SCENARIO: presence
  EXPO_PUBLIC_JOLENE_DOCUMENTS_SCENARIO: '0'
  EXPO_PUBLIC_JOLENE_CONTRACTS_SCENARIO: '0'
  EXPO_PUBLIC_JOLENE_PRESENCE_SCENARIO: '1'
  EXPO_PUBLIC_SUPABASE_URL: ''
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
  EXPO_NO_DOTENV: '1'
  EXPO_NO_TELEMETRY: '1'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  NODE_OPTIONS: --dns-result-order=ipv4first

defaults:
  run:
    shell: bash
    working-directory: mobile-native

jobs:
  postgres:
    name: Pointages — signature et permissions PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: presence_temoin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-ci-ephemere
        ports: ['127.0.0.1:54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d presence_temoin"
          --health-interval 5s --health-timeout 5s --health-retries 6
    env:
      JOLENE_PRESENCE_WITNESS: LOCAL_EPHEMERE
      PGHOST: 127.0.0.1
      PGPORT: '54329'
      PGDATABASE: presence_temoin
      PGUSER: postgres
      PGPASSWORD: fixture-ci-ephemere
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Signature seule, droits du tenant et RLS des contrats sur base isolée
        working-directory: .
        run: python3 scripts/ci/presence-contract-pg17.py

  checks:
    name: Pointages — types, logique et bundles de contrôle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile-native/package-lock.json
      - run: npm ci
        timeout-minutes: 8
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
        timeout-minutes: 8

  ios:
    name: Pointages — ${{ matrix.family }} ${{ matrix.orientation }}
    needs: checks
    runs-on: macos-26
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        # Each orientation gets a fresh runtime and its original synthetic fixtures.
        # Pointage landscape never follows a mutated portrait fixture.
        include:
          - family: iphone
            orientation: portrait
          - family: ipad
            orientation: portrait
          - family: ipad
            orientation: landscape
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile-native/package-lock.json
      - run: npm ci
        timeout-minutes: 8
      - name: Pointages fictifs dans le client Debug source sur simulateur iOS
        run: node scripts/run-pilot-ci.mjs ios
        # Source compilation included; the pointage XCTest keeps its 600 second budget.
        timeout-minutes: 130
        env:
          NATIVE_IOS_HOST: compiled-debug
          NATIVE_IOS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RCT_USE_PREBUILT_RNCORE: '0'
          RCT_USE_RN_DEP: '1'
          IOS_DEVICE_FAMILY: ${{ matrix.family }}
          NATIVE_PRESENCE_ORIENTATION: ${{ matrix.orientation }}
          PILOT_OUTPUT_DIR: ${{ github.workspace }}/mobile-native/test-results/presence-${{ matrix.family }}-${{ matrix.orientation }}
      - name: Conserver preuves, rapport et diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-presence-${{ matrix.family }}-${{ matrix.orientation }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile-native/test-results/presence-${{ matrix.family }}-${{ matrix.orientation }}/
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Pointages — Android portrait
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile-native/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        timeout-minutes: 8
      - name: Installer Maestro vérifié
        run: bash scripts/install-maestro-ci.sh
        timeout-minutes: 10
      - name: Activer KVM sur le runner éphémère
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pointages fictifs Android 15 avec reprise et retour système
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disk-size: 4096M
          enable-hw-keyboard: false
          disable-animations: false
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd mobile-native && node scripts/run-pilot-ci.mjs android
        env:
          NATIVE_PRESENCE_ORIENTATION: portrait
          PILOT_OUTPUT_DIR: ${{ github.workspace }}/mobile-native/test-results/presence-android
      - name: Conserver preuves, rapport et diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-presence-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile-native/test-results/presence-android/
          retention-days: 7
          if-no-files-found: warn
