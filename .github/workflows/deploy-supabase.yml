name: Deploy Supabase (migrations + edge functions)

# Automatise le déploiement des migrations SQL et des edge functions
# à chaque push sur main qui touche supabase/**. Vercel s'occupe déjà
# du frontend de son côté.
#
# Prérequis (secrets GitHub repo) :
# - SUPABASE_ACCESS_TOKEN  : dashboard Supabase → Account → Access Tokens
# - SUPABASE_PROJECT_REF   : flripxtsyegjshnhzjkz
# - SUPABASE_DB_PASSWORD   : Project Settings → Database → Connection String

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch: # Permet un déclenchement manuel depuis l'UI GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # Empêche deux déploiements simultanés (évite race conditions sur les migrations)
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Apply SQL migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Show CLI version (debug)
        run: supabase --version

      - name: Link to Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Heal schema_migrations drift (orphan remote versions)
        # Quand Lovable (ou n'importe qui) applique une migration via le
        # dashboard / MCP apply_migration / SQL direct, la ligne est ajoutée
        # à supabase_migrations.schema_migrations avec un timestamp qui
        # n'existe pas dans supabase/migrations/. `supabase db push` bloque
        # alors avec "Remote migration versions not found in local migrations
        # directory". On auto-répare en marquant ces orphelins comme
        # "reverted" (retire la ligne du tracking, ne touche pas au schéma).
        #
        # On passe par l'API Management (POST /v1/projects/{ref}/database/query)
        # plutôt que psql car le pooler Supavisor rejette parfois les
        # connections depuis GitHub Actions avec "Tenant or user not found".
        # L'API Management utilise SUPABASE_ACCESS_TOKEN (déjà configuré pour
        # supabase link) et fonctionne où que tourne le runner.
        #
        # Step best-effort : en cas d'échec (rate limit, API indispo), on
        # laisse `db push` tenter sa chance — s'il échoue aussi, le job fail
        # avec son propre message d'erreur, plus actionable.
        continue-on-error: true
        run: |
          set -euo pipefail

          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"
          AUTH="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"

          # Versions trackées côté remote (schema_migrations)
          REMOTE_JSON=$(curl -sf -X POST "$API" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT version FROM supabase_migrations.schema_migrations ORDER BY version"}')

          echo "$REMOTE_JSON" | jq -r '.[].version' > /tmp/remote_versions.txt

          # Versions présentes dans le repo
          ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -n1 basename \
            | awk -F_ '{print $1}' \
            | sort -u > /tmp/local_versions.txt

          sort -u /tmp/remote_versions.txt -o /tmp/remote_versions.txt

          echo "Remote versions: $(wc -l < /tmp/remote_versions.txt)"
          echo "Local versions:  $(wc -l < /tmp/local_versions.txt)"

          # Orphelins = remote mais pas local
          comm -23 /tmp/remote_versions.txt /tmp/local_versions.txt > /tmp/orphans.txt

          ORPHAN_COUNT=$(wc -l < /tmp/orphans.txt)
          if [ "$ORPHAN_COUNT" -gt 0 ]; then
            echo "::warning::Found $ORPHAN_COUNT orphan remote migrations (applied out-of-band) — removing from schema_migrations tracking"
            cat /tmp/orphans.txt
            # Build IN clause: 'v1','v2',... (single-quoted SQL string literals,
            # safe dans un JSON double-quoted)
            VERSIONS=$(awk 'BEGIN{q=sprintf("%c",39)} {printf "%s%s%s%s", (NR==1?"":","), q, $1, q}' /tmp/orphans.txt)
            DELETE_QUERY="{\"query\":\"DELETE FROM supabase_migrations.schema_migrations WHERE version IN ($VERSIONS)\"}"
            curl -sf -X POST "$API" \
              -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d "$DELETE_QUERY"
          else
            echo "No orphan remote migrations — schema_migrations is in sync with repo"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push pending migrations
        # Pas de --include-all : on laisse le CLI ignorer ce qui est déjà
        # appliqué. La table schema_migrations contient déjà les versions
        # appliquées donc db push est quasiment un no-op s'il n'y a rien
        # de nouveau dans le repo depuis le dernier run.
        #
        # Baseline initialisé manuellement le 2026-04-11 : les 141 versions
        # Lovable ont été insérées en bulk dans schema_migrations via MCP
        # execute_sql (le schéma existait déjà, appliqué hors-CLI par
        # Lovable pendant le dev). Les runs suivants sont ~no-op.
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    needs: deploy-migrations # Attendre que le schéma soit à jour avant de déployer le code qui l'utilise
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Deploy every function listed in supabase/config.toml
        run: |
          set -euo pipefail
          cd supabase/functions
          # Filtrer les répertoires qui contiennent un index.ts
          for dir in */; do
            fn="${dir%/}"
            if [ -f "$fn/index.ts" ]; then
              echo "::group::Deploying $fn"
              supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --use-api
              echo "::endgroup::"
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Summary
        run: |
          echo "### Deploy Supabase ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations SQL appliquées (ou already-applied skip)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Edge functions redéployées depuis le repo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Projet : \`${{ secrets.SUPABASE_PROJECT_REF }}\`" >> "$GITHUB_STEP_SUMMARY"
