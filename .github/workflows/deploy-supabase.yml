name: Deploy Supabase (migrations + edge functions)

# Automatise le déploiement des migrations SQL et des edge functions
# à chaque push sur main qui touche supabase/**. Vercel s'occupe déjà
# du frontend de son côté.
#
# Re-trigger Sprint 17 : le run #265 (merge #417) a échoué sur `db push`
# out-of-order car 4 migrations (260000-272000) étaient appliquées en prod
# mais pas enregistrées dans schema_migrations. Corrigé (toutes enregistrées) ;
# ce commit relance le workflow pour confirmation verte.
#
# Prérequis (secrets GitHub repo) :
# - SUPABASE_ACCESS_TOKEN  : dashboard Supabase → Account → Access Tokens
# - SUPABASE_PROJECT_REF   : flripxtsyegjshnhzjkz
# - SUPABASE_DB_PASSWORD   : Project Settings → Database → Connection String

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch: # Permet un déclenchement manuel depuis l'UI GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RETIRED_EDGE_FUNCTIONS: 'admin-2fa'

concurrency:
  # Empêche deux déploiements simultanés (évite race conditions sur les migrations)
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: Apply SQL migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Show CLI version (debug)
        run: supabase --version

      - name: Link to Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Refuser tout drift schema_migrations
        # Une version remote absente du repo signale un DDL appliqué hors du
        # flux Git. La retirer automatiquement du registre ne remettrait pas le
        # schéma en arrière et permettrait à `db push` de la rejouer plus tard.
        # On échoue donc sans mutation : la seule réparation sûre consiste à
        # versionner le SQL/placeholder correspondant ou à effectuer une
        # réparation manuelle explicitement revue.
        run: |
          set -euo pipefail

          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"
          AUTH="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"

          # Versions trackées côté remote (schema_migrations)
          REMOTE_JSON=$(curl -sf -X POST "$API" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT version FROM supabase_migrations.schema_migrations ORDER BY version"}')

          echo "$REMOTE_JSON" | jq -r '.[].version' > /tmp/remote_versions.txt

          # Versions présentes dans le repo
          ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -n1 basename \
            | awk -F_ '{print $1}' \
            | sort -u > /tmp/local_versions.txt

          sort -u /tmp/remote_versions.txt -o /tmp/remote_versions.txt

          echo "Remote versions: $(wc -l < /tmp/remote_versions.txt)"
          echo "Local versions:  $(wc -l < /tmp/local_versions.txt)"

          # Orphelins = remote mais pas local. Cette étape est strictement en
          # lecture seule : aucune écriture dans schema_migrations.
          comm -23 /tmp/remote_versions.txt /tmp/local_versions.txt > /tmp/orphans.txt
          ORPHAN_COUNT=$(wc -l < /tmp/orphans.txt)
          if [ "$ORPHAN_COUNT" -gt 0 ]; then
            echo "::error::$ORPHAN_COUNT migration(s) remote sont absentes du repo. Déploiement arrêté sans modifier schema_migrations."
            cat /tmp/orphans.txt
            echo "::error::Versionner les migrations correspondantes (ou faire réparer manuellement le drift après revue), puis relancer."
            exit 1
          else
            echo "No orphan remote migrations — schema_migrations is in sync with repo"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push pending migrations
        # --include-all est requis lorsqu'une PR ajoute une migration dont le
        # timestamp est antérieur à la dernière version déjà appliquée (par
        # exemple un correctif préparé plus tôt puis mergé après un autre lot).
        # Le CLI s'appuie toujours sur schema_migrations et n'exécute pas une
        # version déjà enregistrée : l'option autorise seulement le rattrapage
        # ordonné des fichiers locaux réellement absents du registre remote.
        #
        # Baseline initialisé manuellement le 2026-04-11 : les 141 versions
        # Lovable ont été insérées en bulk dans schema_migrations via MCP
        # execute_sql (le schéma existait déjà, appliqué hors-CLI par
        # Lovable pendant le dev). Les runs suivants sont ~no-op.
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    needs: deploy-migrations # Attendre que le schéma soit à jour avant de déployer le code qui l'utilise
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.0

      - name: Désactiver les crons critiques avant le déploiement Edge
        run: |
          set -euo pipefail
          ready=false
          code=000
          echo '{}' > /tmp/cron-disable.json

          # La migration n'est appliquée qu'une fois. Cette RPC remet donc les
          # 8 jobs + le monitor en pause à chaque redéploiement, avant que les
          # fonctions soient remplacées une par une.
          for attempt in 1 2 3; do
            if ! code=$(curl -sS --connect-timeout 10 --max-time 45 \
              -o /tmp/cron-disable.json -w '%{http_code}' \
              -X POST \
              "$SUPABASE_URL/rest/v1/rpc/fn_ops_desactiver_crons_edge_critiques" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              --data '{}'); then
              code=000
            fi

            if [ "$code" = '200' ] \
              && jq -e '
                .success == true
                and (.critiques_desactives | length) == 9
              ' /tmp/cron-disable.json >/dev/null 2>&1; then
              ready=true
              break
            fi

            echo "::warning::Mise en pause des crons non confirmée (tentative $attempt/3, HTTP $code)."
            [ "$attempt" = '3' ] || sleep $((attempt * 5))
          done

          if [ "$ready" != 'true' ]; then
            echo "::error::Déploiement Edge refusé : les crons critiques ne sont pas tous inactifs."
            jq . /tmp/cron-disable.json 2>/dev/null || true
            exit 1
          fi
          jq . /tmp/cron-disable.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy every function listed in supabase/config.toml
        # Retry par fonction (3 essais, backoff) : l'API de déploiement Supabase
        # renvoie parfois un 502 transitoire (souvent un faux échec — le déploiement
        # aboutit côté serveur). Sans retry, un seul 502 sur l'une des ~60 fonctions
        # faisait échouer TOUT le job alors que prod était saine (incident run #440,
        # merge go-2 : 502 sur verify-document → re-run manuel nécessaire).
        # On continue la boucle même si une fonction échoue définitivement, puis on
        # fait échouer le job à la fin si besoin → un vrai problème de code reste
        # détecté (les 3 essais échouent), mais un 502 isolé ne bloque plus rien.
        run: |
          set -uo pipefail
          cd supabase/functions

          deploy_with_retry() {
            local fn="$1" attempt=1 max=3
            local jwt_mode=""
            local jwt_args=()

            # `--use-api` ne lit pas de manière fiable le verify_jwt de
            # config.toml. On traduit donc explicitement la configuration en
            # argument CLI, et on refuse le déploiement si la fonction n'est
            # pas inventoriée : une nouvelle fonction ne doit jamais hériter
            # silencieusement d'un mode JWT différent de celui qui a été revu.
            jwt_mode="$(
              awk -v target="[functions.${fn}]" '
                $0 == target { in_section = 1; next }
                in_section && /^\[/ { exit }
                in_section && $1 == "verify_jwt" { print $3; exit }
              ' ../config.toml
            )"
            case "$jwt_mode" in
              false) jwt_args=(--no-verify-jwt) ;;
              true) jwt_args=() ;;
              *)
                echo "::error::Configuration verify_jwt absente ou invalide pour $fn"
                return 1
                ;;
            esac

            while [ "$attempt" -le "$max" ]; do
              if supabase functions deploy "$fn" \
                   "${jwt_args[@]}" \
                   --project-ref "$SUPABASE_PROJECT_REF" \
                   --use-api; then
                return 0
              fi
              echo "::warning::Déploiement de $fn échoué (tentative $attempt/$max) — nouvel essai dans $((attempt * 5))s…"
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "::error::Déploiement de $fn échoué après $max tentatives"
            return 1
          }

          failed_fns=""
          for dir in */; do
            fn="${dir%/}"
            if [ -f "$fn/index.ts" ]; then
              echo "::group::Deploying $fn"
              if ! deploy_with_retry "$fn"; then
                failed_fns="$failed_fns $fn"
              fi
              echo "::endgroup::"
            fi
          done

          if [ -n "$failed_fns" ]; then
            echo "::error::Edge functions non déployées après retries :$failed_fns"
            exit 1
          fi
          echo "Toutes les edge functions déployées."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Supprimer les Edge Functions retirées
        run: |
          set -euo pipefail
          remote_functions="$(supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json)"

          for fn in $RETIRED_EDGE_FUNCTIONS; do
            if jq -e --arg fn "$fn" \
              'if type == "array" then . else (.functions // []) end
               | any(.[]; ((.slug // .name // "") == $fn))' \
              <<<"$remote_functions" >/dev/null; then
              supabase functions delete "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --yes
            else
              echo "$fn déjà absent du projet distant."
            fi
          done

          remote_functions="$(supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json)"
          for fn in $RETIRED_EDGE_FUNCTIONS; do
            if jq -e --arg fn "$fn" \
              'if type == "array" then . else (.functions // []) end
               | any(.[]; ((.slug // .name // "") == $fn))' \
              <<<"$remote_functions" >/dev/null; then
              echo "::error::La fonction retirée $fn existe encore à distance."
              exit 1
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Vérifier la configuration Stripe production
        run: |
          set -euo pipefail
          ready=false
          code=000
          echo '{}' > /tmp/stripe-health.json

          # Laisser le temps à la nouvelle version Edge de se propager et
          # absorber un 429/5xx transitoire de Supabase ou Stripe.
          for attempt in 1 2 3; do
            if ! code=$(curl -sS --connect-timeout 10 --max-time 45 \
              -o /tmp/stripe-health.json -w '%{http_code}' \
              -X POST "$SUPABASE_URL/functions/v1/stripe-config-health" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              --data '{}'); then
              code=000
            fi

            if [ "$code" = '200' ] \
              && jq -e '.production_ready == true' /tmp/stripe-health.json >/dev/null 2>&1; then
              ready=true
              break
            fi

            echo "::warning::Healthcheck Stripe non prêt (tentative $attempt/3, HTTP $code)."
            [ "$attempt" = '3' ] || sleep $((attempt * 5))
          done

          # La réponse ne contient que des booléens/états, jamais les secrets.
          jq . /tmp/stripe-health.json 2>/dev/null || echo '{"production_ready":false}'
          if [ "$ready" != 'true' ]; then
            echo "::error::Configuration Stripe production incomplète ou incohérente (HTTP $code)."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Sonder puis activer les crons Edge critiques
        run: |
          set -euo pipefail

          rpc() {
            local function_name="$1"
            local payload="$2"
            local output_file="$3"
            local http_code

            http_code=$(curl -sS --connect-timeout 10 --max-time 45 \
              -o "$output_file" -w '%{http_code}' \
              -X POST "$SUPABASE_URL/rest/v1/rpc/$function_name" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload")

            if [ "$http_code" != '200' ]; then
              echo "::error::RPC $function_name en échec (HTTP $http_code). Les crons restent inactifs."
              jq . "$output_file" 2>/dev/null || true
              return 1
            fi
          }

          # La migration a recapturé les jobs en active=false. Chaque sonde
          # appelle le code Edge réellement déployé avec le secret cron dédié,
          # mais le header auth-only interdit tout effet métier.
          rpc fn_ops_sonder_crons_edge_critiques '{}' /tmp/cron-probes.json
          if ! jq -e '
            type == "object"
            and length == 8
            and all(.[]; type == "number")
          ' /tmp/cron-probes.json >/dev/null; then
            echo "::error::La sonde n'a pas retourné exactement 8 request_id."
            jq . /tmp/cron-probes.json 2>/dev/null || true
            exit 1
          fi

          probes_payload=$(jq -cn \
            --slurpfile probes /tmp/cron-probes.json \
            '{p_sondes: $probes[0]}')
          probes_ready=false

          # pg_net est asynchrone. Polling borné à 90 secondes : aucune
          # activation sur timeout, 401, 429 ou 5xx.
          for attempt in $(seq 1 18); do
            rpc fn_ops_etat_sondes_crons_edge_critiques \
              "$probes_payload" /tmp/cron-probe-status.json

            if jq -e '.ready == true' /tmp/cron-probe-status.json >/dev/null; then
              if ! jq -e '
                .success == true
                and .ok == 8
                and .echecs == 0
                and .en_attente == 0
              ' /tmp/cron-probe-status.json >/dev/null; then
                echo "::error::Au moins une des 8 sondes Edge n'est pas HTTP 2xx."
                jq . /tmp/cron-probe-status.json
                exit 1
              fi
              probes_ready=true
              break
            fi

            echo "Sondes Edge en attente ($attempt/18)."
            [ "$attempt" = '18' ] || sleep 5
          done

          if [ "$probes_ready" != 'true' ]; then
            echo "::error::Délai dépassé pour les 8 sondes Edge. Les crons restent inactifs."
            jq . /tmp/cron-probe-status.json 2>/dev/null || true
            exit 1
          fi

          # Le contrôleur persiste les statuts et émet les alertes éventuelles
          # avant l'activation atomique liée aux request_id exacts de ce run.
          rpc fn_ops_controler_crons_edge_critiques \
            '{}' /tmp/cron-controller.json
          if ! jq -e '
            .success == true
            and .echecs == 0
          ' /tmp/cron-controller.json >/dev/null; then
            echo "::error::Le contrôleur des crons a détecté un échec."
            jq . /tmp/cron-controller.json
            exit 1
          fi

          activation_payload=$(jq -cn \
            --slurpfile probes /tmp/cron-probes.json \
            '{
              p_sondes: $probes[0],
              p_confirmation: "AUTH_PROBES_OK"
            }')
          rpc fn_ops_activer_crons_edge_critiques \
            "$activation_payload" /tmp/cron-activation.json
          if ! jq -e '
            .success == true
            and (.jobs_actives | length) == 9
          ' /tmp/cron-activation.json >/dev/null; then
            echo "::error::Activation atomique des crons critiques refusée."
            jq . /tmp/cron-activation.json
            exit 1
          fi

          rpc fn_ops_etat_activation_crons_edge_critiques \
            '{}' /tmp/cron-final-state.json
          if ! jq -e '
            .success == true
            and (.critiques_actifs | length) == 9
            and (.critiques_manquants | length) == 0
            and (.acquisition_active | length) == 0
          ' /tmp/cron-final-state.json >/dev/null; then
            echo "::error::État final invalide : 8 jobs + monitor doivent être actifs et l'acquisition inactive."
            jq . /tmp/cron-final-state.json
            exit 1
          fi

          jq . /tmp/cron-final-state.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Summary
        run: |
          echo "### Deploy Supabase ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations SQL appliquées (ou already-applied skip)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Edge functions redéployées depuis le repo" >> "$GITHUB_STEP_SUMMARY"
          echo "- Configuration Stripe live et webhooks vérifiée" >> "$GITHUB_STEP_SUMMARY"
          echo "- 8 crons Edge critiques + monitor activés après sondes HTTP 2xx ; acquisition inactive" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Projet : \`${{ secrets.SUPABASE_PROJECT_REF }}\`" >> "$GITHUB_STEP_SUMMARY"

# Re-trigger #269: migration 20260531123000 appliquee mais non enregistree
# dans schema_migrations (conversation interrompue) -> db push out-of-order.
# Enregistree ; ce commit relance le workflow pour confirmation verte.
