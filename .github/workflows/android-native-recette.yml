name: Android native simulation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'tests/native/android/**'
      - 'scripts/native/**'
      - '.github/workflows/android-native-recette.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-android:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            label: Android WebView — inscription, connexion et navigation
          - variant: optimized
            label: Android WebView R8 — inscription, connexion et navigation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      NATIVE_RECETTE: '1'
      NATIVE_RECETTE_VARIANT: ${{ matrix.variant }}
      VITE_NATIVE_BUILD: 'true'
      VITE_SUPABASE_URL: http://127.0.0.1:8904
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_native_fixture
      VITE_SUPABASE_ANON_KEY: sb_publishable_native_fixture
      VITE_SENTRY_DSN: ''
      VITE_TURNSTILE_SITE_KEY: ''
      VITE_ENV: test
      SENTRY_UPLOAD_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Installer le pilote Android de Playwright
        timeout-minutes: 3
        run: node node_modules/playwright/cli.js install android
      - name: Vérifier les tests structurels Python Android
        shell: bash
        run: |
          set -euo pipefail
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          python3 -m unittest discover -s tests/native/android -p 'test_*.py'
      - name: Vérifier les tests structurels Node Android
        shell: bash
        run: |
          set -euo pipefail
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          node --test tests/native/android/*.test.mjs
      - name: Construire le bundle web de recette Android
        shell: bash
        run: |
          set -euo pipefail
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          npm run build
      - name: Préparer la variante Android de recette isolée
        shell: bash
        run: |
          set -euo pipefail
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          node scripts/native/prepare-android-recette.mjs
      - name: Synchroniser Capacitor pour la recette Android
        shell: bash
        run: |
          set -euo pipefail
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          npx cap sync android
      - name: Assembler l’APK Android de recette
        id: compiler_assembly
        shell: bash
        run: |
          set -euo pipefail
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          python3 scripts/native/android_compiler_diagnostic.py
      - name: Conserver le diagnostic fermé de compilation
        if: ${{ !cancelled() && steps.compiler_assembly.outputs.diagnostic_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-compiler-diagnostic-${{ matrix.variant }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/android-compiler-diagnostic/diagnostic.json
          if-no-files-found: error
          retention-days: 7
      - name: Contrôler le DEX et le mapping de la recette R8
        shell: bash
        run: |
          set -euo pipefail
          export GIT_COMMIT_SHA="$(git rev-parse HEAD)"
          if [ "$NATIVE_RECETTE_VARIANT" = optimized ]; then
            python3 scripts/native/check_android_r8.py
          fi
      - name: Activer KVM sur le runner éphémère
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Simuler sur Android 15 avec clavier et bouton retour natifs
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disk-size: 4096M
          enable-hw-keyboard: false
          disable-animations: false
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/native/run-android-recette.sh
      - name: Conserver assertions et captures, y compris en échec
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-${{ matrix.variant }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/android-native/
          retention-days: 7
