    text: "Démonstration · Soins de suite 16"
- takeScreenshot: detail
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%, 50%"
          end: "90%, 50%"
          duration: 600
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible:
    id: "mission-card-demo-mission-016"
- assertNotVisible:
    id: "mission-city"
- takeScreenshot: retour
- pressKey: Home
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: false
# Android's Expo Go launcher opens HomeActivity, not the running experience.
