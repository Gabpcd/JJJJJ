<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <title>Jolene Santé — Missions soignants & remplacements vérifiés</title>
    <meta name="description" content="Jolene Santé connecte les établissements de santé et les soignants vérifiés (diplôme, RPPS, assurance) pour des missions et remplacements ponctuels. Inscription gratuite, contrats automatisés." />
    <meta name="author" content="Jolene SAS" />
    <meta name="theme-color" content="#E04590" />
    <meta name="color-scheme" content="light dark" />

    <!-- Perf : preconnect aux origines critiques (fonts + API Supabase) pour
         ouvrir les connexions TLS au plus tôt → LCP/FCP plus rapides.
         Police chargée ici en <link> (pas via @import CSS, render-blocking). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://flripxtsyegjshnhzjkz.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://flripxtsyegjshnhzjkz.supabase.co" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />

    <!-- Smart App Banner iOS : bannière native "Ouvrir dans l'app" sur Safari.
         À activer après publication App Store en remplaçant APP_STORE_ID par
         l'identifiant numérique attribué par Apple (App Store Connect).
         <meta name="apple-itunes-app" content="app-id=APP_STORE_ID, app-argument=https://jolene.app" /> -->

    <!-- iOS Safari / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jolene" />
    <meta name="application-name" content="Jolene" />

    <link rel="canonical" href="https://jolene.app/" />
    <link rel="manifest" href="/manifest.json?v=5" />
    <link rel="icon" href="/favicon-96.png?v=5" type="image/png" sizes="96x96" />
    <link rel="icon" href="/icon-192x192.png?v=5" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.ico?v=5" type="image/x-icon" sizes="any" />

    <!-- Apple touch icons (multiple sizes for different iOS devices) -->
    <link rel="apple-touch-icon" href="/icon-192x192.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192x192.png?v=5" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-192x192.png?v=5" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-192x192.png?v=5" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icon-192x192.png?v=5" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jolene Santé — Missions soignants & remplacements vérifiés" />
    <meta property="og:description" content="La plateforme qui connecte établissements de santé et soignants vérifiés pour des missions et remplacements ponctuels, en toute conformité." />
    <meta property="og:image" content="https://jolene.app/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://jolene.app" />
    <meta property="og:site_name" content="Jolene Santé" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jolene Santé — Missions soignants & remplacements vérifiés" />
    <meta name="twitter:description" content="La plateforme qui connecte établissements de santé et soignants vérifiés pour des missions et remplacements ponctuels, en toute conformité." />
    <meta name="twitter:image" content="https://jolene.app/og-default.png" />

    <!-- Données structurées d'entité : aide Google à reconnaître la marque
         « Jolene Santé » (alias « Jolene ») pour les requêtes de marque. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Jolene Santé",
      "alternateName": "Jolene",
      "url": "https://jolene.app",
      "logo": "https://jolene.app/logo-jolene-carre.png",
      "description": "Plateforme de mise en relation entre établissements de santé et soignants vérifiés pour des missions et remplacements ponctuels.",
      "areaServed": "FR",
      "knowsLanguage": "fr",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@jolene.app",
        "contactType": "customer support",
        "availableLanguage": "French"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
