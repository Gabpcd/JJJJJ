import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Signature release : lit android/keystore.properties (gitignoré, jamais commité).
// Un artefact release ne doit jamais être produit silencieusement non signé.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def requiredSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningKeys = hasKeystore
        ? requiredSigningKeys.findAll { !keystoreProperties[it]?.toString()?.trim() }
        : requiredSigningKeys
def configuredStoreFile = missingSigningKeys.isEmpty()
        ? file(keystoreProperties['storeFile'])
        : null
def releaseSigningReady = hasKeystore && missingSigningKeys.isEmpty() && configuredStoreFile?.exists()
def googleServicesFile = file('google-services.json')
def assetLinksFile = file('src/main/assets/public/.well-known/assetlinks.json')
def sha256FingerprintPattern = ~/(?i)^[0-9A-F]{2}(:[0-9A-F]{2}){31}$/
def assetLinksReady = false
if (assetLinksFile.exists()) {
    try {
        def document = new JsonSlurper().parse(assetLinksFile)
        assetLinksReady = document instanceof List && document.any { entry ->
            def fingerprints = entry?.target?.sha256_cert_fingerprints
            entry?.relation?.contains('delegate_permission/common.handle_all_urls') &&
                    entry?.target?.namespace == 'android_app' &&
                    entry?.target?.package_name == 'app.jolene' &&
                    fingerprints instanceof List && !fingerprints.isEmpty() &&
                    fingerprints.every { it instanceof String && it ==~ sha256FingerprintPattern }
        }
    } catch (Exception ignored) {
        assetLinksReady = false
    }
}
def releaseArtifactTasks = ['assembleRelease', 'bundleRelease', 'packageRelease']
def releaseBlockers = {
    def details = []
    if (!hasKeystore) details << 'android/keystore.properties absent'
    if (hasKeystore && !missingSigningKeys.isEmpty()) {
        details << "propriétés manquantes: ${missingSigningKeys.join(', ')}"
    }
    if (hasKeystore && missingSigningKeys.isEmpty() && !configuredStoreFile?.exists()) {
        details << 'fichier keystore introuvable'
    }
    if (!googleServicesFile.exists()) details << 'android/app/google-services.json absent'
    if (!assetLinksReady) details << 'assetlinks.json sans empreinte SHA-256 de release'
    return details
}
def failReleaseIfNeeded = {
    def details = releaseBlockers()
    if (!details.isEmpty()) {
        throw new GradleException(
                "RELEASE ANDROID BLOQUÉE — ${details.join(' ; ')}. " +
                "Configurez la signature, Firebase et App Links avant bundleRelease/assembleRelease."
        )
    }
}

// Échec dès la configuration pour les commandes explicites : le message reste
// utile même sur une machine où le SDK Android n'est pas encore installé.
def cliRequestsReleaseArtifact = gradle.startParameter.taskNames.any { requested ->
    def taskName = requested.tokenize(':').last()
    releaseArtifactTasks.contains(taskName) || taskName.startsWith('publishRelease')
}

android {
    namespace = "app.jolene.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.jolene"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile configuredStoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

if (cliRequestsReleaseArtifact) failReleaseIfNeeded()

// lintRelease reste exécutable sans secret. Seules les tâches qui produisent
// ou publient réellement un APK/AAB release sont stoppées avec un message clair.
gradle.taskGraph.whenReady { graph ->
    def requestsReleaseArtifact = graph.allTasks.any { task ->
        task.project == project && (
                releaseArtifactTasks.contains(task.name) ||
                task.name.startsWith('publishRelease')
        )
    }
    if (requestsReleaseArtifact) failReleaseIfNeeded()
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
